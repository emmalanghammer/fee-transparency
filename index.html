    setupExit: false,       // the "leave setup?" confirmation over the wizard
    lvlSel: 'all',          // 'all' | 'Property' | 'Unit Type' | 'Unit' | 'ORI'
    bannerDismissed: {},
    pricePreview: null,     // { prop, unit, opt:{}, sitOpen }
    profMenu: null,
    recView: null,
    recViewNote: true,
    rowMenu: null,
    // The register's "Fee Transparency" column is opt-in, so the default view matches today's.
    showProfileCol: false,
    // Properties whose complete pricing has been published from the Fee Transparency page.
    publishedProps: {},
    pubModal: null, // { prop, ack } — Publish Complete Pricing confirmation
    mktSetup: false, // Marketing Setup overlay (opened from the action rail's copy flyout)
    mktAdv: false, // Advanced Settings overlay on top of Marketing Setup
    ftSel: null, // { mode:'pub'|'setup' } — Select Properties dialog on the tracker
    ltProp: 'all', // Listings page property filter
    petTypes: [
      { name:'Dog', desc:'', rec:25, recMax:50, recPer:true, one:0, oneMax:0, onePer:false, dep:200, depMax:400, depPer:true },

    ],

    spNav: 'Tenant Charge Setup', // System Preferences left-nav selection
    spBanner: true, // System Preferences Fee Transparency banner not yet dismissed

    // "Exclude Charge" overlay: { id, scope:'Unit Type'|'Unit', sel:{name:true} }. A charge's own
    // exclusions live on the row as exclFrom:{ types:[], units:[] }.
    chargeExcl: null,

    toast: null
  };

  // ---------- properties (the top-level entity; fee profiles hang off these) ----------
  propertiesData(){
    return (this.state.newProps || []).concat([
      { name:'Riverview Apartments', short:'RIVER', email:'stewart@riverviewapts.com', manager:'Stewart Chandler', addr:'1492 Loveland-Madeira Road, Loveland, OH 45140', billing:'1492 Loveland-Madeira Road, Loveland, OH 45140', color:'#1570ef', loc:'Loveland, OH', units:50, occupied:30, owner:'Thompson Family Trust', logo:'assets/logo-riverview.png' },
      { name:'The Berkshires', short:'BERK', email:'malik@theberkshires.com', manager:'Malik Roberson', addr:'4321 Loveland-Miamiville Rd, Loveland, OH 45140', billing:'9876 Socialville-Fosters Rd, Mason, OH 45040', color:'#1570ef', loc:'Loveland, OH', units:64, occupied:58 },
      { name:'The Windermere', short:'WIND', email:'kiana@thewindermere.com', manager:'Kiana Booker', addr:'1234 Tylersville Rd, West Chester, OH 45069', billing:'5678 Fields Ertel Rd, Cincinnati, OH 45249', color:'', loc:'West Chester, OH', units:42, occupied:39 },
      { name:'The Estates', short:'ESTATE', email:'zack@theestates.com', manager:'Zackary Nixon', addr:'1357 Milford-Blanchester Rd, Milford, OH 45150', billing:'2468 Morrow-Rossburg Rd, Morrow, OH 45152', color:'#d92d20', loc:'Milford, OH', units:88, occupied:71 },
      { name:'Willow Creek', short:'WILLOW', email:'jaquan@willowcreek.com', manager:'Jaquan Fry', addr:'9012 Lebanon Rd, Maineville, OH 45039', billing:'3579 Columbia Rd, South Lebanon, OH 45065', color:'#12a150', loc:'Maineville, OH', units:36, occupied:33 },
      { name:'Greenbriar Village', short:'GREENB', email:'jaqueline@greenbriarvillage.com', manager:'Jaqueline Rush', addr:'4680 Wilmington Rd, Clarksville, OH 45113', billing:'5791 Jamestown-New Jasper Rd, Jamestown, OH 45335', color:'', loc:'Clarksville, OH', units:24, occupied:20 },
      { name:'Oakwood Manor', short:'OAKMAN', email:'bryan@oakwoodmanor.com', manager:'Bryan Ashley', addr:'6802 Paintersville-New Jasper Rd, Xenia, OH 45385', billing:'7913 Bellbrook-Sugarcreek Rd, Bellbrook, OH 45305', color:'', loc:'Xenia, OH', units:72, occupied:64 },
      { name:'Pinewood Place', short:'PINEPL', email:'arley@pinewoodplace.com', manager:'Arley Harrell', addr:'8024 Franklin St, Spring Valley, OH 45370', billing:'9135 Dayton-Xenia Rd, Beavercreek, OH 45434', color:'', loc:'Spring Valley, OH', units:18, occupied:15 },
      { name:'Cedar Ridge', short:'CRIDGE', email:'shea@cedarridge.com', manager:'Shea Ferry', addr:'0246 Indian Ripple Rd, Dayton, OH 45440', billing:'1357 Miamisburg-Centerville Rd, Dayton, OH 45459', color:'#f58220', loc:'Dayton, OH', units:56, occupied:49 },
      { name:'The Highlands', short:'HIGH', email:'kobe@thehighlands.com', manager:'Kobe Mccarty', addr:'2468 Far Hills Ave, Kettering, OH 45419', billing:'3579 Whipp Rd, Centerville, OH 45458', color:'#1570ef', loc:'Kettering, OH', units:44, occupied:40 },
      { name:'Valley Forge', short:'VALLEY', email:'jayson@valleyforge.com', manager:'Jayson Locklear', addr:'4680 Yankee St, Dayton, OH 45458', billing:'5791 Social Row Rd, Mason, OH 45040', color:'#737373', loc:'Dayton, OH', units:30, occupied:22 },
      { name:'The Arbors', short:'ARBORS', email:'rylee@thearbors.com', manager:'Rylee Herron', addr:'6802 Butler Warren Rd, Mason, OH 45040', billing:'7913 Columbia Rd, Kings Mills, OH 45034', color:'#13314c', loc:'Mason, OH', units:60, occupied:52 },
      { name:'Stonegate Village', short:'STONEG', email:'neha@stonegatevillage.com', manager:'Neha Walter', addr:'8024 Western Row Rd, Maineville, OH 45039', billing:'9135 Irwin Simpson Rd, Mason, OH 45040', color:'#12a150', loc:'Maineville, OH', units:58, occupied:39 },
      { name:'The Hamptons', short:'HAMPTON', email:'zavier@thehamptons.com', manager:'Zavier Burks', addr:'0246 Fields Ertel Rd, Cincinnati, OH 45241', billing:'1357 Loveland Madeira Rd, Loveland, OH 45140', color:'#f58220', loc:'Cincinnati, OH', units:34, occupied:31 }
    ]);
  }
  // Properties whose charges can be copied when adding a property.
  copyableProfiles(){ return this.propertiesData().map(p=>p.name).filter(n=>this.usingProfile(n)); }
  propNames(){ return this.propertiesData().map(p => p.name); }
  propInfo(name){ const n = name || this.state.property; return this.propertiesData().find(p => p.name === n) || this.propertiesData()[0]; }
  properties(){ return this.propertiesData(); }

  // ---------- per-property Fee Transparency ----------
  // Properties that already have Fee Transparency on — the register's "Fee Transparency"
  // column. Opening one of these lands on the populated profile; the rest land on pre-setup.
  seededProfiles(){
    // Nobody starts set up — the tracker opens with every property at Not Set Up so the demo walks
    // the real first-run journey. Setting up a property writes profileStatus/profileFees.
    return [];
  }
  usingProfile(p){ return this.profStatus(p) === 'active'; }
  profStatus(p){
    const n = p || this.state.property;
    return this.state.profileStatus[n] || (this.seededProfiles().indexOf(n) >= 0 ? 'active' : 'none');
  }
  ilsOn(p){ return !!this.state.ilsProps[p || this.state.property]; }
  // The MITS 5.0 / listing fields a charge must carry before it can be marketed.
  mitsFields(){
    return [
      { key:'name',        label:'Name' },                                 // MITS: Name
      { key:'category',    label:'Charge Category' },                      // MITS: Code
      { key:'requirement', label:'Charge Requirement' },                   // MITS: Requirement
      { key:'feeDue',      label:'Fee Due' },                              // MITS: Lifecycle
      { key:'schedule',    label:'Charge Schedule', recurringOnly:true }   // MITS: Payment Frequency
    ];
  }
  // Charge Category resolves from the charge-type -> category map, so it only counts as missing
  // when a type has no mapping. Everything else — including the marketing Name, which is distinct
  // from the charge's operational name — must be entered by the user.
  // Best-guess MITS charge requirement from the charge type and comment. Situational charges only
  // apply when a condition is met; optional ones are tenant-selected add-ons; everything else
  // (rent, utilities, admin, deposits, application) is required.
  inferRequirement(r){
    const code = String(r.mits || '').toUpperCase();
    const text = ((r.desc || '') + ' ' + (r.name || '')).toLowerCase();
    // Damage and violation charges are conditions, not choices — checked before the pet rules so a
    // pet damage charge doesn't read as an add-on.
    if (/^(LATE|LC|NSF|DAMAGE|VIOLATION|LEGAL)/.test(code) || /\bdamage\b/.test(text)) return 'Situational';
    if (/^PET/.test(code) || /\bpets?\b/.test(text)) return 'Optional';
    if (/^(SF|STORAGE|COVPARK|PARK|PARKING|GARAGE|HOLD|AMENFEE|AMENITY|UPGRADE|TECH|CABLE|TRANSFER|EVCHG)/.test(code)) return 'Optional';
    if (/\b(optional|add-?on|valet|storage|parking|garage|reservation|locker|access)\b/.test(text)) return 'Optional';
    return 'Required';
  }
  // The requirement chosen for a charge during setup (falls back to the inferred value).
  // Blank until the user picks one — setup shouldn't guess a requirement on their behalf. Charges
  // left unset land in the Individual Charges group and get flagged as missing the MITS field.
  // Which selected property step 2 is currently reviewing.
  setupCurProp(){ const c = this.state.setup; if (!c) return ''; return this.setupProps()[c.pi || 0] || ''; }
  // Requirement comes from the charge's group when marketing details haven't been saved yet.
  defaultRequirement(r){
    const g = String(r.group || '');
    // 'ind' means no requirement was ever chosen, so there's nothing to fall back on.
    if (g.indexOf('ind') === 0) return '';
    return g.indexOf('opt') === 0 ? 'Optional' : g.indexOf('sit') === 0 ? 'Situational' : 'Required';
  }
  // ---------- Charges history ----------
  // Preloaded demo history, running up to today. Keyed to charge codes so it only surfaces for
  // charges the property actually has. Keys sort as 'YYYY-MM'; anything after this is tracked live.
  profileAmountSeed(){
    return {
      GARBAG:     { by:'Devon Marsh',    hist:[['2025-01','$25.00'],['2026-01','$26.00'],['2026-07','$28.00']] },
      GARBAGEFEE: { by:'Devon Marsh',    hist:[['2026-01','$4.00']] },
      ADMIN:      { by:'Admin',          hist:[['2025-01','$125.00'],['2026-01','$150.00']] },
      APPFEE:     { by:'Rachel Hodges',  hist:[['2025-01','$50.00'],['2026-01','$50.00']] },
      AMENFEE:    { by:'Admin',          hist:[['2025-01','$25.00'],['2026-01','$28.00']] },
      PETFEE:     { by:'Devon Marsh',    hist:[['2025-01','$35.00'],['2026-01','$45.00']] },
      DP:         { by:'Admin',          hist:[['2025-01','$450.00'],['2026-01','$500.00']] },
      HOLD:       { by:'Rachel Hodges',  hist:[['2026-01','$200.00']] }
    };
  }
  histLabel(k){
    if (k === 'now') return 'Just now';
    if (k === 'pre') return 'Earlier';
    const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const p = String(k).split('-');
    return mo[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }
  // ---------- change tracking ----------
  // Records something the user did in this session. Every profile mutation routes through here so
  // the history keeps up rather than being seeded fiction.
  logChange(prop, charge, change, level, extra){
    const e = Object.assign({ prop, by: 'Emma Langhammer', charge, change, level: level || prop }, extra || {});
    this.setState(s => ({ histLog: s.histLog.concat([e]) }));
  }
  histLabelFor(r){ return (r.mits ? r.mits + ' · ' : '') + (r.desc || (r.listing && r.listing.name) || r.name || 'Charge'); }
  // Field-by-field diff so an edit logs what actually changed instead of a bare "edited".
  chargeDiff(a, b){
    const out = [];
    const la = this.resolvedListing(a), lb = this.resolvedListing(b);
    const cmp = (label, x, y) => {
      const sx = x == null ? '' : String(x), sy = y == null ? '' : String(y);
      if (sx === sy) return;
      out.push(label + ' ' + (sx || '—') + ' → ' + (sy || '—'));
    };
    cmp('Amount', a.amount, b.amount);
    cmp('Charge Type', a.mits, b.mits);
    cmp('Comment', a.desc, b.desc);
    cmp('Charge Application', a.target || a.level, b.target || b.level);
    cmp('Amount Method', a.amtMethod, b.amtMethod);
    // "Every Month" and "Every 1 Month" are the same frequency written two ways — compare the
    // multiplier so re-saving a converted charge doesn't read as a change.
    const freqKey = v => { const s = String(v || ''); if (!s) return ''; const m = s.match(/\d+/);
      return (m ? m[0] : '1') + ' ' + s.replace(/Every\s*|\d+\s*/gi, '').trim(); };
    if (freqKey(a.freq) !== freqKey(b.freq)) cmp('Frequency', a.freq, b.freq);
    cmp('Name', la.name, lb.name);
    cmp('Marketing Description', la.marketing, lb.marketing);
    cmp('Charge Requirement', la.requirement, lb.requirement);
    cmp('Fee Due', la.feeDue, lb.feeDue);
    cmp('Charge Schedule', la.schedule, lb.schedule);
    cmp('Situational Description', a.cond, b.cond);
    cmp('Amount Distribution', a.creDist, b.creDist);
    cmp('Divide', a.creDivide, b.creDivide);
    cmp('User Defined Field', a.creUdf, b.creUdf);
    if (!!la.refundable !== !!lb.refundable) out.push('Refundable turned ' + (lb.refundable ? 'on' : 'off'));
    if (!!a.ils !== !!b.ils) out.push(b.ils ? 'Included on listings' : 'Excluded from listings');
    return out;
  }
  // Logs a charge edit and, when the amount moved, carries the before/after so the amount timeline
  // can pick it up too.
  logChargeEdit(before, after){
    const diff = this.chargeDiff(before, after);
    if (!diff.length) return;
    // chargeId is what makes the log entry link back to the charge; amtFrom/amt additionally feed

  // ================= PROPERTIES REGISTER =================
  // Properties the bulk setup can act on — the ones without a profile yet.
  bulkSetupCandidates(){ return this.propertiesData().filter(p => this.profStatus(p.name) !== 'active'); }
  // ---------- Fee Transparency tracker (mock 2651-48385) ----------
  // Where each property stands: not set up, charges missing details, ready, or published.
  ftStatus(p){
    const rows = this.profileRows(p);
    const active = this.profStatus(p) === 'active';
    const published = !!this.state.publishedProps[p];
    const ils = this.ilsOn(p);
    const short = rows.filter(r => !this.mitsComplete(r)).length;
    // Fee Transparency off entirely.
    if (!active) return { key:'none', order:4, icon:'settings', color:'#b3b3b3',
      pricing:'Not set up', next:'Set Up Fee Transparency', act:'setupOpen' };
    // On, but the property doesn't advertise — nothing to publish, so it's done as it stands.
    if (!ils) return { key:'notEnabled', order:6, icon:'verified', color:'#6eb744',
      pricing:'Done - Not enabled for listings', next:'View Charges', act:'openFeeProfile' };
    if (short) return published
      ? { key:'pubshort', order:1, icon:'warning', color:'#faa61c',
          pricing:'Published - Fee(s) missing', pricingColor:'#eb343c', next:'Add Charge Details', act:'openFeeProfile', issues:short }
      : { key:'short', order:2, icon:'warning', color:'#faa61c',
          pricing:'Not published, legacy pricing', next:'Add Charge Details', act:'openFeeProfile', issues:short };
    return published
      ? { key:'pub', order:5, icon:'verified', color:'#6eb744',
          pricing:'Done - Published', next:'View Charges', act:'openFeeProfile' }
      : { key:'ready', order:3, icon:'check_circle', color:'#008dd5',
          pricing:'Not published - Ready', next:'Publish Complete Pricing', act:'pubOpen' };
  }
  ftCounts(){
    const c = { none:0, needs:0, ready:0, done:0, pubshort:0, pub:0, notEnabled:0 };
    this.propertiesData().forEach(p => { const st = this.ftStatus(p.name);
      if (st.key === 'none') c.none++;
      else if (st.key === 'short') { c.needs++; }
      else if (st.key === 'pubshort') { c.needs++; c.pubshort++; }
      else if (st.key === 'ready') c.ready++;
      else { c.done++; if (st.key === 'pub') c.pub++; else c.notEnabled++; }
    });
    return c;
  }
  feeTransBody(){
    // Grouped by status in the order the work happens: published-but-incomplete first, then charges
    // needing details, ready to publish, not set up, and everything already finished.
    const filt = this.state.ftFilter || 'all';
    const group = k => (k==='short'||k==='pubshort') ? 'needs' : (k==='pub'||k==='notEnabled') ? 'done' : k==='ready' ? 'ready' : 'none';
    const all = this.propertiesData().slice()
      .sort((x, y) => (this.ftStatus(x.name).order - this.ftStatus(y.name).order) || x.name.localeCompare(y.name));
    const rows = filt === 'all' ? all : all.filter(p => group(this.ftStatus(p.name).key) === filt);

    const tiles = `<div style="display:flex;gap:16px;flex-wrap:wrap">
      ${tile('#008dd5','check_circle','#008dd5','Ready to publish',c.ready, '',

    </div>`;

    // ---- toolbar: search, saved filters, and a working Status filter ----
    const filtLabels = { all:'', ready:'Ready to publish', needs:'Charges need details', none:'Not set up', done:'Done' };
    const fopt = (v, t) => `<div data-act="ftFilterSet" data-arg="${v}" style="padding:7px 14px;font-size:14px;color:#13314c;cursor:pointer;white-space:nowrap" onmouseover="this.style.background='#f0f6fb'" onmouseout="this.style.background=''">${t}</div>`;
    const toolbar = `<div style="display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap">

    const avail = this.bulkSetupCandidates().map(p => p.name);
    const allOn = bs && avail.length && avail.every(n => bs.sel[n]);
    const headBox = !bs ? '' : `<span data-act="bulkSetupAll" style="display:flex;align-items:center;justify-content:center;height:28px;cursor:pointer">${box(!!allOn)}</span>`;
    const heads = ['Name'].concat(showProf ? ['Fee Transparency'] : []).concat(['Short Name','Email','Manager Name','Primary Address','Billing Address']);
    const header = `<div style="display:grid;grid-template-columns:${cols};background:#737373">${headBox}<span></span>${heads.map(hcell).join('')}<span style="display:flex;align-items:center;justify-content:center;height:28px"><span class="material-symbols-outlined" style="font-size:20px;color:#fff">view_column</span></span></div>`;
    const cell = (t, extra) => `<span style="padding:8px;font-size:14px;color:#13314c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${extra||''}">${t}</span>`;
    // The whole row navigates, so the name is plain navy text rather than a link. The kebab keeps its
    // own data-act and wins the closest() lookup, so it stays independently clickable.
    const body = rows.map(r => `<div data-act="${bs ? (pickable(r.name) ? 'bulkSetupToggle' : 'noop') : 'navProperty'}" data-arg="${r.name}" style="display:grid;grid-template-columns:${cols};align-items:center;background:${bs&&bs.sel[r.name]?'#eaf4fb':'#fff'};border-bottom:1px solid #ebf1f5;cursor:${bs&&!pickable(r.name)?'default':'pointer'}"${bs?'':` onmouseover="this.style.background='#f4f8fb'" onmouseout="this.style.background='#fff'"`}>
      ${!bs ? '' : `<span style="display:flex;align-items:center;justify-content:center">${pickable(r.name) ? box(!!bs.sel[r.name]) : ''}</span>`}
      <span style="align-self:stretch;background:${r.color||'transparent'}"></span>
      <span style="padding:8px;overflow:hidden"><span style="font-size:14px;color:#13314c;white-space:nowrap">${r.name}</span></span>
      ${!showProf ? '' : `<span style="display:flex;align-items:center;justify-content:center;padding:8px">${this.usingProfile(r.name)?`<span class="material-symbols-outlined" style="font-size:20px;color:#12a150" title="Fee Transparency is on">check_circle</span>`:''}</span>`}
      ${cell(r.short)}
      <span style="padding:8px;display:flex;align-items:center;gap:8px;min-width:0"><span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5);flex:none">mail</span><span style="font-size:14px;color:#13314c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.email}</span></span>
      ${cell(r.manager)}${cell(r.addr)}${cell(r.billing)}
      <span data-act="toast" data-arg="Row actions" style="display:flex;align-items:center;justify-content:center;cursor:pointer"><span class="material-symbols-outlined" style="font-size:20px;color:var(--ac,#008dd5)">more_vert</span></span>
    </div>`).join('');
    const nSel = bs ? Object.keys(bs.sel).length : 0;
    // Selection lives in a floating bar at the bottom and the toolbar above goes inert, so the only
    // thing to do while selecting is select.
    const selBar = !bs ? '' : `<div style="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:130;display:flex;align-items:center;gap:18px;background:var(--ac,#008dd5);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,0.28);padding:12px 14px 12px 20px;white-space:nowrap">
        <span style="font-size:15px;font-weight:600;color:#fff">Select properties</span>
        <span style="font-size:13px;color:rgba(255,255,255,0.85)">${nSel} of ${avail.length} selected</span>
        <button ${nSel?'data-act="bulkSetupGo"':''} style="height:34px;min-height:34px;padding:0 18px;border-radius:4px;font:400 14px Roboto,sans-serif;color:#fff;background:rgba(255,255,255,${nSel?'0.2':'0.08'});border:1px solid rgba(255,255,255,${nSel?'0.65':'0.3'});cursor:${nSel?'pointer':'default'}">Set Up Fee Transparency</button>
        <span data-act="bulkSetupCancel" class="material-symbols-outlined" style="font-size:24px;color:#fff;cursor:pointer">close</span>
      </div>`;
    const dim = bs ? 'opacity:0.45;pointer-events:none;' : '';
    return `<div style="padding:16px 24px;display:flex;flex-direction:column;gap:16px;flex:1;min-height:0">
      ${selBar}
      <div style="${dim}display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div style="display:flex;align-items:flex-end;gap:8px">
          <span style="position:relative;display:inline-flex">
            <button onclick="var p=document.getElementById('reg-bulk-pnl');p.style.display=(p.style.display==='block'?'none':'block')" class="btn-pri" style="height:36px;padding:0 10px 0 14px;border-radius:4px;font:400 14px Roboto,sans-serif;display:inline-flex;align-items:center;gap:6px">Bulk Actions<span class="material-symbols-outlined" style="font-size:20px">arrow_drop_down</span></button>
            <div id="reg-bulk-pnl" style="display:none;position:absolute;left:0;top:40px;z-index:1000;min-width:260px;background:#fff;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,0.18);overflow:hidden;padding:4px 0">
              ${(() => {
                const item = (t, act, arg) => `<div data-act="${act||'toast'}" data-arg="${arg!=null?arg:t}" style="padding:8px 16px 8px 28px;font-size:14px;color:var(--ac,#008dd5);cursor:pointer;white-space:nowrap" onmouseover="this.style.background='#f0f6fb'" onmouseout="this.style.background=''">${t}</div>`;
                const head = (t) => `<div style="padding:10px 16px 4px;font-size:14px;font-weight:600;color:#13314c">${t}</div>`;
                const rule = `<div style="height:1px;background:#ebf1f5;margin:5px 0"></div>`;
                return `<div data-act="toast" data-arg="Mass Edit Mode" style="display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:14px;color:var(--ac,#008dd5);cursor:pointer;white-space:nowrap" onmouseover="this.style.background='#f0f6fb'" onmouseout="this.style.background=''"><span class="material-symbols-outlined" style="font-size:18px">edit_square</span>Mass Edit Mode<div style="flex:1"></div><span style="font-size:13px;color:#8a9aa8">F2</span></div>${rule}`
                  + head('Service Manager') + item('Add Issue')
                  + head('Reports') + item('Report Writer')
                  + head('Communication') + item('Write Letters') + item('Send Email') + item('Send Text') + item('Add to Phone Broadcasts')
                  + head('History / Note') + item('Add Note');
              })()}
            </div>
          </span>
          <div style="display:flex;flex-direction:column;gap:4px;width:248px">
            <span style="font-size:14px;color:var(--ac,#008dd5)">Search</span>
            <div style="display:flex;align-items:center;gap:4px;height:36px;box-sizing:border-box;background:#fff;border:1px solid var(--ac,#008dd5);border-radius:4px;padding:0 8px">
              <span class="material-symbols-outlined" style="font-size:20px;color:var(--ac,#008dd5);flex:none">search</span>
              <span style="flex:1;min-width:0;font-style:italic;color:#b3b3b3;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Find a property</span>
              <span class="material-symbols-outlined" style="font-size:20px;color:#666;flex:none">keyboard_arrow_down</span>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;width:200px">
            <span style="font-size:14px;color:var(--ac,#008dd5)">Saved Filters</span>
            <div style="display:flex;align-items:center;gap:4px;height:36px;box-sizing:border-box;background:#fff;border:1px solid #cedbe7;border-radius:4px;padding:0 8px"><span style="flex:1;min-width:0;font-size:14px;color:#13314c">&lt; No Filter &gt;</span><span class="material-symbols-outlined" style="font-size:20px;color:#666">keyboard_arrow_down</span></div>
          </div>
          <span data-act="toast" data-arg="Filters" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;box-sizing:border-box;border:1px solid var(--ac,#008dd5);border-radius:4px;background:#fff;cursor:pointer"><span class="material-symbols-outlined" style="font-size:20px;color:var(--ac,#008dd5)">tune</span></span>
          <label style="display:inline-flex;align-items:center;gap:8px;height:36px;font-size:14px;color:var(--ac,#008dd5);cursor:pointer"><input type="checkbox" style="width:18px;height:18px;accent-color:#f58220;margin:0">Show Inactive</label>
          <!-- data-act sits on the input, not the label: a label click activates the input too, which
               would run the action twice and cancel itself out. -->
          <label style="display:inline-flex;align-items:center;gap:8px;height:36px;font-size:14px;color:var(--ac,#008dd5);cursor:pointer;white-space:nowrap"><input type="checkbox" data-act="toggleProfileCol" ${showProf?'checked':''} style="width:18px;height:18px;accent-color:#f58220;margin:0">Fee Transparency</label>
        </div>
        <button data-act="addPropOpen" class="btn-pri" style="height:36px;padding:8px 16px 8px 8px;border-radius:4px;font:400 14px Roboto,sans-serif;display:inline-flex;align-items:center;gap:8px"><span class="material-symbols-outlined" style="font-size:20px">add_circle</span>Add Property</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="border:1px solid #b3b3b3;border-radius:4px;overflow:hidden;background:#fff"><div style="overflow-x:auto"><div style="min-width:${showProf?1240:1060}px">${header}${body}</div></div></div>
        <div style="display:flex;justify-content:flex-end"><span style="font-size:12px;color:#b3b3b3">${rows.length} of 42 Properties</span></div>
      </div></div>`;
  }

  propGeneralBody(){
    const p=this.state.property;
    const P=this.propInfo(p);
    const lab=(t,link)=>`<div style="display:flex;align-items:center;gap:8px"><span style="font-size:13px;color:#666">${t}</span>${link?`<div style="flex:1"></div><a data-act="toast" data-arg="${link}" style="font-size:13px">${link}</a>`:''}</div>`;
    const input=(t,v,link)=>`<div style="display:flex;flex-direction:column;gap:4px;min-width:0">${lab(t,link)}<input class="fld" value="${v||''}" style="height:34px;box-sizing:border-box"></div>`;
    const select=(t,v)=>`<div style="display:flex;flex-direction:column;gap:4px;min-width:0">${lab(t)}<select class="fld" style="height:34px"><option>${v}</option></select></div>`;
    const check=(t,on)=>`<label style="display:inline-flex;align-items:center;gap:8px;font-size:14px;color:#424e5b;cursor:pointer"><input type="checkbox" ${on?'checked':''} style="accent-color:#f58220;width:16px;height:16px;margin:0">${t}</label>`;
    const tile=(title,right,inner)=>`<div class="tile"><div class="thead2"><span class="ttl">${title}</span><div style="flex:1"></div>${right||''}</div><div style="padding:16px;display:flex;flex-direction:column;gap:12px">${inner}</div></div>`;
    // Tiles in a row stretch to the tallest one rather than keeping ragged heights.
    const two=(a,b)=>`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;align-items:stretch">${a}${b}</div>`;
    // Tables run edge to edge inside their tile, like the Units tile — the tile supplies the border,
    // so the table draws none of its own and the last row skips its divider.
    const gtable=(cols,heads,rows)=>`<div style="overflow-x:auto"><div style="display:grid;grid-template-columns:${cols};background:#f5f8fa;border-bottom:1px solid #cedbe7">${heads.map((h,i)=>`<span style="padding:8px 12px${i===0?' 8px 16px':''};font-size:12px;font-weight:500;color:#666">${h}</span>`).join('')}</div>${rows.map((r,ri)=>`<div style="display:grid;grid-template-columns:${cols};align-items:center;${ri===rows.length-1?'':'border-bottom:1px solid #ebf1f5'}">${r.map((c,ci)=>`<span class="td" style="border:none${ci===0?';padding-left:16px':''}">${c}</span>`).join('')}</div>`).join('')}</div>`;
    // Tile whose body is a table: no padding, with an optional padded note underneath.
    const tileT=(title,right,inner,note)=>`<div class="tile"><div class="thead2"><span class="ttl">${title}</span><div style="flex:1"></div>${right||''}</div>${inner}${note?`<div style="padding:12px 16px;font-size:13px;color:#8a9aa8">${note}</div>`:''}</div>`;

    const thumb=()=>`<div style="position:relative;width:150px;height:130px;flex:none;background:repeating-conic-gradient(#eef2f5 0% 25%, #fff 0% 50%) 50% / 20px 20px;border:1px solid #ebf1f5;border-radius:4px"><span class="material-symbols-outlined" style="position:absolute;top:-8px;right:-8px;font-size:20px;color:var(--ac,#008dd5);background:#fff;border-radius:50%;cursor:pointer">cancel</span></div>`;
    const images = tile('Images', `<a data-act="toast" data-arg="Add Image" style="font-size:13px;display:inline-flex;align-items:center;gap:4px"><span class="material-symbols-outlined" style="font-size:18px">add</span>Add Image</a>`,
      `<div style="font-size:13px;color:#666">Marketing Images</div>
       <div style="display:flex;align-items:center;gap:16px">
         <span class="material-symbols-outlined" style="color:#666;cursor:pointer;flex:none">chevron_left</span>
         <div style="display:flex;gap:24px;flex:1;min-width:0;overflow-x:auto;padding-top:10px">${thumb()+thumb()+thumb()+thumb()}</div>
         <span class="material-symbols-outlined" style="color:#666;cursor:pointer;flex:none">chevron_right</span>
       </div>`);

    // General runs the full width of the page, so its fields sit three across instead of stacking.
    const gcols = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px';
    const general = tile(`General <span class="material-symbols-outlined" style="font-size:16px;color:var(--ac,#008dd5);vertical-align:-3px">info</span>`,'',
      `<div style="${gcols}">${input('Full Name', p)}${input('Short Name',P.short)}${select('Display Color','Apartment Complex')}</div>
       <div style="${gcols}">${input('Manager',P.manager)}${input('Email',P.email,'Manage Subscriptions')}
         <div style="display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end"><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="font-size:13px;color:#666">Property Type</span><select class="fld" style="height:34px">${this.ptOpts('Apartment')}</select></div><div style="padding-bottom:8px">${check('Active',true)}</div></div>
       </div>`);

    const address = tile('Primary Address', `<span data-act="toast" data-arg="Open addresses" class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5);cursor:pointer">open_in_new</span>`,
      `<div style="display:flex;align-items:center;border-bottom:1px solid #cedbe7">${['Primary','Alternate','Forwarding'].map((t,i)=>`<span data-act="toast" data-arg="${t} address" style="padding:8px 14px;font-size:13px;cursor:pointer;${i===0?'color:#13314c;font-weight:600;border-bottom:2px solid var(--ac,#008dd5)':'color:#666'}">${t}</span>`).join('')}<div style="flex:1"></div><span class="material-symbols-outlined" style="font-size:18px;color:#666">menu</span></div>
       <div style="border:1px solid #cedbe7;background:#f5f8fa;border-radius:4px;padding:10px 12px;font-size:14px;color:#13314c;line-height:1.5;min-height:56px;box-sizing:border-box">${P.addr}</div>
       <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">${check('Default',true)}<div style="flex:1"></div><a data-act="toast" data-arg="Use Management Company Address" style="font-size:13px">Use Management Company Address</a><a data-act="toast" data-arg="Address details" style="font-size:13px">Details</a></div>`);

    const logo = tile('Logo','',
      `<div style="font-size:13px;color:#666">Logo File</div>
       <div style="position:relative;width:217px;padding:6px 0">${P.logo?`<img src="${P.logo}" alt="${p} logo" style="width:217px;height:147px;object-fit:cover;border-radius:4px">`:`<div class="checker" style="width:217px;height:147px;border:1px solid #ebf1f5;border-radius:4px;display:flex;align-items:center;justify-content:center"><span style="font-size:13px;color:#8a9aa8">No logo</span></div>`}<span class="material-symbols-outlined" style="position:absolute;top:-2px;right:-10px;font-size:20px;color:var(--ac,#008dd5);background:#fff;border-radius:50%;cursor:pointer">cancel</span></div>`);

    const other = tile('Other Information','',
      `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        ${input('Property Tax ID','')}${select('Default Bank','1000 Fifth Third - Operating Bank Account For All Properties')}
        ${select('Rent Charge Types','4 Selected')}${select('Bank Settings','5 Selected')}
        ${input('Billing Name 1','PMC')}${select('Assign Service Issues','&lt;System Default&gt;')}
        ${input('Billing Name 2','')}${input('Posting Day','20')}
        ${input('Total Sq Ft','14,560')}${select('Default Inspector','Unassigned')}
      </div>`);

    const history = tileT('History / Notes', `<a data-act="toast" data-arg="Add Note" style="font-size:13px;display:inline-flex;align-items:center;gap:4px">Add Note<span class="material-symbols-outlined" style="font-size:16px">open_in_new</span></a>`,
      gtable('110px 160px 1fr',['Date','Type','Note'],[
        ['02/25/2026','Lease Renewal Offer','Lease Renewal Offer: Offer Declined'],
        ['02/25/2026','Survey','Survey Self Inspection: Inspection Sent to Tenant'],
        ['02/25/2026','Text Message','The signable document for tenant is waiting to be signed.'],
        ['02/25/2026','Service Issue','Tenant added to Ticket #471 in Service Manager'],
        ['02/25/2026','Email','Unit Inspection has been completed'],
        ['02/25/2026','Text Messages','The signable document for Tenant is waiting to be signed']]));

    const fiscal = tile('Fiscal Year','', select('Fiscal Year Start','January'));
    const tz = tile('Time Zone Offset','', `${select('Time Zone','(UTC-05:00) Eastern Time (US & Canada)')}${check('Automatically adjust for daylight saving time',true)}`);

    const phones = tileT('Phone Numbers', `<a data-act="toast" data-arg="Add Phone" style="font-size:13px">Add Phone</a>`,
      gtable('140px 1fr 100px',['Type','Number','Primary'],[
        ['Office','(513) 555-0142','<span class="material-symbols-outlined" style="font-size:18px;color:#3a7d2c">check</span>'],
        ['Leasing','(513) 555-0178',''],
        ['Maintenance','(513) 555-0195','']]));
    const udf = tileT('User Defined Fields', `<a data-act="toast" data-arg="Add Field" style="font-size:13px">Add Field</a>`,
      gtable('220px 1fr',['Field','Value'],[
        ['MITS Property ID','RIV-0125'],
        ['Regional Portfolio','Southwest Ohio']]));

    const recurring = this.recChargesTile('property');

    const emptyReg=(t,heads)=>tileT(t,'',gtable(heads.map(()=>'1fr').join(' '),heads,[heads.map(()=>'<span style="color:#b3b3b3">—</span>')]),
      `<span style="font-style:italic">No transactions in the current period</span>`);
    const files = tileT('Property Files', `<a data-act="toast" data-arg="Upload file" style="font-size:13px">Upload file</a>`,
      gtable('1fr 100px 140px',['Name','Type','Uploaded'],[
        ['Insurance-Certificate-2025.pdf','PDF','Mar 12, 2025'],
        ['W9-Thompson-Family-Trust.pdf','PDF','Jan 8, 2025'],
        ['Riverview-Site-Map.png','Image','Nov 2, 2024']]));

    let h='';
    h+=this.profileSetupBanner(p);
    h+=images;
    h+=general;
    h+=two(address,logo);
    h+=two(other,history);
    h+=recurring;
    h+=two(fiscal,tz);
    h+=two(phones,udf);
    h+=this.propUnitsBody();
    h+=two(emptyReg('Deposits Register',['Date','Description','Amount','Balance']),files);
    return h;
  }

  // Entry point 1 / resume / success banner shown atop a legacy property's General tab.
  propUnitsBody(){

        <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
          <span><span style="font-size:14px;font-weight:600;color:#13314c">${title}</span>${sub?`<span style="font-size:13px;color:#8a9aa8;font-style:italic;margin-left:8px">${sub}</span>`:''}</span>

  // Charge Level pill — Property / a unit-type name / Unit N / ORI.
  chargeLevelPill(r){
    const cls = { 'Property':'lvl-prop', 'Unit Type':'lvl-ut', 'Unit':'lvl-unit', 'ORI':'lvl-ori' }[r.level] || 'lvl-prop';
    const label = r.level === 'Unit Type' ? (r.target || 'Unit Type')
      : r.level === 'Unit' ? ('Unit ' + (r.target || ''))
      : r.level === 'ORI' ? 'ORI' : 'Property';
    return `<span class="lvl ${cls}">${label}</span>`;
  }
  // Marketing/MITS status for one charge. Hovering lists the exact fields still required, so the
  // work required is visible from the list without opening every charge.
  mitsStatusCell(r){
    const missing = this.mitsMissing(r);
    const pill = (t) => `<span style="display:inline-flex;align-items:center;gap:5px;background:#fdf3e3;border-radius:12px;padding:2px 9px;cursor:default"><span class="material-symbols-outlined" style="font-size:15px;color:#b35a00">error</span><span style="font-size:13px;color:#7a5a2a;white-space:nowrap">${t}</span></span>`;
    // One missing field is named outright; more than one needs the hover to list them.
    if (missing.length === 1) return pill('Needs ' + missing[0]);
    if (missing.length) {
      return `<span class="tipw" style="display:inline-flex">${pill(missing.length + ' needed')}<span class="tip" style="left:auto;right:-4px;top:26px;width:auto;min-width:190px;max-width:280px;padding:14px 16px"><span style="display:block;font-size:14px;font-weight:600;color:#13314c;padding-bottom:9px;border-bottom:1px solid #e3e9ee">${missing.length} fields still required:</span><span style="display:flex;flex-direction:column;gap:10px;padding-top:11px">${missing.map(n=>`<span style="font-size:14px;color:#13314c;white-space:nowrap">${n}</span>`).join('')}</span></span></span>`;
    }
    // Every field is in place; Include on listings decides whether the charge actually goes out.
    if (!r.ils) {
      return `<span style="display:inline-flex;align-items:center;gap:5px" title="All fields filled in — this charge isn't included on listings"><span class="material-symbols-outlined" style="font-size:17px;color:#8a9aa8">visibility_off</span><span style="font-size:13px;color:#8a9aa8;white-space:nowrap">Charge excluded</span></span>`;
    }
    return `<span style="display:inline-flex;align-items:center;gap:5px"><span class="material-symbols-outlined" style="font-size:17px;color:#12a150">check_circle</span><span style="font-size:13px;color:#13314c;white-space:nowrap">Charge ready</span></span>`;
  }
  levelCounts(){
    const rows = this.profileRows();
    const c = { all: rows.length, 'Property':0, 'Unit Type':0, 'Unit':0, 'ORI':0 };
    rows.forEach(r => { if (c[r.level] != null) c[r.level]++; });
    return c;
  }
  visibleRows(){
    const sel = this.state.lvlSel;
    return this.profileRows()
      .filter(r => sel === 'all' || r.level === sel)
      .filter(r => this.matchesFilters(r));
  }
  // Applied filter-panel criteria. Text fields honour the chosen Search Option.
  matchesFilters(r){
    const f = this.state.pfFilters; if (!f) return true;
    const op = f.op || 'Contains';
    const test = (needle, hay) => {
      if (!needle) return true;
      const n = String(needle).toLowerCase(), h = String(hay || '').toLowerCase();
      return op === 'Equals' ? h === n : op === 'Starts with' ? h.indexOf(n) === 0 : h.indexOf(n) >= 0;
    };
    const oneTime = /-one$/.test(r.group || '');
    if (f.type && f.type.length === 1) {
      if (f.type[0] === 'Recurring' && oneTime) return false;
      if (f.type[0] === 'One-Time' && !oneTime) return false;
    }
    if (!test(f.ctype, r.mits)) return false;
    if (!test(f.freq, r.freq)) return false;
    if (!test(f.name, (r.listing && r.listing.name) || r.name)) return false;
    if (!test(f.comment, r.desc)) return false;
    return true;
  }
  activeFilterCount(){
    const f = this.state.pfFilters; if (!f) return 0;
    let n = 0;
    if (f.type && f.type.length === 1) n++;
    ['ctype','freq','name','comment'].forEach(k => { if (f[k]) n++; });
    if (f.past) n++; if (f.future) n++;
    return n;
  }
  levelCountChip(label, count, key, icon){

    return `<span data-act="lvlSel" data-arg="${key}" class="chip${on?' on':''}">${icon?`<span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5)">${icon}</span>`:''}${label}<span class="cnt">${count}</span></span>`;
  }

    return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      ${this.levelCountChip('Total Charges', c.all, 'all')}
      ${this.levelCountChip('Property Charges', c['Property'], 'Property', 'home')}

      ${this.levelCountChip('Unit Charges', c['Unit'], 'Unit', 'apartment')}
      ${this.levelCountChip('ORI Charges', c['ORI'], 'ORI', 'inventory_2')}
      <label data-act="groupByReq" style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;margin-left:4px">${cb('Group by Requirement')}</label>
      <div style="flex:1"></div>
      ${(() => { const n = this.activeFilterCount(); const on = !!this.state.pfFilter || n > 0;
        return `<span data-act="pfFilterOpen" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;box-sizing:border-box;border:1px solid ${on?'var(--ac,#008dd5)':'#cedbe7'};border-radius:4px;background:${on?'#eaf4fb':'#fff'};cursor:pointer"><span class="material-symbols-outlined" style="font-size:20px;color:var(--ac,#008dd5)">tune</span>${n?`<span style="position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:var(--ac,#008dd5);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px">${n}</span>`:''}</span>`; })()}
      <span style="width:1px;height:24px;background:#cedbe7;margin:0 2px"></span>
      <button data-act="pricePreviewOpen" class="btn-out" style="height:36px;min-height:36px;padding:0 14px;border-radius:4px;font-size:14px;white-space:nowrap">Preview Pricing</button>
      <span style="position:relative;display:inline-flex">
        <button data-act="addopen" data-arg="req-rec" class="btn-pri" style="height:36px;min-height:36px;padding:0 14px;border-radius:4px 0 0 4px;font-size:14px;white-space:nowrap">Add Charge</button>
        <button onclick="var p=document.getElementById('pf-add-pnl');p.style.display=(p.style.display==='block'?'none':'block')" class="btn-pri" style="height:36px;min-height:36px;padding:0 6px;border-radius:0 4px 4px 0;border-left:1px solid rgba(255,255,255,0.35);font-size:14px"><span class="material-symbols-outlined" style="font-size:20px">arrow_drop_down</span></button>
        <div id="pf-add-pnl" style="display:none;position:absolute;right:0;top:40px;z-index:1000;min-width:210px;background:#fff;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,0.18);overflow:hidden">
          ${[['Add Recurring Charge','req-rec'],['Add One-Time Charge','req-one'],['Add CRE Recurring Charge','cre']].map(o=>`<div data-act="addopen" data-arg="${o[1]}" style="padding:11px 16px;font-size:14px;color:var(--ac,#008dd5);cursor:pointer;white-space:nowrap" onmouseover="this.style.background='#f0f6fb'" onmouseout="this.style.background=''">${o[0]}</div>`).join('')}
        </div>
      </span>
      <span data-act="profMenuOpen" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:36px;cursor:pointer"><span class="material-symbols-outlined" style="font-size:20px;color:var(--ac,#008dd5)">more_vert</span></span>
    </div>`;
  }
  profMenuHTML(){
    const p = this.state.profMenu; if (!p) return '';
    const left = Math.max(8, p.x - 260);
    const item = (t,act,arg) => `<div data-act="${act||'profAct'}" data-arg="${arg!=null?arg:t}" style="padding:10px 14px;font-size:14px;color:var(--ac,#008dd5);cursor:pointer;white-space:nowrap" onmouseover="this.style.background='#f0f6fb'" onmouseout="this.style.background=''">${t}</div>`;
    const on = this.ilsOn();
    const ilsItem = `<div data-act="ilsPropToggle" style="display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:14px;color:var(--ac,#008dd5);cursor:pointer;white-space:nowrap" onmouseover="this.style.background='#f0f6fb'" onmouseout="this.style.background=''"><span class="material-symbols-outlined" style="font-size:18px;color:${on?'#12a150':'#c9d4dd'}">${on?'check_box':'check_box_outline_blank'}</span>Market this property on online listings</div>`;
    return `<div data-act="profMenuClose" style="position:fixed;inset:0;z-index:150"></div>
      <div style="position:fixed;left:${left}px;top:${p.y}px;background:#fff;border:1px solid #cedbe7;border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,0.18);z-index:151;overflow:hidden;padding:4px 0">
        ${ilsItem}<div style="height:1px;background:#ebf1f5;margin:4px 0"></div>

        ${item('Charge History', 'profHistOpen')}${item('Fee Transparency','navFeeTrans')}
      </div>`;

  // Recurring / One-Time subtable inside a profile section.
  profileTable(kind, rows, group, opts){
    const rec = kind === 'rec';
    const noLabel = !!(opts && opts.noLabel);
    // The listing status column only appears on properties that market on online listings.
    const ils = this.ilsOn();
    // Bulk Update Charges selection mode leads every table with a checkbox column.
    const bs = this.state.bulkSel;
    // An exclusion tag rides in the Comment cell, so that column gets more room when any row has one
    // rather than squeezing the comment down to an ellipsis.
    const tagged = rows.some(r => this.exclCount(r));
    const cmt = tagged ? 'minmax(260px,1.5fr)' : 'minmax(160px,1fr)';
    const cols = (bs ? '44px ' : '') + (rec ? (ils ? `120px ${cmt} 110px 100px 90px 110px 120px 130px 40px`
                            : `120px ${cmt} 110px 100px 90px 110px 120px 40px`)
                     : (ils ? `120px ${cmt} 100px 90px 110px 120px 130px 40px`
                            : `120px ${cmt} 100px 90px 110px 120px 40px`));
    const allIds = rows.map(r => r.id).join(',');
    const allOn = rows.length && rows.every(r => bs && bs.sel[r.id]);
    const selBox = (on) => `<span style="width:18px;height:18px;border-radius:3px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex:none;${on?'background:#f58220;border:1px solid #f58220':'background:#fff;border:1px solid #b3b3b3'}">${on?'<span class="material-symbols-outlined" style="font-size:14px;color:#fff;font-weight:600">check</span>':''}</span>`;
    const selHead = !bs ? '' : `<span data-act="bulkSelAll" data-arg="${allIds}" style="display:flex;align-items:center;justify-content:center;padding:8px 0 8px 8px;cursor:pointer">${selBox(allOn)}</span>`;
    const selCell = r => !bs ? '' : `<span data-act="bulkSelToggle" data-arg="${r.id}" style="display:flex;align-items:center;justify-content:center;min-height:44px;padding-left:8px;cursor:pointer">${selBox(!!bs.sel[r.id])}</span>`;
    const heads = rec ? ['Charge Type','Comment','Frequency','From','To','Amount','Charge Level'].concat(ils?['Listing Ready']:[]).concat([''])
                      : ['Charge Type','Comment','From','To','Amount','Charge Level'].concat(ils?['Listing Ready']:[]).concat(['']);
    const hc = (t,i) => `<span style="display:flex;align-items:center;padding:8px 12px${i===0?' 8px 16px':''};font-size:12px;font-weight:600;color:#13314c;white-space:nowrap;${/Amount/.test(t)?'justify-content:flex-end;':''}">${t}</span>`;
    const cell = (t,extra) => `<span style="display:flex;align-items:center;min-height:44px;box-sizing:border-box;padding:8px 12px;font-size:14px;color:#13314c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${extra||''}">${t}</span>`;
    const body = rows.length ? rows.map(r => {
      const kebab = `<span data-act="rowMenu" data-arg="${r.id}" style="display:flex;align-items:center;justify-content:center;min-height:44px;cursor:pointer"><span class="material-symbols-outlined" style="font-size:20px;color:var(--ac,#008dd5)">more_vert</span></span>`;
      const mid = rec
        ? cell(this.freqNum(r)||'—') + cell(r.from||'—') + cell(r.to||'-')
        : cell(r.from||'—') + cell(r.to||'-');
      return `<div data-act="${bs?'bulkSelToggle':'rowDetails'}" data-arg="${r.id}" style="display:grid;grid-template-columns:${cols};align-items:center;border-bottom:1px solid #ebf1f5;cursor:pointer" onmouseover="this.style.background='#f7fafc'" onmouseout="this.style.background=''">
        ${selCell(r)}${r.propSpecific ? `<span style="display:flex;align-items:center;gap:6px;min-height:44px;box-sizing:border-box;padding:8px 12px 8px 16px;font-size:14px;color:#13314c;white-space:nowrap">${r.mits}<span class="tipw" style="flex:none" onclick="event.stopPropagation()"><span class="material-symbols-outlined" style="font-size:16px;color:#8a9aa8;cursor:default">lock</span><span class="tip" style="width:250px">${r.propSpecific==='NSF'?'NSF fee details are pulled from the property details':'Late fees are property specific and have special circumstances'} — only the marketing details can be edited from the Charges tab.</span></span></span>` : cell(r.mits,'padding-left:16px')}<span style="display:flex;align-items:center;gap:8px;min-height:44px;box-sizing:border-box;padding:8px 12px;font-size:14px;color:#13314c;min-width:0"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.desc||r.name}</span>${this.exclTag(r)}</span>${mid}${cell(String(r.amount||'').replace(/^\$/,''),'justify-content:flex-end;text-align:right')}
        <span style="display:flex;align-items:center;min-height:44px;padding:8px 12px">${this.chargeLevelPill(r)}</span>
        ${ils?`<span style="display:flex;align-items:center;min-height:44px;padding:8px 12px">${this.mitsStatusCell(r)}</span>`:''}${kebab}</div>`;
    }).join('') : `<div style="padding:14px 16px;font-size:13px;font-style:italic;color:#b3b3b3;border-bottom:1px solid #ebf1f5">No ${rec?'recurring':'one-time'} charges in this section.</div>`;
    const add = `<div data-act="addopen" data-arg="${group}" style="background:#f5f9fc;padding:9px 16px;cursor:pointer"><span style="display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ac,#008dd5)"><span class="material-symbols-outlined" style="font-size:18px">add</span>Add ${rec?'Recurring':'One-Time'} Charge</span></div>`;
    return `${noLabel?'':`<div style="font-size:13px;color:#666;padding:12px 20px 8px">${rec?'Recurring':'One-Time'}</div>`}
      <div style="padding:${noLabel?'4px':'0'} 20px 0;overflow-x:auto"><div style="min-width:${(rec?(ils?1020:900):(ils?950:830)) + (tagged?100:0) + (bs?44:0)}px;border:1px solid #cedbe7;border-radius:4px;overflow:hidden">
        <div style="display:grid;grid-template-columns:${cols};border-bottom:1px solid #cedbe7">${selHead}${heads.map(hc).join('')}</div>
        ${body}${add}</div></div>`;
  }
  // A charge's requirement comes from its marketing details; charges that haven't had one selected
  // yet fall into the "Individual Charges" group.
  reqOf(r){ return (r.listing && r.listing.requirement) || ''; }
  // Requirement-grouped section: Recurring + One-Time subtables under one requirement heading.
  profileSection(key, title, sub, rows, opts){
    const rec = rows.filter(r => !/-one$/.test(r.group));
    const one = rows.filter(r => /-one$/.test(r.group));
    const grp = key === 'opt' ? 'opt-' : key === 'sit' ? 'sit-' : 'req-';
    const inner = this.profileTable('rec', rec, grp+'rec') + this.profileTable('one', one, grp+'one');
    return this.acc(`${title} (${rows.length})`, sub, inner, null, 'pf-'+key, opts);
  }
  // Aggregate reminder of the MITS/listing work outstanding across the profile. Nothing outstanding
  // means nothing to say — the per-charge Listing Ready column already reads as done.
  mitsBanner(){
    const need = this.mitsIncompleteCount();
    const total = this.profileRows().length;
    const ils = this.ilsOn();
    // Marketing/MITS completeness only matters when the property publishes to online listings.
    if (!ils || !total) return '';
    const published = !!this.state.publishedProps[this.state.property];
    // Published and complete: these charges are the live pricing feed — say so.
    if (!need) return !published ? '' : `<div style="display:flex;align-items:flex-start;gap:10px;background:#eef7e9;border:1px solid #6eb744;border-radius:4px;padding:12px 16px">
      <span class="material-symbols-outlined" style="font-size:20px;color:#4d8a2a;flex:none;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24">verified</span>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
        <span style="font-size:13px;font-weight:600;color:#13314c;line-height:1.5">This property has published complete pricing.</span>
        <span style="font-size:13px;color:#13314c;line-height:1.5">These charges are the live feed for this property's listing pricing — changes you make here appear on listings with the next feed update.</span>

  infoTip(inner, width){

      + "if(y+h>window.innerHeight-8)y=window.innerHeight-8-h;if(y<8)y=8;"
      + "t.style.left=l+'px';t.style.top=y+'px';";
    const hide = "this.querySelector('.tipf').style.display='none';";
    return `<span onmouseenter="${show}" onmouseleave="${hide}" onclick="event.stopPropagation()" style="display:inline-flex"><span class="material-symbols-outlined" style="font-size:16px;color:var(--ac,#008dd5);cursor:pointer">info</span>`

  pricePreviewHTML(){
    const p = this.state.pricePreview; if (!p) return '';
    // On a marketed property the preview mirrors exactly what publishes, so it honours Include on
    // listings. Everywhere else nothing publishes at all, so it shows every charge — the point is to
    // see what a listing would look like, not what is being filtered out.
    const ilsProp = this.ilsOn(p.prop);
    const rows = ilsProp ? this.profileRows().filter(r => r.ils) : this.profileRows();
    const money = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
    const unit = this.unitInfo(p.unit);
    const amtOf = r => { const a = this.parseAmt(r.amount); if (a) return a; if (r.est != null) return r.est; return /market/i.test(r.amount||'') ? this.parseAmt(unit.rent) : 0; };
    // Charges with no requirement chosen yet ('ind') sit with the required ones, so a freshly
    // converted property still previews a price instead of an empty breakdown.
    const of = pre => rows.filter(r => r.group.indexOf(pre) === 0 || (pre === 'req' && r.group.indexOf('ind') === 0));
    const optRows = of('opt'), sitRows = of('sit');
    const monthly = of('req').filter(r => !/-one$/.test(r.group));
    const oneTime = of('req').filter(r => /-one$/.test(r.group));
    // One-time charges split by when they're actually collected, so a prospect can see what's due at
    // application versus at move-in. Anything without one of those two lands in a general group.
    const dueOf = r => (r.listing && r.listing.feeDue) || '';
    const atApp = oneTime.filter(r => dueOf(r) === 'At Application');
    const atMoveIn = oneTime.filter(r => dueOf(r) === 'Move-In');
    const otherOne = oneTime.filter(r => ['At Application','Move-In'].indexOf(dueOf(r)) < 0);
    const chosenOpt = optRows.filter(r => p.opt[r.id] && !/-one$/.test(r.group));
    const chosenOptOne = optRows.filter(r => p.opt[r.id] && /-one$/.test(r.group));
    const mTotal = monthly.reduce((n,r)=>n+amtOf(r),0) + chosenOpt.reduce((n,r)=>n+amtOf(r),0);
    const sum = rws => rws.reduce((n,r)=>n+amtOf(r),0);
    // A one-time add-on the prospect ticks is money due like any other one-time charge.
    const oTotal = sum(oneTime) + sum(chosenOptOne);
    const line = (l,v,bold) => `<div style="display:flex;align-items:baseline;justify-content:space-between;padding:5px 0"><span style="font-size:13px;color:${bold?'#13314c':'#4a5b6b'};${bold?'font-weight:600':''}">${l}</span><span style="font-size:13px;color:#13314c;${bold?'font-weight:600':''}">${v}</span></div>`;

    const optCb = r => `<label data-act="ppOpt" data-arg="${r.id}" style="display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer;font-size:14px;color:#13314c"><span style="width:18px;height:18px;border-radius:3px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex:none;${p.opt[r.id]?'background:#f58220;border:1px solid #f58220':'background:#fff;border:1px solid #b3b3b3'}">${p.opt[r.id]?'<span class="material-symbols-outlined" style="font-size:14px;color:#fff;font-weight:600">check</span>':''}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.name}</span><span style="font-size:13px;color:#4a5b6b;white-space:nowrap">${money(amtOf(r))}${/-one$/.test(r.group)?'/one-time':'/mo'}</span></label>`;
    const info = this.propInfo(p.prop);
    return `<div data-act="pricePreviewClose" style="position:fixed;inset:0;background:rgba(19,49,76,0.5);display:flex;align-items:center;justify-content:center;z-index:152">
      <div data-act="noop" style="width:940px;max-width:96vw;max-height:92vh;background:#fff;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,0.3);display:flex;flex-direction:column;overflow:hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #cedbe7"><span style="font-size:20px;color:#13314c">Pricing Preview</span><span style="display:inline-flex;align-items:center;gap:10px"><span data-act="toast" data-arg="Help" class="material-symbols-outlined" style="font-size:22px;color:var(--ac,#008dd5);cursor:pointer">help</span><span data-act="pricePreviewClose" class="material-symbols-outlined" style="font-size:22px;color:var(--ac,#008dd5);cursor:pointer">close</span></span></div>
        <div style="flex:none;background:#f5f8fa;border-bottom:1px solid #e3e9ee;padding:11px 20px;font-size:14px;color:#4a5b6b;line-height:1.45">${ilsProp

          : `${p.prop} isn't marketed on online listings, so every charge is shown here to preview how a listing would look.`}</div>
        <div style="flex:1;min-height:0;overflow-y:auto;display:flex;gap:0;flex-wrap:wrap">
          <div style="flex:1;min-width:300px;padding:16px 20px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box">
            <div style="font-size:14px;font-weight:600;color:#13314c;border-bottom:1px solid #ebf1f5;padding-bottom:8px">Select Unit</div>
            <div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:13px;color:#666">Property</span><div style="display:flex;align-items:center;height:36px;box-sizing:border-box;padding:0 12px;font-size:14px;color:#13314c;background:#eef2f5;border:1px solid #e3e9ee;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.prop}</div></div>

  // Change log for the property's profile: what changed and when, plus a per-charge amount timeline.

    const chargeLink = (id, inner, extra) => `<span data-act="rowDetails" data-arg="${id}" style="display:flex;align-items:center;min-height:38px;padding:6px 12px;font-size:13px;color:var(--ac,#008dd5);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${extra||''}" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${inner}</span>`;
    const money = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });

    // One expandable row per charge; expanding lists every change recorded for that charge.
    const acols = 'minmax(180px,1fr) 130px 110px 160px 140px 60px';
    const ahead = `<div style="display:grid;grid-template-columns:${acols};background:#f5f8fa;border-bottom:1px solid #cedbe7">${['Charge','Charge Level','Current','Change over time','Last changed by',''].map((t,i)=>hc(t,i)).join('')}</div>`;
    const abody = rows.map(r => {
      const key = String(r.id);

      const f = amtById[key];

      const delta = (() => {
        if (!f || f.hist.length < 2) return `<span style="font-size:13px;color:#8a9aa8">No change</span>`;
        const first = this.parseAmt(f.hist[0][1]), cur = this.parseAmt(f.hist[f.hist.length-1][1]);

        return `<span style="font-size:13px;color:${cur>first?'#b3261e':'#3a7d2c'};font-weight:500">${cur>first?'+':'−'}${money(Math.abs(cur-first))}</span><span style="font-size:12px;color:#8a9aa8">&nbsp;${f.hist[0][0]==='pre'?'this session':'since '+this.histLabel(f.hist[0][0])}</span>`;
      })();
      const lastBy = entries.length ? entries[0].by : (f ? f.by : '—');
      const sub = !open ? '' : `<div style="background:#f5f8fa;border-bottom:1px solid #ebf1f5;padding:6px 16px 12px 32px">${entries.length ? entries.map(e => `
        <div style="display:flex;align-items:flex-start;gap:14px;padding:7px 0;border-bottom:1px dashed #dce6ee">
          <span style="width:190px;flex:none;font-size:13px;color:#13314c;font-weight:500;line-height:1.45">${e.change}</span>
          <span style="width:78px;flex:none;font-size:12px;color:${e.k==='now'?'#12a150':'#8a9aa8'}">${this.histLabel(e.k)}</span>
          <span style="font-size:12px;color:#4a5b6b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.by}</span>
        </div>`).join('') : `<div style="padding:10px 0;font-size:13px;color:#8a9aa8">No changes recorded for this charge yet.</div>`}</div>`;
      return `<div style="border-bottom:1px solid #ebf1f5">
        <div data-act="profHistExp" data-arg="${key}" style="display:grid;grid-template-columns:${acols};align-items:center;cursor:pointer" onmouseover="this.style.background='#f4f8fb'" onmouseout="this.style.background=''">
          <span style="display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:38px;padding:6px 12px 6px 16px;font-size:13px;overflow:hidden;white-space:normal">

          </span>
          <span style="display:flex;align-items:center;min-height:38px;padding:6px 12px">${this.chargeLevelPill(r)}</span>
          ${td(String(r.amount||'—'),'font-weight:500')}
          <span style="display:flex;align-items:baseline;min-height:38px;padding:6px 12px;white-space:nowrap">${delta}</span>

    return `<div data-act="profHistClose" style="position:fixed;inset:0;background:rgba(19,49,76,0.5);display:flex;align-items:center;justify-content:center;z-index:120">
      <div data-act="noop" style="width:980px;max-width:96vw;max-height:92vh;background:#fff;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,0.3);display:flex;flex-direction:column;overflow:hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #cedbe7"><span style="font-size:20px;color:#13314c">Charge History</span><span style="display:inline-flex;align-items:center;gap:10px"><span data-act="toast" data-arg="Help" class="material-symbols-outlined" style="font-size:22px;color:var(--ac,#008dd5);cursor:pointer">help</span><span data-act="profHistClose" class="material-symbols-outlined" style="font-size:22px;color:var(--ac,#008dd5);cursor:pointer">close</span></span></div>
        <div style="flex:1;min-height:0;overflow-y:auto;background:#f5f8fa;padding:16px 20px;display:flex;flex-direction:column;gap:16px">
          <span style="font-size:13px;color:#4a5b6b">Every change made to the charges on <strong style="font-weight:600">${prop}</strong>, charge by charge.</span>
          ${tile('History by charge', rows.length ? 'Click a charge to see every change made to it' : '', rows.length ? `<div style="overflow-x:auto"><div style="min-width:800px">${ahead}${abody}</div></div>` : empty,
            rows.length ? `<a data-act="toast" data-arg="Export history" style="font-size:13px;color:var(--ac,#008dd5);cursor:pointer">Export</a>` : '')}
        </div>
        <div style="display:flex;justify-content:flex-end;padding:12px 20px;border-top:1px solid #cedbe7;background:#f5f8fa"><button data-act="profHistClose" class="btn-out" style="height:36px;min-height:36px;padding:0 28px;border-radius:4px;font-size:14px">OK</button></div>
      </div></div>`;
  }
  // Unit types present at this property, derived from its units.
  utData(){ const seen=[]; this.units().forEach(u=>{ if(!seen.some(t=>t.name===u.type)) seen.push({name:u.type,units:0,occ:0}); }); this.units().forEach(u=>{ const t=seen.find(x=>x.name===u.type); t.units++; if(u.tenant&&!/vacant/i.test(u.tenant)) t.occ++; }); return seen; }
  // Selected-scope header row (mirrors the property scoreboard) used by the Unit Type Fees and Unit Fees tabs.
  ufUnits(){ const p=this.state.property; return this.units().map(u=>Object.assign({}, u, { prop:p })); }
  recChargesTile(scope){

  // Shared Recurring Charges table.
  // opts.scope 'property' (default) shows property-level charges only; 'unit' also shows

  recChargesTableHTML(opts){
    opts=opts||{};
    const unit = opts.scope==='unit';
    const two = !!opts.twoComment;
    const rec = this.propertyCharges()
      .filter(f=>!f.excluded && !/-one$/.test(f.group))
      .filter(f=>unit || f.level==='Property');
    const lvlMap={ 'Property':{c:'#1570ef',l:'Property'}, 'Unit type':{c:'#d92d20',l:'Unit Type'}, 'Unit Type':{c:'#d92d20',l:'Unit Type'}, 'Unit':{c:'#099250',l:'Unit'}, 'ORI':{c:'#6a4aa8',l:'ORI'}, 'Tenant':{c:'#98a2b3',l:'Tenant'} };
    const recCols = two ? '32px 94px minmax(100px,1fr) minmax(120px,1fr) minmax(120px,1fr) 80px 92px 92px 110px' : '32px 94px minmax(110px,1fr) minmax(150px,1fr) 84px 96px 96px 124px';

    const recHead=`<div style="display:grid;grid-template-columns:${recCols}">${heads.map(h=>rh(h[0],h[1])).join('')}</div>`;
    const cell=(t,align,color)=>`<span style="display:flex;align-items:center;height:36px;box-sizing:border-box;padding:0 8px;font-size:14px;color:${color||'#13314c'};border-bottom:1px solid #ebf1f5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${align==='right'?'justify-content:flex-end;text-align:right':''}">${t}</span>`;

      const rowBg = (idx%2===1) ? '#f5f8fa' : '#fff';
      const mid = two ? `${cell(comment,'',commentColor||'#666')}${cell(comment2||'','',commentColor||'#666')}` : cell(comment,'',commentColor||'#666');
      return `<div style="display:grid;grid-template-columns:${recCols};background:${rowBg}">${barFor(bar)}${cell(level)}${cell(code)}${mid}${cell('Monthly','right')}${cell('01/01/2026')}${cell('—','','#b3b3b3')}${cell(amount,'right')}</div>`;
    };
    let idx=0;
    // Property-level charges (shown everywhere).
    let recRows=rec.map((f)=>{ const lv=lvlMap[f.level]||lvlMap['Property']; return row(idx++, lv.c, lv.l, f.mits, f.desc, f.amount); }).join('');
    if(unit){
      // Unit type charge trickles down.
      recRows += row(idx++, lvlMap['Unit type'].c, 'Unit Type', 'UTILITY', 'Additional trash valet', '$4.00');
      // Unit-level override example.
      const cmt=`Trash service<span style="margin-left:8px;background:#fdeedd;color:#b35a00;border-radius:4px;padding:1px 8px;font-size:12px">Override</span>`;
      const amt=`<s style="color:#8a9aa8;font-size:12px">$28.00</s> <span style="color:#8a9aa8">→</span> <span style="font-weight:600;color:#b35a00">$32.00</span>`;
      recRows += row(idx++, lvlMap['Unit'].c, 'Unit', 'UTILITY', cmt, amt);

      const excPill=`<span style="margin-left:8px;background:#eef1f4;color:#8a9aa8;border-radius:4px;padding:1px 8px;font-size:12px">Excluded</span>`;
      recRows += row(idx++, excLv.c, excLv.l, '<s style="color:#8a9aa8">PARKING</s>', `<s style="color:#8a9aa8">Covered parking</s>${excPill}`, '<s style="color:#8a9aa8">$75.00</s>', '#8a9aa8');
    }
    // edge: the tile already draws the boundary, so skip the table's own border.
    return opts.edge ? `<div style="overflow-x:auto">${recHead}${recRows}</div>`
      : `<div style="border:1px solid #cedbe7;border-radius:4px;overflow:hidden"><div style="overflow-x:auto">${recHead}${recRows}</div></div>`;

  // Filters dropdown anchored to the profile toolbar's tune button (Figma 2496-54203).

    // isn't enough, lift the panel so its footer never lands past the bottom of the window.

        ${field('Search Options', this.singleSelect('pf-f-op', ['Contains','Starts with','Equals'], f.op||'Contains', { noSearch:true }))}

  // The charge form itself — General Details, the CRE sections and Marketing Details — shared by the
  // Charge Details overlay and by Bulk Update Charges, which frames it differently.
  chargeForm(m){
    const ed = m.edit || null;
    const isOne = /-one$/.test(m.group);
    // Property specific charges (NSF, late fees) pull every non-marketing field from the property,
    // so General Details renders locked and only the marketing details are editable.
    const spec = ed && ed.propSpecific ? ed.propSpecific : '';
    const cre = !!(m.cre || (ed && ed.cre));
    // The title names the kind of charge, and property specific charges name themselves too, so it's
    // clear which of the three overlays you're in without reading the fields.
    const kind = cre ? 'CRE Recurring' : (isOne ? 'One-Time' : 'Recurring');
    const specLabel = spec === 'NSF' ? 'NSF Fee' : spec === 'Late Charge' ? 'Late Fee' : spec;
    const title = ed ? `${kind} Charge Details${spec ? ' - ' + specLabel : ''}` : `Add ${kind} Charge`;
    const esc = s => (''+(s||'')).replace(/"/g,'&quot;');
    const lab = (t,info) => `<span style="display:inline-flex;align-items:center;gap:4px;font-size:14px;color:#666">${t}${info?`<span class="material-symbols-outlined" style="font-size:16px;color:var(--ac,#008dd5)">info</span>`:''}</span>`;
    const sect = (t,inner) => `<div style="display:flex;flex-direction:column;gap:10px"><span style="font-size:15px;font-weight:600;color:#13314c">${t}</span><div style="border:1px solid #cedbe7;border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:12px">${inner}</div></div>`;
    const dd = (id,opts,sel,o) => this.singleSelect(id,opts,sel,o);
    const cat = this.chargeCategoryMap();
    const catFor = c => cat[(c||'').toUpperCase()] || '';

    // ---- Charge Application + its target field ----
    const app = ed ? (ed.level || 'Property') : 'Property';
    const appToggle = "if(window.__lvlChange)window.__lvlChange(_v)";
    const searchField = (id,val,ph) => `<div style="display:flex;align-items:center;gap:6px;background:#f5f8fa;border:1px solid #cedbe7;border-radius:4px;height:36px;box-sizing:border-box;padding:0 8px"><span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5)">search</span><input id="${id}" value="${esc(val)}" placeholder="${ph}" style="flex:1;min-width:0;border:none;background:transparent;outline:none;font:400 14px Roboto,sans-serif;color:#13314c"></div>`;
    // lvl is the Charge Level this target belongs to — usually the same as its label, except ORI,
    // whose target is the property the rentable item comes from.
    const tgt = (key,label,lvl,id,val,ph,opts) => `<div id="m-appt-${key}-wrap" style="display:${app===lvl?'flex':'none'};flex-direction:column;gap:4px;flex:1;min-width:0">${lab(label+' *')}${opts ? dd(id, opts, val, { placeholder:'Select a '+label.toLowerCase(),
      // The ORI charge's property decides which charge types are on offer, so re-filter on change.

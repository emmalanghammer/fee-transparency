    const cardHead = (t) => `<div style="padding:11px 16px;border-bottom:1px solid #e3e9ee;font-size:14px;font-weight:600;color:#13314c">${t}</div>`;
    // Fee Transparency's publish state surfaces here too: publish from Advanced Settings when the
    // property is set up, or confirm complete pricing is already live.
    const prop2 = this.state.property;
    const ftOn = this.profStatus(prop2) === 'active';
    const ftPublished = !!this.state.publishedProps[prop2];
    const ftNote = !ftOn ? '' : ftPublished
      ? `<span style="display:inline-flex;align-items:center;gap:8px;font-size:14px;color:#13314c;padding-top:2px"><span class="material-symbols-outlined" style="font-size:19px;color:#6eb744;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24">verified</span>This property is using Fee Transparency and is displaying complete pricing on its listings.</span>`
      : (this.ilsOn(prop2) ? `<a data-act="pubOpen" data-arg="${prop2}" style="align-self:flex-start;font-size:14px;color:var(--ac,#008dd5);cursor:pointer;padding-top:2px" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">Publish Complete Pricing</a>` : '');
    const prefs = `<div style="border:1px solid #e3e9ee;border-radius:4px;background:#fff">
      ${cardHead('Preferences')}
      <div style="padding:14px 20px 20px;display:grid;grid-template-columns:1fr 1fr;gap:16px 28px">
        ${heading('Feed Information')}
        ${field('Feed Type', dd('Single Family'))}
        ${field('Property Type', dd('Field: Property Type (Commercial)'))}
        ${field('Rental Type', dd(''))}
        ${field('Marketing Name', ddPh())}
        ${field('Listing URL', ddPh())}
        ${field('Virtual Tour URL', ddPh())}
        ${field('Latitude', ddPh())}
        ${field('Longitude', ddPh())}
        ${field('Rental Classification', dd('House for Rent'), true)}
        ${heading('Agent Information')}
        ${field('First Name', ddPh())}
        ${field('Last Name', ddPh())}
        ${field('Email Address', ddPh())}
        ${field('Phone Number', ddPh())}
      </div>
    </div>`;
    const provider = `<div style="border:1px solid #e3e9ee;border-radius:4px;background:#fff">
      ${cardHead('Provider Settings')}
      <div style="padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px">
        <label style="display:inline-flex;align-items:center;gap:10px;cursor:pointer"><input type="checkbox" style="accent-color:var(--ac,#008dd5);width:16px;height:16px;margin:0"><span style="font-size:14px;color:#4a5b6b">Override System Preferences</span></label>
        <label style="display:inline-flex;align-items:center;gap:10px;padding-left:28px;cursor:default"><input type="checkbox" disabled style="width:16px;height:16px;margin:0"><span style="font-size:14px;color:#a6b2bd">Enable Online Listings</span></label>
        <span style="font-size:14px;color:#eb343c;padding-left:28px">ILS Providers may require a paid account before your listings can be posted.</span>
        <div style="height:38px;background:#fff;border:1px solid #cedbe7;border-radius:4px;margin-left:28px"></div>
        ${ftNote}
      </div>
    </div>`;
    return `<div style="position:fixed;inset:0;background:rgba(19,49,76,0.45);display:flex;align-items:center;justify-content:center;z-index:148">
      <div data-act="noop" style="width:min(1300px, 90vw);max-height:88vh;background:#f5f8fa;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,0.35);display:flex;flex-direction:column;overflow:hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;background:#fff;padding:13px 20px;border-bottom:1px solid #e3e9ee;flex:none">
          <span style="font-size:20px;font-weight:600;color:#13314c">Advanced Settings</span>
          <span style="display:inline-flex;align-items:center;gap:12px"><span data-act="toast" data-arg="Help" class="material-symbols-outlined" style="font-size:22px;color:var(--ac,#008dd5);cursor:pointer">help</span><span data-act="mktAdvClose" class="material-symbols-outlined" style="font-size:22px;color:var(--ac,#008dd5);cursor:pointer">close</span></span>
        </div>
        <div style="flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px">
          ${prefs}
          ${provider}
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;background:#fff;border-top:1px solid #e3e9ee;padding:12px 20px;flex:none">
          <button data-act="mktAdvSave" class="btn-pri" style="height:34px;min-height:34px;padding:0 24px;border-radius:4px;font-size:14px">Save</button>
          <button data-act="mktAdvClose" style="height:34px;min-height:34px;padding:0 18px;border-radius:4px;font:400 14px Roboto,sans-serif;background:#fff;border:1px solid var(--ac,#008dd5);color:var(--ac,#008dd5);cursor:pointer">Cancel</button>
        </div>
      </div>
    </div>`;
  }
  toastHTML(){ return this.state.toast ? `<div class="toast"><span class="material-symbols-outlined" style="font-size:18px">check_circle</span>${this.state.toast}</div>` : ''; }

  // ================= SCREENS =================
  screenHTML(){
    this._tid = 0;
    const s = this.state;
    let out = this.header();
    if (s.view === 'property') {
      // Full-width blue bar first; the action rail starts right under it and runs to the bottom.
      out += this.ctx('Property', [{ label: s.property }], '125 of 255', 'navRegister');
      let inner = this.propScoreboard();
      inner += this.tabRow(['General','Leasing','Documents','Charges'], s.propTab, 'proptab', { badge: { 'Charges':'New' } });
      if (s.propTab === 'Charges') {
        inner += `<div style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden">${this.feeProfileTab()}</div>`;
      } else {
        inner += `<div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column"><div style="flex:1;min-width:0;padding:16px;display:flex;flex-direction:column;gap:16px;width:100%;box-sizing:border-box">${this.propGeneralBody()}</div></div>`;
        inner += this.footer('Save property');
      }
      out += `<div style="flex:1;min-height:0;display:flex;align-items:stretch;overflow:hidden"><div style="flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden">${inner}</div>${this.rail()}</div>`;
    } else if (s.view === 'sysprefs') {
      out += `<div style="height:44px;background:var(--ac,#008dd5);display:flex;align-items:center;padding:0 16px;gap:14px;color:#fff;flex:none">
        <span data-act="navRegister" class="material-symbols-outlined" style="font-size:22px;cursor:pointer">keyboard_double_arrow_left</span>
        <span style="font-size:19px;line-height:24px">System Preferences:&nbsp; <span>General Options - ${s.spNav}</span></span>
        <div style="flex:1"></div>
        <span class="material-symbols-outlined" style="font-size:20px;opacity:0.9;cursor:pointer">help</span>
      </div>`;
      out += this.sysPrefsBody();
    } else if (s.view === 'pettypes') {
      out += `<div style="height:40px;background:var(--ac,#008dd5);display:flex;align-items:center;padding:0 16px;gap:12px;color:#fff;flex:none">
        <span style="font-size:18px;line-height:24px">Pet Types</span>
        <div style="flex:1"></div>
        <span data-act="toast" data-arg="Refresh" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">autorenew</span>
        <span class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">help</span>
      </div>`;
      out += `<div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column">${this.petTypesBody()}</div>`;
    } else if (s.view === 'listings') {
      out += `<div style="height:40px;background:var(--ac,#008dd5);display:flex;align-items:center;padding:0 16px;gap:12px;color:#fff;flex:none">
        <span style="font-size:18px;line-height:24px">Listings</span>
        <div style="flex:1"></div>
        <span data-act="navFeeTrans" style="display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;opacity:0.95;margin-right:4px">Fee Transparency<span class="material-symbols-outlined" style="font-size:18px">arrow_right_alt</span></span>
        <span data-act="toast" data-arg="Print" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">print</span>
        <span data-act="toast" data-arg="Refresh" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">autorenew</span>
        <span class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">help</span>
      </div>`;
      out += `<div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column">${this.listingsBody()}</div>`;
    } else if (s.view === 'feetrans') {
      out += `<div style="height:40px;background:var(--ac,#008dd5);display:flex;align-items:center;padding:0 16px;gap:12px;color:#fff;flex:none">
        <span style="font-size:18px;line-height:24px">Fee Transparency</span>
        <div style="flex:1"></div>
        <span data-act="navListings" style="display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;opacity:0.95;margin-right:4px">Listings<span class="material-symbols-outlined" style="font-size:18px">arrow_right_alt</span></span>
        <span data-act="toast" data-arg="Print" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">print</span>
        <span data-act="toast" data-arg="Refresh" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">autorenew</span>
        <span class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">help</span>
      </div>`;
      out += `<div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column">${this.feeTransBody()}</div>`;
    } else if (s.view === 'register') {
      out += `<div style="height:40px;background:var(--ac,#008dd5);display:flex;align-items:center;padding:0 16px;gap:12px;color:#fff;flex:none">
        <span style="font-size:18px;line-height:24px">Properties</span>
        <div style="flex:1"></div>
        <span data-act="toast" data-arg="Print" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">print</span>
        <span data-act="toast" data-arg="Refresh" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">autorenew</span>
        <span class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">help</span>
      </div>`;
      out += `<div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column">${this.registerBody()}</div>`;
    } else {
      out += this.ctx('Unit', [{ label: s.property, act:'navProperty', arg: s.property }, { label:'Unit ' + s.unit }], '125 of 255');
      out += this.unitBody();
      out += this.footer('Save unit');
    }
    out += this.modalHTML();
    out += this.rowMenuHTML();
    out += this.chargeExclHTML();
    out += this.recViewHTML();
    out += this.setupHTML();
    out += this.setupExitHTML();
    out += this.addPropHTML();
    out += this.pfFilterHTML();
    out += this.pubModalHTML();
    out += this.ftSelHTML();
    out += this.mktSetupHTML();
    out += this.mktAdvHTML();
    out += this.petTypeHTML();
    out += this.pricePreviewHTML();
    out += this.profMenuHTML();
    out += this.profHistHTML();
    out += this.kickoffHTML();
    out += this.announceHTML();
    out += this.bulkUpdHTML();
    out += this.copyFeesHTML();
    out += this.toastHTML();
    return out;
  }
  renderVals(){
    return {
      rootRef: this.setRoot,
      onClick: this.onClick,
      screen: React.createElement('div', { style: { display:'flex', flexDirection:'column', flex:1, minHeight:0 }, dangerouslySetInnerHTML: { __html: this.screenHTML() } })
    };
  }
}
</script>
</body>
</html>

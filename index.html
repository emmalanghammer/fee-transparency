       an icon-only button, then hides — so the logo, the scenario picker and the icons never clip. */
    .cmdlaunch { display:flex; align-items:center; gap:8px; box-sizing:border-box; height:32px;

    // Changes made while using the prototype. The seeded history stops at today, so everything in
    // here is something the user did this session.
    histLog: [],
    nextFeeId: 101,
    setup: null,            // { props, step:1|2|3|'saving'|'done', pi, ack }
    setupExit: false,       // the "leave setup?" confirmation over the wizard
    lvlSel: 'all',          // 'all' | 'Property' | 'Unit Type' | 'Unit' | 'ORI'
    bannerDismissed: {},
    pricePreview: null,     // { prop, unit, opt:{}, sitOpen }
    profMenu: null,
    recView: null,
    recViewNote: true,
    rowMenu: null,
    // Properties whose complete pricing has been published from the Fee Transparency page.
    publishedProps: {},
    pubModal: null, // { prop, ack } — Publish Complete Pricing confirmation
    mktSetup: false, // Marketing Setup overlay (opened from the action rail's copy flyout)
    mktAdv: false, // Advanced Settings overlay on top of Marketing Setup
    ftSel: null, // { mode:'pub'|'setup' } — Select Properties dialog on the tracker
    ltProp: 'all', // Listings page property filter
    // props: the properties a pet type applies to; null means every property.
    petTypes: [
      { name:'Dog', desc:'', props:null, maxSize:'Medium', maxWeight:'50 lbs', care:true, rec:25, recMax:50, recPer:true, one:0, oneMax:0, onePer:false, dep:200, depMax:400, depPer:true },
      { name:'Cat', desc:'', props:null, maxSize:'Small', maxWeight:'20 lbs', care:true, rec:15, recMax:0, recPer:false, one:0, oneMax:0, onePer:false, dep:150, depMax:0, depPer:false },
      { name:'Big Dog', desc:'', props:['Riverview Apartments','The Hamptons'], maxSize:'Large', maxWeight:'120 lbs', care:false, rec:50, recMax:90, recPer:true, one:0, oneMax:0, onePer:false, dep:300, depMax:0, depPer:false },
      { name:'Fish', desc:'Fish', props:['The Berkshires'], maxSize:'', maxWeight:'', care:false, rec:0, recMax:0, recPer:false, one:25, oneMax:0, onePer:false, dep:0, depMax:0, depPer:false }
    ],
    petType: null, // index being edited in Pet Type Details, or 'new'
    spNav: 'Tenant Charge Setup', // System Preferences left-nav selection
    spBanner: true, // System Preferences Fee Transparency banner not yet dismissed
    ltErrOnly: false, // Listings page: hide listings without errors
    ltErr: null, // { i, open } — Listing Errors popup for one listing
    // Charges register columns: chgCols is the chosen keys in order (null = defaults), colNames holds
    // any renamed headers, colSetup opens the Customize Column Setup dialog.
    chgCols: null, colNames: {}, colSetup: false,
    ftFilter: 'all', // tracker Status filter: all | ready | needs | none | done
    // "Charge Exceptions" overlay: { id }. A charge's own exceptions live on the row as
    // exclFrom:{ types:[], units:[], prop:true }.
    chargeExcl: null,
    utDel: null, // { id } — confirmation before deleting a unit-type charge
    modal: null,
    toast: null
  };

  // ---------- properties (the top-level entity; fee profiles hang off these) ----------
  propertiesData(){
    return (this.state.newProps || []).concat([
      { name:'Riverview Apartments', short:'RIVER', email:'stewart@riverviewapts.com', manager:'Stewart Chandler', addr:'1492 Loveland-Madeira Road, Loveland, OH 45140', billing:'1492 Loveland-Madeira Road, Loveland, OH 45140', color:'#1570ef', loc:'Loveland, OH', units:50, occupied:30, owner:'Thompson Family Trust', logo:'assets/logo-riverview.png' },
      { name:'The Berkshires', short:'BERK', email:'malik@theberkshires.com', manager:'Malik Roberson', addr:'4321 Loveland-Miamiville Rd, Loveland, OH 45140', billing:'9876 Socialville-Fosters Rd, Mason, OH 45040', color:'#1570ef', loc:'Loveland, OH', units:64, occupied:58 },
      { name:'The Windermere', short:'WIND', email:'kiana@thewindermere.com', manager:'Kiana Booker', addr:'1234 Tylersville Rd, West Chester, OH 45069', billing:'5678 Fields Ertel Rd, Cincinnati, OH 45249', color:'', loc:'West Chester, OH', units:42, occupied:39 },
      { name:'The Estates', short:'ESTATE', email:'zack@theestates.com', manager:'Zackary Nixon', addr:'1357 Milford-Blanchester Rd, Milford, OH 45150', billing:'2468 Morrow-Rossburg Rd, Morrow, OH 45152', color:'#d92d20', loc:'Milford, OH', units:88, occupied:71 },
      { name:'Willow Creek', short:'WILLOW', email:'jaquan@willowcreek.com', manager:'Jaquan Fry', addr:'9012 Lebanon Rd, Maineville, OH 45039', billing:'3579 Columbia Rd, South Lebanon, OH 45065', color:'#12a150', loc:'Maineville, OH', units:36, occupied:33 },
      { name:'Greenbriar Village', short:'GREENB', email:'jaqueline@greenbriarvillage.com', manager:'Jaqueline Rush', addr:'4680 Wilmington Rd, Clarksville, OH 45113', billing:'5791 Jamestown-New Jasper Rd, Jamestown, OH 45335', color:'', loc:'Clarksville, OH', units:24, occupied:20 },
      { name:'Oakwood Manor', short:'OAKMAN', email:'bryan@oakwoodmanor.com', manager:'Bryan Ashley', addr:'6802 Paintersville-New Jasper Rd, Xenia, OH 45385', billing:'7913 Bellbrook-Sugarcreek Rd, Bellbrook, OH 45305', color:'', loc:'Xenia, OH', units:72, occupied:64 },
      { name:'Pinewood Place', short:'PINEPL', email:'arley@pinewoodplace.com', manager:'Arley Harrell', addr:'8024 Franklin St, Spring Valley, OH 45370', billing:'9135 Dayton-Xenia Rd, Beavercreek, OH 45434', color:'', loc:'Spring Valley, OH', units:18, occupied:15 },
      { name:'Cedar Ridge', short:'CRIDGE', email:'shea@cedarridge.com', manager:'Shea Ferry', addr:'0246 Indian Ripple Rd, Dayton, OH 45440', billing:'1357 Miamisburg-Centerville Rd, Dayton, OH 45459', color:'#f58220', loc:'Dayton, OH', units:56, occupied:49 },
      { name:'The Highlands', short:'HIGH', email:'kobe@thehighlands.com', manager:'Kobe Mccarty', addr:'2468 Far Hills Ave, Kettering, OH 45419', billing:'3579 Whipp Rd, Centerville, OH 45458', color:'#1570ef', loc:'Kettering, OH', units:44, occupied:40 },
      { name:'Valley Forge', short:'VALLEY', email:'jayson@valleyforge.com', manager:'Jayson Locklear', addr:'4680 Yankee St, Dayton, OH 45458', billing:'5791 Social Row Rd, Mason, OH 45040', color:'#737373', loc:'Dayton, OH', units:30, occupied:22 },
      { name:'The Arbors', short:'ARBORS', email:'rylee@thearbors.com', manager:'Rylee Herron', addr:'6802 Butler Warren Rd, Mason, OH 45040', billing:'7913 Columbia Rd, Kings Mills, OH 45034', color:'#13314c', loc:'Mason, OH', units:60, occupied:52 },
      { name:'Stonegate Village', short:'STONEG', email:'neha@stonegatevillage.com', manager:'Neha Walter', addr:'8024 Western Row Rd, Maineville, OH 45039', billing:'9135 Irwin Simpson Rd, Mason, OH 45040', color:'#12a150', loc:'Maineville, OH', units:58, occupied:39 },
      { name:'The Hamptons', short:'HAMPTON', email:'zavier@thehamptons.com', manager:'Zavier Burks', addr:'0246 Fields Ertel Rd, Cincinnati, OH 45241', billing:'1357 Loveland Madeira Rd, Loveland, OH 45140', color:'#f58220', loc:'Cincinnati, OH', units:34, occupied:31 }
    ]);
  }
  // Properties whose charges can be copied when adding a property.
  copyableProfiles(){ return this.propertiesData().map(p=>p.name).filter(n=>this.usingProfile(n)); }
  propNames(){ return this.propertiesData().map(p => p.name); }
  propInfo(name){ const n = name || this.state.property; return this.propertiesData().find(p => p.name === n) || this.propertiesData()[0]; }
  properties(){ return this.propertiesData(); }

  // ---------- per-property Fee Transparency ----------
  // Properties that already have Fee Transparency on — the register's "Fee Transparency"
  // column. Opening one of these lands on the populated profile; the rest land on pre-setup.
  seededProfiles(){
    // Nobody starts set up — the tracker opens with every property at Not Set Up so the demo walks
    // the real first-run journey. Setting up a property writes profileStatus/profileFees.
    return [];
  }
  usingProfile(p){ return this.profStatus(p) === 'active'; }
  profStatus(p){
    const n = p || this.state.property;
    return this.state.profileStatus[n] || (this.seededProfiles().indexOf(n) >= 0 ? 'active' : 'none');
  }
  ilsOn(p){ return !!this.state.ilsProps[p || this.state.property]; }
  // The MITS 5.0 / listing fields a charge must carry before it can be marketed.
  mitsFields(){
    return [
      { key:'name',        label:'Name' },                                 // MITS: Name
      { key:'category',    label:'Charge Category' },                      // MITS: Code
      { key:'requirement', label:'Charge Requirement' },                   // MITS: Requirement
      { key:'feeDue',      label:'Fee Due' },                              // MITS: Lifecycle
      { key:'schedule',    label:'Charge Schedule', recurringOnly:true }   // MITS: Payment Frequency
    ];
  }
  // Charge Category resolves from the charge-type -> category map, so it only counts as missing
  // when a type has no mapping. Everything else — including the marketing Name, which is distinct
  // from the charge's operational name — must be entered by the user.
  // Best-guess MITS charge requirement from the charge type and comment. Situational charges only
  // apply when a condition is met; optional ones are tenant-selected add-ons; everything else
  // (rent, utilities, admin, deposits, application) is required.
  inferRequirement(r){
    const code = String(r.mits || '').toUpperCase();
    const text = ((r.desc || '') + ' ' + (r.name || '')).toLowerCase();
    // Damage and violation charges are conditions, not choices — checked before the pet rules so a
    // pet damage charge doesn't read as an add-on.
    if (/^(LATE|LC|NSF|DAMAGE|VIOLATION|LEGAL)/.test(code) || /\bdamage\b/.test(text)) return 'Situational';
    if (/^PET/.test(code) || /\bpets?\b/.test(text)) return 'Optional';
    if (/^(SF|STORAGE|COVPARK|PARK|PARKING|GARAGE|HOLD|AMENFEE|AMENITY|UPGRADE|TECH|CABLE|TRANSFER|EVCHG)/.test(code)) return 'Optional';
    if (/\b(optional|add-?on|valet|storage|parking|garage|reservation|locker|access)\b/.test(text)) return 'Optional';
    return 'Required';
  }
  // The requirement chosen for a charge during setup (falls back to the inferred value).
  // Blank until the user picks one — setup shouldn't guess a requirement on their behalf. Charges
  // left unset land in the Individual Charges group and get flagged as missing the MITS field.
  // Which selected property step 2 is currently reviewing.
  setupCurProp(){ const c = this.state.setup; if (!c) return ''; return this.setupProps()[c.pi || 0] || ''; }
  // Requirement comes from the charge's group when marketing details haven't been saved yet.
  defaultRequirement(r){
    const g = String(r.group || '');
    // 'ind' means no requirement was ever chosen, so there's nothing to fall back on.
    if (g.indexOf('ind') === 0) return '';
    return g.indexOf('opt') === 0 ? 'Optional' : g.indexOf('sit') === 0 ? 'Situational' : 'Required';
  }
  // ---------- Charges history ----------
  // Preloaded demo history, running up to today. Keyed to charge codes so it only surfaces for
  // charges the property actually has. Keys sort as 'YYYY-MM'; anything after this is tracked live.
  profileAmountSeed(){
    return {
      GARBAG:     { by:'Devon Marsh',    hist:[['2025-01','$25.00'],['2026-01','$26.00'],['2026-07','$28.00']] },
      GARBAGEFEE: { by:'Devon Marsh',    hist:[['2026-01','$4.00']] },
      ADMIN:      { by:'Admin',          hist:[['2025-01','$125.00'],['2026-01','$150.00']] },
      APPFEE:     { by:'Rachel Hodges',  hist:[['2025-01','$50.00'],['2026-01','$50.00']] },
      AMENFEE:    { by:'Admin',          hist:[['2025-01','$25.00'],['2026-01','$28.00']] },

  // ================= PROPERTIES REGISTER =================
  // Properties the bulk setup can act on — the ones without a profile yet.
  bulkSetupCandidates(){ return this.propertiesData().filter(p => this.profStatus(p.name) !== 'active'); }
  // ---------- Fee Transparency tracker (mock 2651-48385) ----------
  // Where each property stands: not set up, charges missing details, ready, or published.
  // ---------- Demo scenarios: the nav bar's "Test Feature State" ----------
  // Each scenario rewrites the whole portfolio at once, so every screen — the Properties register, the
  // Fee Transparency tracker, a property's Charges tab, Listings and System Preferences — tells the
  // same story about how far conversion has got, and drops the user on the page that state is about.
  scenarioList(){
    return [
      { key:'on',    label:'On Rollout' },
      { key:'mid',   label:'Mid Conversion' },
      { key:'post',  label:'Post Conversion' },
      { key:'noils', label:'On Rollout, No ILS' }
    ];
  }
  scenarioLabel(){
    const k = this.state.scenario || 'on';
    const hit = this.scenarioList().filter(s => s.key === k)[0];
    return hit ? hit.label : 'On Rollout';
  }
  // Properties that advertise on online listings. Every other property is marketing-off, so nothing
  // about publishing complete pricing is surfaced for it.
  scenarioMarketed(){
    return ['Riverview Apartments','The Berkshires','The Windermere','The Estates','Willow Creek',
      'Greenbriar Village','Pinewood Place','The Highlands','Stonegate Village','The Hamptons'];
  }
  // Charges for a converted property: either every marketing detail filled in, or the same charges
  // as they arrive from setup, with details still missing. '' is not a real property, so setupRows
  // gives back the generic discovered set rather than a worked example.
  scenarioRows(complete){ return complete ? this.listingReadyRows() : this.setupRows('', true); }
  scenarioPlan(key){
    const names = this.propertiesData().map(p => p.name);
    const ils = {};
    if (key !== 'noils') this.scenarioMarketed().forEach(n => { ils[n] = true; });
    const plan = { ils, status:{}, fees:{}, published:{} };
    const convert = (n, complete, published) => {
      plan.status[n] = 'active';
      plan.fees[n] = this.scenarioRows(complete);
      if (published) plan.published[n] = true;
    };
    if (key === 'mid') {
      // Mid-conversion is the mixed portfolio: published, published before every detail was filled in,
      // converted but still short, ready to publish, done because they don't advertise, and untouched.
      ['Riverview Apartments','Greenbriar Village'].forEach(n => convert(n, true, true));
      convert('The Windermere', false, true);
      ['The Estates','Willow Creek','Pinewood Place'].forEach(n => convert(n, false, false));
      ['The Hamptons','Stonegate Village'].forEach(n => convert(n, true, false));
      // Not enabled for listings, so centralizing the charges is all there is to do.
      ['Oakwood Manor','Cedar Ridge'].forEach(n => convert(n, true, false));
      // The Berkshires, The Highlands, Valley Forge and The Arbors are still on legacy charges.
    } else if (key === 'post') {
      // Steady state: every property is converted, and every marketed one publishes complete pricing.
      names.forEach(n => convert(n, true, !!ils[n]));
    }
    // 'on' and 'noils' are launch day — nothing is converted yet.
    plan.view = key === 'mid' ? 'feetrans' : key === 'post' ? 'listings' : 'register';
    plan.announce = key === 'on' || key === 'noils';
    return plan;
  }
  scenarioApply(key){
    const p = this.scenarioPlan(key);
    this._resetScroll = true;
    this.setState({
      scenario: key,
      ilsProps: p.ils, profileStatus: p.status, profileFees: p.fees, publishedProps: p.published,
      view: p.view, announce: p.announce, announceStep: 1, kickoff: false,
      // Everything below belongs to the scenario the user just left, so none of it carries over.
      property: 'Riverview Apartments', propTab: 'General', unit: '1B',
      newProps: [], addProp: null, histLog: [], toggles: {}, bannerDismissed: {},
      setup: null, setupExit: false, modal: null, bulk: null, bulkSel: null, bulkUpd: null,
      copyFees: null, bulkSetup: null, pricePreview: null, profMenu: null, profHist: null,
      recView: null, recViewNote: true, rowMenu: null, pubModal: null, ftSel: null,
      mktSetup: false, mktAdv: false, petType: null, spBanner: true,
      lvlSel: 'all', ftFilter: 'all', ltProp: 'all', ltErrOnly: false
    });
    window.scrollTo(0, 0);
  }
  // One status per property, worded for the register it lands in: properties enabled for online
  // listings run all the way to a converted feed, while the rest stop at centralized charges.
  ftStatus(p){
    const rows = this.appliedRows(p);
    const active = this.profStatus(p) === 'active';
    const published = !!this.state.publishedProps[p];
    const ils = this.ilsOn(p);
    const short = rows.filter(r => !this.mitsComplete(r)).length;
    // Fee Transparency off entirely.
    if (!active) return { key:'none', order:4, icon:'settings', color:'#b3b3b3',
      status:'Not set up', next:'Set Up Fee Transparency', act:'setupOpen' };
    // On, but the property doesn't advertise — its charges are centralized and that's as far as it goes
    // until someone enables it for listings.
    if (!ils) return { key:'notEnabled', order:6, icon:'verified', color:'#6eb744',
      status:'Centralized', next:'Enable for Online Listings', act:'ilsEnable' };
    if (short) return published
      // Published, then a charge lost (or never had) its details — the feed is converted, but that
      // charge is sitting out of the price until it's finished.
      ? { key:'pubshort', order:1, icon:'verified', color:'#6eb744',
          status:'Feed converted', next:'Add Charge Details', act:'openFeeProfile', issues:short }
      : { key:'short', order:2, icon:'warning', color:'#faa61c',
          status:short + ' charge' + (short===1?'':'s') + ' incomplete', next:'Add Charge Details', act:'openFeeProfile', issues:short };
    return published
      ? { key:'pub', order:5, icon:'verified', color:'#6eb744', status:'Feed converted' }
      : { key:'ready', order:3, icon:'check_circle', color:'#008dd5',
          status:'Ready to publish', next:'Publish Complete Pricing', act:'pubOpen' };
  }
  ftCounts(){
    const c = { none:0, needs:0, ready:0, done:0, pubshort:0, pub:0, notEnabled:0 };
    this.propertiesData().forEach(p => { const st = this.ftStatus(p.name);
      if (st.key === 'none') c.none++;
      else if (st.key === 'short') { c.needs++; }
      else if (st.key === 'pubshort') { c.needs++; c.pubshort++; }
      else if (st.key === 'ready') c.ready++;
      else { c.done++; if (st.key === 'pub') c.pub++; else c.notEnabled++; }
    });
    return c;
  }
  feeTransBody(){
    // Grouped by status in the order the work happens: published-but-incomplete first, then charges
    // needing details, ready to publish, not set up, and everything already finished.
    const filt = this.state.ftFilter || 'all';
    const group = k => (k==='short'||k==='pubshort') ? 'needs' : (k==='pub'||k==='notEnabled') ? 'done' : k==='ready' ? 'ready' : 'none';
    const all = this.propertiesData().slice()
      .sort((x, y) => (this.ftStatus(x.name).order - this.ftStatus(y.name).order) || x.name.localeCompare(y.name));
    const rows = filt === 'all' ? all : all.filter(p => group(this.ftStatus(p.name).key) === filt);
    const c = this.ftCounts();
    const esc = s => (''+s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');

    // sitting at "Ready" are on offer.
    const pubProps = this.propertiesData().map(p => p.name).filter(n => this.ftStatus(n).key === 'ready');

    // ---- status tiles: bordered cards, count, and a qualifying line underneath ----

    </div>`;
    // Ordered the way the work happens: nothing started, then details owed, then ready, then finished.
    const tiles = `<div style="display:flex;gap:16px;flex-wrap:wrap">
      ${tile('var(--rmx-text-muted, #b3b3b3)','settings','var(--rmx-text-muted, #b3b3b3)','Not set up',c.none, '', null)}

      ${tile('var(--rmx-brand, #008dd5)','check_circle','var(--rmx-brand, #008dd5)','Ready to publish',c.ready, '',

    </div>`;

    // ---- toolbar: search, saved filters, and a working Status filter ----
    const filtLabels = { all:'', ready:'Ready to publish', needs:'Charges need details', none:'Not set up', done:'Done' };
    const fopt = (v, t) => `<div data-act="ftFilterSet" data-arg="${v}" style="padding:7px 14px;font-size:14px;color:var(--rmx-brand-dark, #13314c);cursor:pointer;white-space:nowrap" onmouseover="this.style.background='var(--rmx-brand-tint-bg, #ebf1f5)'" onmouseout="this.style.background=''">${t}</div>`;
    const toolbar = `<div style="display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:4px;width:248px">
        <span style="font-size:14px;color:var(--ac,var(--rmx-brand, #008dd5))">Search</span>

          <span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,var(--rmx-brand, #008dd5))">search</span>
          <span style="flex:1;min-width:0;font-size:14px;font-style:italic;color:var(--rmx-text-muted, #b3b3b3)">Find a property</span>

  ltStatus(p){

  feeProfileEmpty(){

  feeProfileLoading(){
    return `<div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:80px 24px">
      <span style="position:relative;width:104px;height:104px;display:flex;align-items:center;justify-content:center">
        <span style="position:absolute;inset:0;border:5px solid #fbe4cf;border-top-color:var(--rmx-attention, #f58220);border-radius:50%;animation:spin 0.9s linear infinite"></span>
        <span class="material-symbols-outlined" style="font-size:40px;color:var(--ac,var(--rmx-brand, #008dd5))">apartment</span>
      </span></div>`;
  }
  // Charge Level pill — Property / a unit-type name / Unit N / ORI.
  // Every level names what it applies to: the unit, the unit type, the rentable-item type — and, at
  // property level, the property itself. prop is the property the row belongs to, which is the one on
  // screen everywhere except the setup wizard and the copy flows.
  chargeLevelPill(r, prop){
    const cls = { 'Property':'lvl-prop', 'Unit Type':'lvl-ut', 'Unit':'lvl-unit', 'ORI':'lvl-ori' }[r.level] || 'lvl-prop';
    const label = r.level === 'Unit Type' ? (r.target || 'Unit Type')
      : r.level === 'Unit' ? (r.target || 'Unit')
      // An ORI charge names its rentable-item type, e.g. Covered Parking.
      : r.level === 'ORI' ? (r.oriType || 'ORI')
      : (prop === undefined ? this.state.property : prop) || 'Property';
    return `<span class="lvl ${cls}" title="${(''+label).replace(/"/g,'&quot;')}">${label}</span>`;
  }
  // Marketing/MITS status for one charge. Hovering lists the exact fields still required, so the
  // work required is visible from the list without opening every charge.
  mitsStatusCell(r){
    const missing = this.mitsMissing(r);
    const pill = (t) => `<span style="display:inline-flex;align-items:center;gap:5px;background:#fdf3e3;border-radius:12px;padding:2px 9px;cursor:default"><span class="material-symbols-outlined" style="font-size:14px;color:var(--rmx-attention, #f58220)">error</span><span style="font-size:14px;color:#7a5a2a;white-space:nowrap">${t}</span></span>`;
    // One missing field is named outright; more than one needs the hover to list them.
    if (missing.length === 1) return pill('Needs ' + missing[0]);
    if (missing.length) {
      return `<span class="tipw" style="display:inline-flex">${pill(missing.length + ' needed')}<span class="tip" style="left:auto;right:-4px;top:26px;width:auto;min-width:190px;max-width:280px;padding:14px 16px"><span style="display:block;font-size:14px;font-weight:600;color:var(--rmx-brand-dark, #13314c);padding-bottom:9px;border-bottom:1px solid var(--rmx-line, #cedbe7)">${missing.length} fields still required:</span><span style="display:flex;flex-direction:column;gap:10px;padding-top:11px">${missing.map(n=>`<span style="font-size:14px;color:var(--rmx-brand-dark, #13314c);white-space:nowrap">${n}</span>`).join('')}</span></span></span>`;
    }
    // Every field is in place; Include on listings decides whether the charge actually goes out.
    if (!r.ils) {
      return `<span style="display:inline-flex;align-items:center;gap:5px" title="All fields filled in — this charge isn't included on listings"><span class="material-symbols-outlined" style="font-size:16px;color:var(--rmx-text-muted, #b3b3b3)">visibility_off</span><span style="font-size:14px;color:var(--rmx-text-muted, #b3b3b3);white-space:nowrap">Charge excluded</span></span>`;
    }
    return `<span style="display:inline-flex;align-items:center;gap:5px"><span class="material-symbols-outlined" style="font-size:16px;color:var(--rmx-success, #6eb744)">check_circle</span><span style="font-size:14px;color:var(--rmx-brand-dark, #13314c);white-space:nowrap">Charge ready</span></span>`;
  }
  levelCounts(){
    const rows = this.showExceptions() ? this.profileRows() : this.appliedRows();
    const c = { all: rows.length, 'Property':0, 'Unit Type':0, 'Unit':0, 'ORI':0 };
    rows.forEach(r => { if (c[r.level] != null) c[r.level]++; });
    return c;
  }
  visibleRows(){
    const sel = this.state.lvlSel;
    return (this.showExceptions() ? this.profileRows() : this.appliedRows())
      .filter(r => sel === 'all' || r.level === sel)
      .filter(r => this.matchesFilters(r));
  }
  // Applied filter-panel criteria. Text fields honour the chosen Search Option.
  matchesFilters(r){
    const f = this.state.pfFilters; if (!f) return true;
    const op = f.op || 'Contains';
    const test = (needle, hay) => {
      if (!needle) return true;
      const n = String(needle).toLowerCase(), h = String(hay || '').toLowerCase();
      return op === 'Equals' ? h === n : op === 'Starts with' ? h.indexOf(n) === 0 : h.indexOf(n) >= 0;
    };
    const oneTime = /-one$/.test(r.group || '');
    if (f.type && f.type.length === 1) {
      if (f.type[0] === 'Recurring' && oneTime) return false;
      if (f.type[0] === 'One-Time' && !oneTime) return false;
    }
    if (!test(f.ctype, r.mits)) return false;
    if (!test(f.freq, r.freq)) return false;
    if (!test(f.name, (r.listing && r.listing.name) || r.name)) return false;
    if (!test(f.comment, r.desc)) return false;
    return true;
  }
  activeFilterCount(){
    const f = this.state.pfFilters; if (!f) return 0;
    let n = 0;
    if (f.type && f.type.length === 1) n++;
    ['ctype','freq','name','comment'].forEach(k => { if (f[k]) n++; });
    if (f.past) n++; if (f.future) n++; if (f.exc) n++;
    return n;
  }
  levelCountChip(label, count, key, icon){
    const on = this.state.lvlSel === key;
    return `<span data-act="lvlSel" data-arg="${key}" class="chip${on?' on':''}">${icon?`<span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,var(--rmx-brand, #008dd5))">${icon}</span>`:''}${label}<span class="cnt">${count}</span></span>`;
  }
  feeProfileToolbar(){

          : cell(r.mits, pad(i)),
        comment: (i) => `<span style="display:flex;align-items:center;gap:8px;min-height:44px;box-sizing:border-box;padding:8px 12px;font-size:14px;color:var(--rmx-brand-dark, #13314c);min-width:0;${pad(i)}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.desc||r.name}</span>${this.exclTag(r)}</span>`,
        mktname: (i) => cell(L.name || '—', pad(i)),
        freq: (i) => cell(this.freqNum(r)||'—', pad(i)),
        from: (i) => cell(r.from||'—', pad(i)),
        to: (i) => cell(r.to||'-', pad(i)),
        amount: (i) => cell(String(r.amount||'').replace(/^\$/,''), 'justify-content:flex-end;text-align:right'),
        level: (i) => `<span style="display:flex;align-items:center;min-height:44px;padding:8px 12px;min-width:0;overflow:hidden">${this.chargeLevelPill(r)}</span>`,
        ready: (i) => `<span style="display:flex;align-items:center;min-height:44px;padding:8px 12px">${this.mitsStatusCell(r)}</span>`,

        due: (i) => cell(L.feeDue || '—', pad(i)),
        sched: (i) => cell(L.schedule || '—', pad(i)),
        mktdesc: (i) => cell(L.marketing || '—', pad(i)),

        refund: (i) => cell(L.refundable ? 'Yes' : 'No', pad(i))
      };
      return `<div data-act="${bs?'bulkSelToggle':'rowDetails'}" data-arg="${r.id}" style="display:grid;grid-template-columns:${cols};align-items:center;border-bottom:1px solid var(--rmx-brand-tint-bg, #ebf1f5);cursor:pointer" onmouseover="this.style.background='#f7fafc'" onmouseout="this.style.background=''">
        ${selCell(r)}${keys.map((k, i) => render[k] ? render[k](i) : cell('—')).join('')}${kebab}</div>`;
    }).join('') : `<div style="padding:14px 16px;font-size:14px;font-style:italic;color:var(--rmx-text-muted, #b3b3b3);border-bottom:1px solid var(--rmx-brand-tint-bg, #ebf1f5)">No ${rec?'recurring':'one-time'} charges in this section.</div>`;
    const add = `<div data-act="addopen" data-arg="${group}" style="background:#f5f9fc;padding:9px 16px;cursor:pointer"><span style="display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ac,var(--rmx-brand, #008dd5))"><span class="material-symbols-outlined" style="font-size:18px">add</span>Add ${rec?'Recurring':'One-Time'} Charge</span></div>`;
    return `${noLabel?'':`<div style="font-size:14px;color:var(--rmx-text, #666666);padding:12px 20px 8px">${rec?'Recurring':'One-Time'}</div>`}
      <div style="padding:${noLabel?'4px':'0'} 20px 0;overflow-x:auto"><div style="min-width:${minW}px;border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;overflow:hidden">
        <div style="display:grid;grid-template-columns:${cols};border-bottom:1px solid var(--rmx-line, #cedbe7)">${selHead}${heads.map(hc).join('')}${colBtn}</div>

  // A charge's requirement comes from its marketing details; charges that haven't had one selected
  // yet fall into the "Individual Charges" group.
  reqOf(r){ return (r.listing && r.listing.requirement) || ''; }
  // Requirement-grouped section: Recurring + One-Time subtables under one requirement heading.
  profileSection(key, title, sub, rows, opts){
    const rec = rows.filter(r => !/-one$/.test(r.group));
    const one = rows.filter(r => /-one$/.test(r.group));
    const grp = key === 'opt' ? 'opt-' : key === 'sit' ? 'sit-' : 'req-';
    const inner = this.profileTable('rec', rec, grp+'rec') + this.profileTable('one', one, grp+'one');
    return this.acc(`${title} (${rows.length})`, sub, inner, null, 'pf-'+key, opts);
  }
  // Aggregate reminder of the MITS/listing work outstanding across the profile. Nothing outstanding

  mitsBanner(){

    const total = this.appliedRows().length;

    // Marketing/MITS completeness only matters when the property publishes to online listings.
    if (!ils || !total) return '';
    const published = !!this.state.publishedProps[this.state.property];
    // Published and complete: these charges are the live pricing feed — say so.
    if (!need) return !published ? '' : `<div style="display:flex;align-items:flex-start;gap:10px;background:#eef7e9;border:1px solid var(--rmx-success, #6eb744);border-radius:4px;padding:12px 16px">
      <span class="material-symbols-outlined" style="font-size:20px;color:var(--rmx-success, #6eb744);flex:none;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24">verified</span>

      </div></div>`;
    // Published with incomplete charges is live non-compliance — the loudest callout on the tab.
    if (published) return `<div style="display:flex;align-items:flex-start;gap:10px;background:#fbe9e9;border:1px solid var(--rmx-error, #eb343c);border-radius:4px;padding:12px 16px">
      <span class="material-symbols-outlined" style="font-size:20px;color:var(--rmx-error, #eb343c);flex:none;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24">warning</span>

        <span style="font-size:14px;color:var(--rmx-brand-dark, #13314c);line-height:1.5">These charges are left out of the published price until their details are filled in, which is non-compliant where fee transparency laws apply.</span>
      </div>
      <a data-act="bulkOpen" style="flex:none;font-size:14px;color:var(--ac,var(--rmx-brand, #008dd5));white-space:nowrap;cursor:pointer">Bulk Update Charges</a></div>`;
    return `<div style="display:flex;align-items:flex-start;gap:10px;background:#fef4e8;border:1px solid #f6d9ac;border-radius:4px;padding:12px 16px">

      <a data-act="bulkOpen" style="flex:none;font-size:14px;color:var(--ac,var(--rmx-brand, #008dd5));white-space:nowrap;cursor:pointer">Bulk Update Charges</a></div>`;
  }
  bulkSelRows(){ const bs = this.state.bulkSel; if (!bs) return [];

  feeProfileBody(){

      sections = this.acc(`Recurring Charges (${rec.length})`, '', this.profileTable('rec', rec, 'req-rec', { noLabel:true }), null, 'pf-rec')

        </div>

  setupDots(step){

  }
  // The properties this setup run applies to — one for a single property, many for a bulk run.
  setupProps(){ const c = this.state.setup; return (c && c.props) || []; }
  // The rows exactly as save will write them, so the review step counts what actually lands.
  // What setup would discover on a property. Properties added this session start blank — there are
  // no legacy charges to pull in.
  discoveredCharges(prop){
    if ((this.state.newProps || []).some(x => x.name === prop)) return [];
    return this.setupCandidates();
  }
  setupRows(prop, keepOri){
    // Setup only pulls property, unit type and unit charges — rentable items stay where they are, so
    // ORI charges are made by hand (or by switching a charge's level) after setup. keepOri is for the
    // seeded scenarios, where a property has been managing its charges since it converted.
    const noOri = rows => keepOri ? rows : rows.map(r => r.level === 'ORI' ? Object.assign({}, r, { level:'Property', target:'', oriType:undefined }) : r);
    // The Hamptons' pulled-in charges already carry complete marketing details — it stays the
    // worked example of a clean setup.
    if (this.listingReadyProps().indexOf(prop) >= 0) return noOri(this.listingReadyRows());
    if (!this.discoveredCharges(prop).length) return [];
    // The new setup moves every discovered charge — nothing is excluded during setup; charges are
    // managed (or removed) on the Charges tab afterwards. Charges that arrive with pulled-in
    // marketing details (NSF, late fees) keep the requirement they came with.
    return noOri(this.setupCandidates()).map(r => {
      const req = (r.listing && r.listing.requirement) || '';
      const suffix = /-one$/.test(r.group) ? '-one' : '-rec';
      // No chosen requirement keeps the group the charge was discovered with, so required charges
      // stay countable in the total monthly price until someone reclassifies them.
      const orig = String(r.group || '').split('-')[0];
      const prefix = req === 'Optional' ? 'opt' : req === 'Situational' ? 'sit' : req === 'Required' ? 'req' : (orig || 'ind');
      return Object.assign({}, r, { group: prefix + suffix });
    });

  // Step 3 "Confirm Setup": the irreversible-action warning, what lands, what to do after, and the

    const stat = (t, sub) => `<div style="flex:1;min-width:180px;background:#eef4f9;border-radius:4px;padding:12px 16px;display:flex;flex-direction:column;gap:3px">

  // ================= PRICING PREVIEW =================
  // What each lease term does to rent. 12 months is the baseline the unit's rent is quoted at.
  leaseTermOffsets(){
    return { '6 Months': 75, '12 Months': 0, '18 Months': -25, '24 Months': -50, 'Month-to-Month': 200 };
  }
  pricePreviewHTML(){
    const p = this.state.pricePreview; if (!p) return '';
    // On a marketed property the preview mirrors exactly what publishes, so it honours Include on
    // listings. Everywhere else nothing publishes at all, so it shows every charge — the point is to
    // see what a listing would look like, not what is being filtered out.
    const ilsProp = this.ilsOn(p.prop);
    const rows = ilsProp ? this.appliedRows().filter(r => r.ils) : this.appliedRows();
    const money = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
    const unit = this.unitInfo(p.unit);
    // Rent moves with the lease term: a short term costs more, a long one less. Only the rent charge
    // is offset, and the totals follow because everything prices through amtOf.
    const term = p.term || '12 Months';
    const termAdj = this.leaseTermOffsets()[term] || 0;
    const isRent = r => r.mits === 'RC';
    const amtOf = r => { const base = (() => { const a = this.parseAmt(r.amount); if (a) return a; if (r.est != null) return r.est;
        return /market/i.test(r.amount||'') ? this.parseAmt(unit.rent) : 0; })();
      return isRent(r) ? Math.max(0, base + termAdj) : base; };
    // Charges with no requirement chosen yet ('ind') sit with the required ones, so a freshly
    // converted property still previews a price instead of an empty breakdown.
    const of = pre => rows.filter(r => r.group.indexOf(pre) === 0 || (pre === 'req' && r.group.indexOf('ind') === 0));
    const optRows = of('opt'), sitRows = of('sit');
    const monthly = of('req').filter(r => !/-one$/.test(r.group));
    const oneTime = of('req').filter(r => /-one$/.test(r.group));
    // One-time charges split by when they're actually collected, so a prospect can see what's due at
    // application versus at move-in. Anything without one of those two lands in a general group.
    const dueOf = r => (r.listing && r.listing.feeDue) || '';
    const atApp = oneTime.filter(r => dueOf(r) === 'At Application');
    const atMoveIn = oneTime.filter(r => dueOf(r) === 'Move-In');
    const otherOne = oneTime.filter(r => ['At Application','Move-In'].indexOf(dueOf(r)) < 0);
    const chosenOpt = optRows.filter(r => p.opt[r.id] && !/-one$/.test(r.group));
    const chosenOptOne = optRows.filter(r => p.opt[r.id] && /-one$/.test(r.group));
    // Pet add-ons can be taken more than once — one line per pet — so they carry a quantity.
    const isPet = r => this.chargeCategoryFor(r.mits) === 'Pet';
    const qtyOf = r => { const v = p.opt[r.id]; return v === true ? 1 : (v || 0); };
    // A per-pet charge can carry a Max Charge Amount, which caps what the resident pays however many
    // pets they add — four pets at $30 with a $100 max is $100, not $120.
    const petCap = r => { const a = r.attrs || {}; return a.chargePer ? this.parseAmt(a.chargeMax) : 0; };
    const lineAmt = r => { const t = amtOf(r) * (isPet(r) ? Math.max(1, qtyOf(r)) : 1);
      const cap = petCap(r); return cap ? Math.min(t, cap) : t; };
    // True once the cap is what the resident actually pays, so the line can say why.
    const atCap = r => { const cap = petCap(r); return !!cap && amtOf(r) * Math.max(1, qtyOf(r)) > cap; };
    const mTotal = monthly.reduce((n,r)=>n+amtOf(r),0) + chosenOpt.reduce((n,r)=>n+lineAmt(r),0);
    const sum = rws => rws.reduce((n,r)=>n+amtOf(r),0);
    // A one-time add-on the prospect ticks is money due like any other one-time charge.
    const oTotal = sum(oneTime) + chosenOptOne.reduce((n,r)=>n+lineAmt(r),0);
    const line = (l,v,bold) => `<div style="display:flex;align-items:baseline;justify-content:space-between;padding:5px 0"><span style="font-size:14px;color:${bold?'var(--rmx-brand-dark, #13314c)':'var(--rmx-ink-2, #424e5b)'};${bold?'font-weight:600':''}">${l}</span><span style="font-size:14px;color:var(--rmx-brand-dark, #13314c);${bold?'font-weight:600':''}">${v}</span></div>`;
    const grp = (t, rws, suffix, subLabel) => rws.length ? `<div style="padding:12px 0;border-top:1px solid var(--rmx-bg-subtle, #f5f8fa)"><div style="font-size:14px;font-style:italic;color:var(--rmx-text-muted, #b3b3b3);margin-bottom:4px">${t}</div>${rws.map(r=>line(r.name + (isPet(r) && qtyOf(r) > 1 ? ` &times; ${qtyOf(r)}` : '') + (atCap(r) ? ` <span style="font-size:12px;color:var(--rmx-text-muted, #b3b3b3)">(max)</span>` : ''), money(lineAmt(r))+(suffix||''))).join('')}${subLabel?line(subLabel, money(rws.reduce((n,r)=>n+lineAmt(r),0)), true):''}</div>` : '';
    const step = (r, d, icon) => `<span data-act="ppQty" data-arg="${r.id}:${d}" style="display:flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid var(--rmx-line, #cedbe7);border-radius:2px;background:#fff;cursor:pointer" onmouseover="this.style.background='var(--rmx-brand-tint-bg, #ebf1f5)'" onmouseout="this.style.background='#fff'"><span class="material-symbols-outlined" style="font-size:14px;color:var(--ac,var(--rmx-brand, #008dd5))">${icon}</span></span>`;
    // A fixed-width slot on every row keeps the steppers (and the amounts beside them) in line.
    const stepper = r => `<span style="display:inline-flex;align-items:center;justify-content:flex-end;gap:7px;width:80px;flex:none">${(!isPet(r) || !p.opt[r.id]) ? '' : `${step(r,-1,'remove')}<span style="min-width:14px;text-align:center;font-size:14px;color:var(--rmx-brand-dark, #13314c)">${qtyOf(r)}</span>${step(r,1,'add')}`}</span>`;
    const optCb = r => `<label data-act="ppOpt" data-arg="${r.id}" style="display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer;font-size:14px;color:var(--rmx-brand-dark, #13314c)"><span style="width:18px;height:18px;border-radius:2px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex:none;${p.opt[r.id]?'background:var(--rmx-attention, #f58220);border:1px solid var(--rmx-attention, #f58220)':'background:#fff;border:1px solid var(--rmx-text-muted, #b3b3b3)'}">${p.opt[r.id]?'<span class="material-symbols-outlined" style="font-size:14px;color:#fff;font-weight:600">check</span>':''}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.name}</span>${stepper(r)}<span style="width:112px;flex:none;text-align:right;font-size:14px;color:var(--rmx-ink-2, #424e5b);white-space:nowrap">${money(lineAmt(r))}${/-one$/.test(r.group)?'/one-time':'/mo'}</span></label>`;
    const info = this.propInfo(p.prop);
    return `<div data-act="pricePreviewClose" style="position:fixed;inset:0;background:rgba(19,49,76,0.5);display:flex;align-items:center;justify-content:center;z-index:152">

          ? 'Only charges included on listings will display in the pricing preview.'

        <div style="flex:1;min-height:0;overflow-y:auto;display:flex;gap:0;flex-wrap:wrap">
          <div style="flex:1;min-width:300px;padding:16px 20px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box">
            <div style="display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--rmx-brand-tint-bg, #ebf1f5);padding-bottom:8px">
              <span style="font-size:14px;font-weight:600;color:var(--rmx-brand-dark, #13314c)">Select Unit</span>

  // Change log for the property's profile: what changed and when, plus a per-charge amount timeline.
  // Deliberately no trend graphs — the timeline itself carries the direction.
  profHistHTML(){
    const h = this.state.profHist; if (!h) return '';
    const prop = h.prop;
    const log = this.profileChangeLog(prop);
    const amt = this.profileAmountHistory(prop);

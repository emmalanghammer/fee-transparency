}">
class Component extends DCLogic {
  state = {
    view: 'register',
    accOpen: { 'pf-rec':true, 'pf-one':true, 'pf-req':true, 'pf-opt':true, 'pf-sit':true, 'pf-ind':true },
    groupByReq: false,
    pfFilter: null,
    pfFilters: null,
    addProp: null,
    newProps: [],
    propTab: 'General',
    property: 'Riverview Apartments',
    unit: '1B',
    toggles: {},
    // Per-property Rental Fee Profile. profileStatus[prop]='active' once set up;
    // profileFees[prop] holds that property's charge rows.
    // Properties opted into marketing on ILS. Marketing/MITS details are editable on every
    // property; this flag only controls whether ILS publishing is surfaced at all.
    // The Berkshires is listed but not yet converted, so the setup review can warn about the
    // listing impact. The opt-in itself only surfaces once a profile exists.
    ilsProps: { 'Riverview Apartments': true, 'The Berkshires': true },
    profileStatus: {},
    profileFees: {},
    profHist: null,
    // Changes made while using the prototype. The seeded history stops at today, so everything in
    // here is something the user did this session.
    histLog: [],
    nextFeeId: 101,
    setup: null,            // { prop, step:1|2|'saving', excl:{} }
    lvlSel: 'all',          // 'all' | 'Property' | 'Unit Type' | 'Unit' | 'ORI'
    bannerDismissed: {},
    pricePreview: null,     // { prop, unit, opt:{}, sitOpen }
    profMenu: null,
    recView: null,
    recViewNote: true,
    rowMenu: null,
    modal: null,
    toast: null
  };

  // ---------- properties (the top-level entity; fee profiles hang off these) ----------
  propertiesData(){
    return (this.state.newProps || []).concat([
      { name:'Riverview Apartments', short:'RIVER', email:'stewart@riverviewapts.com', manager:'Stewart Chandler', addr:'1492 Loveland-Madeira Road, Loveland, OH 45140', billing:'1492 Loveland-Madeira Road, Loveland, OH 45140', color:'#1570ef', loc:'Loveland, OH', units:50, occupied:30, owner:'Thompson Family Trust', logo:'assets/logo-riverview.png' },
      { name:'The Berkshires', short:'BERK', email:'malik@theberkshires.com', manager:'Malik Roberson', addr:'4321 Loveland-Miamiville Rd, Loveland, OH 45140', billing:'9876 Socialville-Fosters Rd, Mason, OH 45040', color:'#1570ef', loc:'Loveland, OH', units:64, occupied:58 },
      { name:'The Windermere', short:'WIND', email:'kiana@thewindermere.com', manager:'Kiana Booker', addr:'1234 Tylersville Rd, West Chester, OH 45069', billing:'5678 Fields Ertel Rd, Cincinnati, OH 45249', color:'', loc:'West Chester, OH', units:42, occupied:39 },
      { name:'The Estates', short:'ESTATE', email:'zack@theestates.com', manager:'Zackary Nixon', addr:'1357 Milford-Blanchester Rd, Milford, OH 45150', billing:'2468 Morrow-Rossburg Rd, Morrow, OH 45152', color:'#d92d20', loc:'Milford, OH', units:88, occupied:71 },
      { name:'Willow Creek', short:'WILLOW', email:'jaquan@willowcreek.com', manager:'Jaquan Fry', addr:'9012 Lebanon Rd, Maineville, OH 45039', billing:'3579 Columbia Rd, South Lebanon, OH 45065', color:'#12a150', loc:'Maineville, OH', units:36, occupied:33 },
      { name:'Greenbriar Village', short:'GREENB', email:'jaqueline@greenbriarvillage.com', manager:'Jaqueline Rush', addr:'4680 Wilmington Rd, Clarksville, OH 45113', billing:'5791 Jamestown-New Jasper Rd, Jamestown, OH 45335', color:'', loc:'Clarksville, OH', units:24, occupied:20 },
      { name:'Oakwood Manor', short:'OAKMAN', email:'bryan@oakwoodmanor.com', manager:'Bryan Ashley', addr:'6802 Paintersville-New Jasper Rd, Xenia, OH 45385', billing:'7913 Bellbrook-Sugarcreek Rd, Bellbrook, OH 45305', color:'', loc:'Xenia, OH', units:72, occupied:64 },
      { name:'Pinewood Place', short:'PINEPL', email:'arley@pinewoodplace.com', manager:'Arley Harrell', addr:'8024 Franklin St, Spring Valley, OH 45370', billing:'9135 Dayton-Xenia Rd, Beavercreek, OH 45434', color:'', loc:'Spring Valley, OH', units:18, occupied:15 },
      { name:'Cedar Ridge', short:'CRIDGE', email:'shea@cedarridge.com', manager:'Shea Ferry', addr:'0246 Indian Ripple Rd, Dayton, OH 45440', billing:'1357 Miamisburg-Centerville Rd, Dayton, OH 45459', color:'#f58220', loc:'Dayton, OH', units:56, occupied:49 },
      { name:'The Highlands', short:'HIGH', email:'kobe@thehighlands.com', manager:'Kobe Mccarty', addr:'2468 Far Hills Ave, Kettering, OH 45419', billing:'3579 Whipp Rd, Centerville, OH 45458', color:'#1570ef', loc:'Kettering, OH', units:44, occupied:40 },
      { name:'Valley Forge', short:'VALLEY', email:'jayson@valleyforge.com', manager:'Jayson Locklear', addr:'4680 Yankee St, Dayton, OH 45458', billing:'5791 Social Row Rd, Mason, OH 45040', color:'#737373', loc:'Dayton, OH', units:30, occupied:22 },
      { name:'The Arbors', short:'ARBORS', email:'rylee@thearbors.com', manager:'Rylee Herron', addr:'6802 Butler Warren Rd, Mason, OH 45040', billing:'7913 Columbia Rd, Kings Mills, OH 45034', color:'#13314c', loc:'Mason, OH', units:60, occupied:52 },
      { name:'Stonegate Village', short:'STONEG', email:'neha@stonegatevillage.com', manager:'Neha Walter', addr:'8024 Western Row Rd, Maineville, OH 45039', billing:'9135 Irwin Simpson Rd, Mason, OH 45040', color:'#12a150', loc:'Maineville, OH', units:58, occupied:39 },
      { name:'The Hamptons', short:'HAMPTON', email:'zavier@thehamptons.com', manager:'Zavier Burks', addr:'0246 Fields Ertel Rd, Cincinnati, OH 45241', billing:'1357 Loveland Madeira Rd, Loveland, OH 45140', color:'#f58220', loc:'Cincinnati, OH', units:34, occupied:31 }
    ]);
  }
  // Properties whose Rental Fee Profile can be copied when adding a property.
  copyableProfiles(){ return this.propertiesData().map(p=>p.name).filter(n=>this.usingProfile(n)); }
  propNames(){ return this.propertiesData().map(p => p.name); }
  propInfo(name){ const n = name || this.state.property; return this.propertiesData().find(p => p.name === n) || this.propertiesData()[0]; }
  properties(){ return this.propertiesData(); }

  // ---------- per-property Rental Fee Profile ----------
  // Properties that already have a Rental Fee Profile — the register's "Using Rental Fee Profile"
  // column. Opening one of these lands on the populated profile; the rest land on pre-setup.
  seededProfiles(){
    return ['Riverview Apartments','The Windermere','The Estates','Willow Creek','Greenbriar Village',
            'Oakwood Manor','Pinewood Place','Stonegate Village','The Hamptons'];
  }
  usingProfile(p){ return this.profStatus(p) === 'active'; }
  profStatus(p){
    const n = p || this.state.property;
    return this.state.profileStatus[n] || (this.seededProfiles().indexOf(n) >= 0 ? 'active' : 'none');
  }
  ilsOn(p){ return !!this.state.ilsProps[p || this.state.property]; }
  // The MITS 5.0 / listing fields a charge must carry before it can be marketed.
  mitsFields(){
    return [
      { key:'name',        label:'Name' },                                 // MITS: Name
      { key:'category',    label:'Charge Category' },                      // MITS: Code
      { key:'requirement', label:'Charge Requirement' },                   // MITS: Requirement
      { key:'feeDue',      label:'Fee Due' },                              // MITS: Lifecycle
      { key:'schedule',    label:'Charge Schedule', recurringOnly:true }   // MITS: Payment Frequency
    ];
  }
  // Charge Category resolves from the charge-type -> category map, so it only counts as missing
  // when a type has no mapping. Everything else — including the marketing Name, which is distinct
  // from the charge's operational name — must be entered by the user.
  // Best-guess MITS charge requirement from the charge type and comment. Situational charges only
  // apply when a condition is met; optional ones are tenant-selected add-ons; everything else
  // (rent, utilities, admin, deposits, application) is required.
  inferRequirement(r){
    const code = String(r.mits || '').toUpperCase();
    const text = ((r.desc || '') + ' ' + (r.name || '')).toLowerCase();
    if (/^PET/.test(code) || /\bpets?\b/.test(text)) return 'Situational';
    if (/^(LATE|LC|NSF|DAMAGE|VIOLATION|LEGAL)/.test(code)) return 'Situational';
    if (/^(SF|STORAGE|COVPARK|PARK|PARKING|GARAGE|HOLD|AMENFEE|AMENITY|UPGRADE|TECH|CABLE|TRANSFER)/.test(code)) return 'Optional';
    if (/\b(optional|add-?on|valet|storage|parking|garage|reservation|locker|access)\b/.test(text)) return 'Optional';
    return 'Required';
  }
  // The requirement chosen for a charge during setup (falls back to the inferred value).
  setupRequirement(r){
    const c = this.state.setup;
    return (c && c.req && c.req[r.id]) || this.inferRequirement(r);
  }
  // Requirement comes from the charge's group when marketing details haven't been saved yet.
  defaultRequirement(r){
    const g = String(r.group || '');
    return g.indexOf('opt') === 0 ? 'Optional' : g.indexOf('sit') === 0 ? 'Situational' : 'Required';
  }
  // ---------- Rental Fee Profile history ----------
  // Preloaded demo history, running up to today. Keyed to charge codes so it only surfaces for
  // charges the property actually has. Keys sort as 'YYYY-MM'; anything after this is tracked live.
  profileAmountSeed(){
    return {
      GARBAG:     { by:'Devon Marsh',    hist:[['2025-01','$25.00'],['2026-01','$26.00'],['2026-07','$28.00']] },
      GARBAGEFEE: { by:'Devon Marsh',    hist:[['2026-01','$4.00']] },
      ADMIN:      { by:'Admin',          hist:[['2025-01','$125.00'],['2026-01','$150.00']] },
      APPFEE:     { by:'Rachel Hodges',  hist:[['2025-01','$50.00'],['2026-01','$50.00']] },
      AMENFEE:    { by:'Admin',          hist:[['2025-01','$25.00'],['2026-01','$28.00']] },
      PETFEE:     { by:'Devon Marsh',    hist:[['2025-01','$35.00'],['2026-01','$45.00']] },
      DP:         { by:'Admin',          hist:[['2025-01','$450.00'],['2026-01','$500.00']] },
      HOLD:       { by:'Rachel Hodges',  hist:[['2026-01','$200.00']] }
    };
  }
  histLabel(k){
    if (k === 'now') return 'Just now';
    if (k === 'pre') return 'Earlier';
    const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const p = String(k).split('-');
    return mo[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }
  // ---------- change tracking ----------
  // Records something the user did in this session. Every profile mutation routes through here so
  // the history keeps up rather than being seeded fiction.
  logChange(prop, charge, change, level, extra){
    const e = Object.assign({ prop, by: 'Emma Langhammer', charge, change, level: level || prop }, extra || {});
    this.setState(s => ({ histLog: s.histLog.concat([e]) }));
  }
  histLabelFor(r){ return (r.mits ? r.mits + ' · ' : '') + (r.desc || (r.listing && r.listing.name) || r.name || 'Charge'); }
  // Field-by-field diff so an edit logs what actually changed instead of a bare "edited".
  chargeDiff(a, b){
    const out = [];
    const la = this.resolvedListing(a), lb = this.resolvedListing(b);
    const cmp = (label, x, y) => {
      const sx = x == null ? '' : String(x), sy = y == null ? '' : String(y);
      if (sx === sy) return;
      out.push(label + ' ' + (sx || '—') + ' → ' + (sy || '—'));
    };
    cmp('Amount', a.amount, b.amount);
    cmp('Charge Type', a.mits, b.mits);
    cmp('Comment', a.desc, b.desc);
    cmp('Charge Application', a.target || a.level, b.target || b.level);
    cmp('Amount Method', a.amtMethod, b.amtMethod);
    cmp('Frequency', a.freq, b.freq);
    cmp('Name', la.name, lb.name);
    cmp('Marketing Description', la.marketing, lb.marketing);
    cmp('Charge Requirement', la.requirement, lb.requirement);
    cmp('Fee Due', la.feeDue, lb.feeDue);
    cmp('Charge Schedule', la.schedule, lb.schedule);
    cmp('Situational Description', a.cond, b.cond);
    if (!!la.refundable !== !!lb.refundable) out.push('Refundable turned ' + (lb.refundable ? 'on' : 'off'));
    if (!!a.ils !== !!b.ils) out.push('Show on ILS turned ' + (b.ils ? 'on' : 'off'));
    return out;
  }
  // Logs a charge edit and, when the amount moved, carries the before/after so the amount timeline
  // can pick it up too.
  logChargeEdit(before, after){
    const diff = this.chargeDiff(before, after);
    if (!diff.length) return;
    const extra = this.parseAmt(before.amount) === this.parseAmt(after.amount) ? null
      : { chargeId: after.id != null ? after.id : before.id, amtFrom: before.amount, amt: after.amount };
    this.logChange(this.state.property, this.histLabelFor(after), diff.join(' · '), after.target || after.level, extra);
  }
  // Per-charge amount timelines: the preloaded history, then anything changed this session.
  profileAmountHistory(prop){
    const p = prop || this.state.property;
    const seed = this.profileAmountSeed();
    return this.profileRows(p).map(r => {
      const s = seed[r.mits];
      const sess = this.state.histLog.filter(e => e.prop === p && String(e.chargeId) === String(r.id) && e.amt);
      let hist = s ? s.hist.slice() : [];
      if (!hist.length && sess.length) hist = [['pre', sess[0].amtFrom]];
      sess.forEach(e => hist.push(['now', e.amt]));
      if (!hist.length) return null;
      const by = sess.length ? sess[sess.length - 1].by : s.by;
      return { row: r, by, hist };
    }).filter(f => f && this.parseAmt(f.hist[f.hist.length - 1][1]));
  }
  // Newest first: this session's tracked changes, then the preloaded demo history beneath them.
  profileChangeLog(prop){
    const p = prop || this.state.property;
    const log = this.state.histLog.filter(e => e.prop === p).slice().reverse()
      .map(e => ({ k:'now', by:e.by, charge:e.charge, change:e.change, level:e.level }));
    const seed = this.profileAmountSeed();
    const pre = [];
    this.profileRows(p).forEach(r => {
      const s = seed[r.mits]; if (!s) return;
      s.hist.forEach((entry, i) => {
        if (!i) return;
        const from = s.hist[i-1][1], to = entry[1];
        if (this.parseAmt(from) === this.parseAmt(to)) return;
        pre.push({ k: entry[0], by: s.by, charge: this.histLabelFor(r), change: from + ' → ' + to,
          level: r.target || r.level });
      });
    });
    pre.sort((a,b) => a.k < b.k ? 1 : a.k > b.k ? -1 : 0);
    pre.forEach(e => log.push(e));
    // Profiles converted this session log their own creation entry, so only preloaded ones need one.
    if (this.state.profileStatus[p] !== 'active') {
      const n = this.setupCandidates().length;
      log.push({ k:'2026-01', by:'Admin', charge:'Rental Fee Profile',
        change:'Profile created · ' + n + ' charges added', level:p });
    }
    return log;
  }
  // Deposits come back to the resident, fees don't. Pre-ticks the box for the deposit codes so the
  // common case is right without asking; not a required MITS field since a checkbox always has a value.
  defaultRefundable(r){
    return /^(DP|PETDP|SECDEP|HOLD)/.test(String(r && r.mits || '').toUpperCase());
  }
  // The listing values as the charge details overlay shows them — unset fields fall back to the
  // dropdown defaults. Diffing against these keeps the history from reporting a default being
  // persisted as if the user had changed it.
  resolvedListing(r){
    const L = (r && r.listing) || {};
    return {
      name: L.name,
      category: L.category || this.chargeCategoryFor(r.mits),
      requirement: L.requirement || this.defaultRequirement(r),
      feeDue: L.feeDue || 'During Term',
      schedule: /-one$/.test(r.group || '') ? (L.schedule || '') : (L.schedule || 'Monthly'),
      marketing: L.marketing,
      refundable: L.refundable !== undefined ? L.refundable : this.defaultRefundable(r)
    };
  }
  mitsMissing(r){
    const oneTime = /-one$/.test(r.group || '');
    // Fields whose dropdowns carry a default are already satisfied — only the ones with nothing to
    // fall back on (a typed Name, an unmapped Charge Category) count as missing.
    const resolved = this.resolvedListing(r);
    // Payment frequency only applies to recurring charges.
    return this.mitsFields()
      .filter(f => !(f.recurringOnly && oneTime))
      .filter(f => !String(resolved[f.key] || '').trim())
      .map(f => f.label);
  }
  mitsComplete(r){ return this.mitsMissing(r).length === 0; }
  mitsIncompleteCount(){ return this.profileRows().filter(r => !this.mitsComplete(r)).length; }
  profileRows(p){
    const n = p || this.state.property;
    const rows = this.state.profileFees[n];
    if (rows) return rows;

  // Read the Add/Edit Charge modal into one row on this property's profile.
  saveFee(){
    const m = this.state.modal; if (!m) return;
    const v = id => ((this.q('#'+id) || {}).value || '').trim();
    const mark = (el, bad) => { if (el) el.style.borderColor = bad ? '#d02830' : ''; };
    const chkd = id => { const e = this.q('#'+id); return !!(e && e.checked); };
    // Property specific charges keep every general field as pulled from the property; only their
    // marketing details and the ILS toggle are editable here.
    const specEd = m.edit && m.edit.propSpecific ? m.edit : null;
    if (specEd) {
      const nm = v('m-name'); const ilsOn = v('m-ils') === '1';
      if (ilsOn && !nm) { mark(this.q('#m-name'), true); const b = this.q('#m-err'); if (b) { const t = b.querySelector('#m-err-txt'); if (t) t.textContent = 'Complete required fields: Name'; b.style.display = 'inline-flex'; } return; }
      const req = v('m-req') || 'Situational';
      const patch = { ils: ilsOn, cond: v('m-sitdesc') || specEd.cond,
        listing: Object.assign({}, specEd.listing, { name: nm, category: this.chargeCategoryFor(specEd.mits), marketing: v('m-marketing'), requirement: req, feeDue: v('m-due') || 'During Term', refundable: chkd('m-refund') }) };
      const id = specEd.id;
      this.setProfileRows(rows => rows.map(f => String(f.id) === String(id) ? Object.assign({}, f, patch) : f));
      this.logChargeEdit(specEd, Object.assign({}, specEd, patch));
      this.setState({ modal: null });
      this.flash('Charge updated');
      return;
    }
    const name = v('m-name') || v('m-ctype-desc');
    const code = v('m-ctype');
    const app = v('m-app') || 'Property';
    const targetId = { 'Unit Type':'m-appt-ut', 'Unit':'m-appt-unit', 'ORI':'m-appt-ori' }[app];
    const target = targetId ? v(targetId) : '';
    const errs = [];
    mark(this.q('#m-ctype') && this.q('#m-ctype').parentElement, !code); if (!code) errs.push('Charge Type');
    if (targetId) { mark(this.q('#'+targetId) && this.q('#'+targetId).parentElement, !target); if (!target) errs.push(app); }
    const ils = v('m-ils') === '1';
    // Show-on-ILS requires the marketing details to actually be there.
    if (ils && !name) { mark(this.q('#m-name'), true); errs.push('Name'); }
    if (errs.length) { const b = this.q('#m-err'); if (b) { const t = b.querySelector('#m-err-txt'); if (t) t.textContent = 'Complete required fields: ' + errs.join(', '); b.style.display = 'inline-flex'; } return; }
    const eb = this.q('#m-err'); if (eb) eb.style.display = 'none';

    const src = v('m-source') || 'Flat';
    let amount;
    if (src === 'Reference') amount = v('m-ref').replace(/^Field:\s*/, '') || 'Market Rent';
    else if (src === 'Calculation') amount = 'Calculated';
    else { const a = v('m-amount'); amount = a ? ('$' + a.replace(/^\$/, '')) : '$0.00'; }
    const isOne = /-one$/.test(m.group);
    const req = v('m-req') || 'Required';
    const grp = (req === 'Optional' ? 'opt-' : req === 'Situational' ? 'sit-' : 'req-') + (isOne ? 'one' : 'rec');
    const row = {

      listing: { name, category: this.chargeCategoryFor(code), marketing: v('m-marketing'), requirement: req, feeDue: v('m-due'), schedule: isOne ? '' : v('m-sched'), refundable: chkd('m-refund') }
    };
    if (m.edit) {
      const id = m.edit.id;
      this.setProfileRows(rows => rows.map(f => String(f.id) === String(id) ? Object.assign({}, f, row) : f));
      this.logChargeEdit(m.edit, Object.assign({}, m.edit, row));
      this.setState({ modal: null }); this.flash('Charge updated'); return;
    }
    const id = this.state.nextFeeId;
    this.setProfileRows(rows => rows.concat([Object.assign({ id }, row)]));
    this.logChange(this.state.property, this.histLabelFor(row),
      'Charge added · ' + row.amount + ' · ' + (row.listing.requirement || 'Required'), target || app);

    this.flash('Charge added');

  // Reusable multi-select checklist dropdown (summary + overlay panel with search, select-all, checkboxes).

  singleSelect(id, options, selected, opt){

    const esc = s => (''+s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');

          <div style="display:flex;flex-direction:column;gap:4px;width:248px">
            <span style="font-size:14px;color:var(--ac,#008dd5)">Search</span>

              <span style="flex:1;min-width:0;font-style:italic;color:#b3b3b3;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Find a property</span>

            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;width:200px">
            <span style="font-size:14px;color:var(--ac,#008dd5)">Saved Filters</span>
            <div style="display:flex;align-items:center;gap:4px;height:36px;box-sizing:border-box;background:#fff;border:1px solid #cedbe7;border-radius:4px;padding:0 8px"><span style="flex:1;min-width:0;font-size:14px;color:#13314c">&lt; No Filter &gt;</span><span class="material-symbols-outlined" style="font-size:20px;color:#666">keyboard_arrow_down</span></div>

  propGeneralBody(){
    const p=this.state.property;
    const P=this.propInfo(p);

    const input=(t,v,link)=>`<div style="display:flex;flex-direction:column;gap:4px;min-width:0">${lab(t,link)}<input class="fld" value="${v||''}" style="height:34px;box-sizing:border-box"></div>`;
    const select=(t,v)=>`<div style="display:flex;flex-direction:column;gap:4px;min-width:0">${lab(t)}<select class="fld" style="height:34px"><option>${v}</option></select></div>`;
    const check=(t,on)=>`<label style="display:inline-flex;align-items:center;gap:8px;font-size:14px;color:#424e5b;cursor:pointer"><input type="checkbox" ${on?'checked':''} style="accent-color:#f58220;width:16px;height:16px;margin:0">${t}</label>`;

    const two=(a,b)=>`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;align-items:start">${a}${b}</div>`;
    const gtable=(cols,heads,rows)=>`<div style="border:1px solid #ebf1f5;border-radius:4px;overflow:hidden"><div style="display:grid;grid-template-columns:${cols};background:#f5f8fa;border-bottom:1px solid #cedbe7">${heads.map(h=>`<span style="padding:8px 12px;font-size:12px;font-weight:500;color:#666">${h}</span>`).join('')}</div>${rows.map(r=>`<div style="display:grid;grid-template-columns:${cols};align-items:center;border-bottom:1px solid #ebf1f5">${r.map(c=>`<span class="td" style="border:none">${c}</span>`).join('')}</div>`).join('')}</div>`;

    const thumb=()=>`<div style="position:relative;width:150px;height:130px;flex:none;background:repeating-conic-gradient(#eef2f5 0% 25%, #fff 0% 50%) 50% / 20px 20px;border:1px solid #ebf1f5;border-radius:4px"><span class="material-symbols-outlined" style="position:absolute;top:-8px;right:-8px;font-size:20px;color:var(--ac,#008dd5);background:#fff;border-radius:50%;cursor:pointer">cancel</span></div>`;
    const images = tile('Images', `<a data-act="toast" data-arg="Add Image" style="font-size:13px;display:inline-flex;align-items:center;gap:4px"><span class="material-symbols-outlined" style="font-size:18px">add</span>Add Image</a>`,
      `<div style="font-size:13px;color:#666">Marketing Images</div>
       <div style="display:flex;align-items:center;gap:16px">
         <span class="material-symbols-outlined" style="color:#666;cursor:pointer;flex:none">chevron_left</span>
         <div style="display:flex;gap:24px;flex:1;min-width:0;overflow-x:auto;padding-top:10px">${thumb()+thumb()+thumb()+thumb()}</div>
         <span class="material-symbols-outlined" style="color:#666;cursor:pointer;flex:none">chevron_right</span>
       </div>`);

    const general = tile(`General <span class="material-symbols-outlined" style="font-size:16px;color:var(--ac,#008dd5);vertical-align:-3px">info</span>`,'',
      `${input('Full Name', p)}
       <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${input('Short Name',P.short)}${select('Display Color','Apartment Complex')}</div>
       <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${input('Manager',P.manager)}${input('Email',P.email,'Manage Subscriptions')}</div>
       <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end"><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="font-size:13px;color:#666">Property Type</span><select class="fld" style="height:34px">${this.ptOpts('Apartment')}</select></div><div style="padding-bottom:8px">${check('Active',true)}</div></div>`);

    const address = tile('Primary Address', `<span data-act="toast" data-arg="Open addresses" class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5);cursor:pointer">open_in_new</span>`,
      `<div style="display:flex;align-items:center;border-bottom:1px solid #cedbe7">${['Primary','Alternate','Forwarding'].map((t,i)=>`<span data-act="toast" data-arg="${t} address" style="padding:8px 14px;font-size:13px;cursor:pointer;${i===0?'color:#13314c;font-weight:600;border-bottom:2px solid var(--ac,#008dd5)':'color:#666'}">${t}</span>`).join('')}<div style="flex:1"></div><span class="material-symbols-outlined" style="font-size:18px;color:#666">menu</span></div>
       <div style="border:1px solid #cedbe7;background:#f5f8fa;border-radius:4px;padding:10px 12px;font-size:14px;color:#13314c;line-height:1.5;min-height:56px;box-sizing:border-box">${P.addr}</div>
       <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">${check('Default',true)}<div style="flex:1"></div><a data-act="toast" data-arg="Use Management Company Address" style="font-size:13px">Use Management Company Address</a><a data-act="toast" data-arg="Address details" style="font-size:13px">Details</a></div>`);

    const logo = tile('Logo','',
      `<div style="font-size:13px;color:#666">Logo File</div>
       <div style="position:relative;width:217px;padding:6px 0">${P.logo?`<img src="${P.logo}" alt="${p} logo" style="width:217px;height:147px;object-fit:cover;border-radius:4px">`:`<div class="checker" style="width:217px;height:147px;border:1px solid #ebf1f5;border-radius:4px;display:flex;align-items:center;justify-content:center"><span style="font-size:13px;color:#8a9aa8">No logo</span></div>`}<span class="material-symbols-outlined" style="position:absolute;top:-2px;right:-10px;font-size:20px;color:var(--ac,#008dd5);background:#fff;border-radius:50%;cursor:pointer">cancel</span></div>`);

    const other = tile('Other Information','',
      `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        ${input('Property Tax ID','')}${select('Default Bank','1000 Fifth Third - Operating Bank Account For All Properties')}
        ${select('Rent Charge Types','4 Selected')}${select('Bank Settings','5 Selected')}
        ${input('Billing Name 1','PMC')}${select('Assign Service Issues','&lt;System Default&gt;')}
        ${input('Billing Name 2','')}${input('Posting Day','20')}
        ${input('Total Sq Ft','14,560')}${select('Default Inspector','Unassigned')}
      </div>`);

    const history = tile('History / Notes', `<a data-act="toast" data-arg="Add Note" style="font-size:13px;display:inline-flex;align-items:center;gap:4px">Add Note<span class="material-symbols-outlined" style="font-size:16px">open_in_new</span></a>`,
      gtable('110px 160px 1fr',['Date','Type','Note'],[
        ['02/25/2026','Lease Renewal Offer','Lease Renewal Offer: Offer Declined'],
        ['02/25/2026','Survey','Survey Self Inspection: Inspection Sent to Tenant'],
        ['02/25/2026','Text Message','The signable document for tenant is waiting to be signed.'],
        ['02/25/2026','Service Issue','Tenant added to Ticket #471 in Service Manager'],
        ['02/25/2026','Email','Unit Inspection has been completed'],
        ['02/25/2026','Text Messages','The signable document for Tenant is waiting to be signed']]));

    const fiscal = tile('Fiscal Year','', select('Fiscal Year Start','January'));
    const tz = tile('Time Zone Offset','', `${select('Time Zone','(UTC-05:00) Eastern Time (US & Canada)')}${check('Automatically adjust for daylight saving time',true)}`);

    const phones = tile('Phone Numbers', `<a data-act="toast" data-arg="Add Phone" style="font-size:13px">Add Phone</a>`,
      gtable('140px 1fr 100px',['Type','Number','Primary'],[
        ['Office','(513) 555-0142','<span class="material-symbols-outlined" style="font-size:18px;color:#3a7d2c">check</span>'],
        ['Leasing','(513) 555-0178',''],
        ['Maintenance','(513) 555-0195','']]));
    const udf = tile('User Defined Fields', `<a data-act="toast" data-arg="Add Field" style="font-size:13px">Add Field</a>`,
      gtable('220px 1fr',['Field','Value'],[
        ['MITS Property ID','RIV-0125'],
        ['Regional Portfolio','Southwest Ohio']]));

    const recurring = this.recChargesTile('property');

    const emptyReg=(t,heads)=>tile(t,'',`${gtable(heads.map(()=>'1fr').join(' '),heads,[heads.map(()=>'<span style="color:#b3b3b3">—</span>')])}<span style="font-size:13px;font-style:italic;color:#b3b3b3">No transactions in the current period</span>`);
    const files = tile('Property Files', `<a data-act="toast" data-arg="Upload file" style="font-size:13px">Upload file</a>`,
      gtable('1fr 100px 140px',['Name','Type','Uploaded'],[
        ['Insurance-Certificate-2025.pdf','PDF','Mar 12, 2025'],
        ['W9-Thompson-Family-Trust.pdf','PDF','Jan 8, 2025'],
        ['Riverview-Site-Map.png','Image','Nov 2, 2024']]));

    let h='';
    h+=this.profileSetupBanner(p);
    h+=recurring;
    h+=images;
    h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start">${general}${address}${logo}</div>`;
    h+=two(other,history);
    h+=two(fiscal,tz);
    h+=two(phones,udf);
    h+=this.propUnitsBody();
    h+=two(emptyReg('Deposits Register',['Date','Description','Amount','Balance']),files);
    return h;
  }

  // Entry point 1 / resume / success banner shown atop a legacy property's General tab.

    const head = `<div style="display:grid;grid-template-columns:${cols};background:#f5f8fa;border-bottom:1px solid #cedbe7">${['Unit','Unit type','Sq ft','Market rent','Tenant','Status',''].map((h,i)=>`<span style="padding:8px 12px${i===0?' 8px 16px':''};font-size:12px;font-weight:500;color:#666">${h}</span>`).join('')}</div>`;
    const body = this.units().map(u => `<div data-act="navUnit" data-arg="${u.u}" style="display:grid;grid-template-columns:${cols};align-items:center;border-bottom:1px solid #ebf1f5;cursor:pointer" onmouseover="this.style.background='#f0f6fb'" onmouseout="this.style.background=''">

      <span class="td num" style="border:none">${u.sqft}</span>

  // ================= PROFILE TABS =================
  // opts.right renders a right-aligned slot in the header (e.g. a help link).
  acc(title, sub, inner, count, key, opts){
    const collapsed = !(this.state.accOpen && this.state.accOpen[key]);
    const countLine = (count==null) ? '' : `<span class="acc-count" style="display:${collapsed?'block':'none'};font-size:12px;color:#666">${count} charge${count===1?'':'s'}</span>`;
    const right = (opts && opts.right) ? `<div style="flex:1"></div>${opts.right}` : '';
    return `<div class="tile" style="overflow:hidden">
      <div data-act="accToggle" data-arg="${key}" style="display:flex;align-items:center;gap:8px;padding:16px;cursor:pointer">
        <span class="material-symbols-outlined acc-chev" style="font-size:20px;color:#666">${collapsed?'expand_more':'expand_less'}</span>
        <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
          <span><span style="font-size:14px;font-weight:600;color:#13314c">${title}</span>${sub?`<span style="font-size:13px;color:#8a9aa8;font-style:italic;margin-left:8px">${sub}</span>`:''}</span>
          ${countLine}
        </div>${right}
      </div>
      <div class="acc-body" style="${collapsed?'display:none;':''}padding-bottom:12px">${inner}</div></div>`;
  }

  // ================= RENTAL FEE PROFILE (property tab) =================
  feeProfileTab(){
    const s = this.state;
    if (s.setup && s.setup.step === 'saving') return this.feeProfileLoading();
    if (this.profStatus() === 'active') return this.feeProfileBody();
    return this.feeProfileEmpty();
  }

  }
  feeProfileLoading(){
    return `<div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:80px 24px">
      <span style="position:relative;width:104px;height:104px;display:flex;align-items:center;justify-content:center">

        <span class="material-symbols-outlined" style="font-size:46px;color:var(--ac,#008dd5)">apartment</span>
      </span></div>`;
  }
  // Charge Level pill — Property / a unit-type name / Unit N / ORI.
  chargeLevelPill(r){
    const cls = { 'Property':'lvl-prop', 'Unit Type':'lvl-ut', 'Unit':'lvl-unit', 'ORI':'lvl-ori' }[r.level] || 'lvl-prop';
    const label = r.level === 'Unit Type' ? (r.target || 'Unit Type')
      : r.level === 'Unit' ? ('Unit ' + (r.target || ''))
      : r.level === 'ORI' ? 'ORI' : 'Property';
    return `<span class="lvl ${cls}">${label}</span>`;
  }
  // Marketing/MITS status for one charge. Hovering lists the exact fields still required, so the
  // work required is visible from the list without opening every charge.
  mitsStatusCell(r){
    const missing = this.mitsMissing(r);
    if (missing.length) {
      return `<span class="tipw" style="display:inline-flex"><span style="display:inline-flex;align-items:center;gap:5px;background:#fdf3e3;border-radius:12px;padding:2px 9px;cursor:default"><span class="material-symbols-outlined" style="font-size:15px;color:#b35a00">error</span><span style="font-size:13px;color:#7a5a2a;white-space:nowrap">${missing.length} needed</span></span><span class="tip" style="left:auto;right:-4px;top:26px;width:auto;min-width:190px;max-width:280px;padding:14px 16px"><span style="display:block;font-size:14px;font-weight:600;color:#13314c;padding-bottom:9px;border-bottom:1px solid #e3e9ee">${missing.length} field${missing.length===1?'':'s'} still required:</span><span style="display:flex;flex-direction:column;gap:10px;padding-top:11px">${missing.map(n=>`<span style="font-size:14px;color:#13314c;white-space:nowrap">${n}</span>`).join('')}</span></span></span>`;
    }
    if (!r.ils) {
      return `<span style="display:inline-flex;align-items:center;gap:5px" title="Marketing details complete — not shown on listings"><span class="material-symbols-outlined" style="font-size:17px;color:#8a9aa8">visibility_off</span><span style="font-size:13px;color:#8a9aa8;white-space:nowrap">Not listed</span></span>`;
    }
    return `<span style="display:inline-flex;align-items:center;gap:5px"><span class="material-symbols-outlined" style="font-size:17px;color:#12a150">check_circle</span><span style="font-size:13px;color:#13314c;white-space:nowrap">Charge listed</span></span>`;
  }
  levelCounts(){
    const rows = this.profileRows();
    const c = { all: rows.length, 'Property':0, 'Unit Type':0, 'Unit':0, 'ORI':0 };
    rows.forEach(r => { if (c[r.level] != null) c[r.level]++; });
    return c;
  }
  visibleRows(){
    const sel = this.state.lvlSel;
    return this.profileRows()
      .filter(r => sel === 'all' || r.level === sel)
      .filter(r => this.matchesFilters(r));
  }
  // Applied filter-panel criteria. Text fields honour the chosen Search Option.
  matchesFilters(r){
    const f = this.state.pfFilters; if (!f) return true;
    const op = f.op || 'Contains';
    const test = (needle, hay) => {
      if (!needle) return true;
      const n = String(needle).toLowerCase(), h = String(hay || '').toLowerCase();
      return op === 'Equals' ? h === n : op === 'Starts with' ? h.indexOf(n) === 0 : h.indexOf(n) >= 0;
    };
    const oneTime = /-one$/.test(r.group || '');
    if (f.type && f.type.length === 1) {
      if (f.type[0] === 'Recurring' && oneTime) return false;
      if (f.type[0] === 'One-Time' && !oneTime) return false;
    }
    if (!test(f.ctype, r.mits)) return false;
    if (!test(f.freq, r.freq)) return false;
    if (!test(f.name, (r.listing && r.listing.name) || r.name)) return false;
    if (!test(f.comment, r.desc)) return false;
    return true;
  }
  activeFilterCount(){
    const f = this.state.pfFilters; if (!f) return 0;
    let n = 0;
    if (f.type && f.type.length === 1) n++;
    ['ctype','freq','name','comment'].forEach(k => { if (f[k]) n++; });
    if (f.past) n++; if (f.future) n++;
    return n;
  }
  levelCountChip(label, count, key, icon){
    const on = this.state.lvlSel === key;
    return `<span data-act="lvlSel" data-arg="${key}" class="chip${on?' on':''}">${icon?`<span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5)">${icon}</span>`:''}${label}<span class="cnt" style="margin-left:6px">${count}</span></span>`;

  feeProfileToolbar(){

    return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      ${this.levelCountChip('Total Charges', c.all, 'all')}
      ${this.levelCountChip('Property Charges', c['Property'], 'Property', 'home')}
      ${this.levelCountChip('Unit Type Charges', c['Unit Type'], 'Unit Type', 'holiday_village')}
      ${this.levelCountChip('Unit Charges', c['Unit'], 'Unit', 'apartment')}
      ${this.levelCountChip('ORI Charges', c['ORI'], 'ORI')}

      <div style="flex:1"></div>
      ${(() => { const n = this.activeFilterCount(); const on = !!this.state.pfFilter || n > 0;
        return `<span data-act="pfFilterOpen" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;box-sizing:border-box;border:1px solid ${on?'var(--ac,#008dd5)':'#cedbe7'};border-radius:4px;background:${on?'#eaf4fb':'#fff'};cursor:pointer"><span class="material-symbols-outlined" style="font-size:20px;color:var(--ac,#008dd5)">tune</span>${n?`<span style="position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:var(--ac,#008dd5);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px">${n}</span>`:''}</span>`; })()}
      <button data-act="pricePreviewOpen" class="btn-out" style="height:36px;min-height:36px;padding:0 14px;border-radius:4px;font-size:14px;white-space:nowrap">Preview Pricing</button>
      <span style="position:relative;display:inline-flex">
        <button data-act="addopen" data-arg="req-rec" class="btn-pri" style="height:36px;min-height:36px;padding:0 14px;border-radius:4px 0 0 4px;font-size:14px;white-space:nowrap">Add Charge</button>
        <button onclick="var p=document.getElementById('pf-add-pnl');p.style.display=(p.style.display==='block'?'none':'block')" class="btn-pri" style="height:36px;min-height:36px;padding:0 6px;border-radius:0 4px 4px 0;border-left:1px solid rgba(255,255,255,0.35);font-size:14px"><span class="material-symbols-outlined" style="font-size:20px">arrow_drop_down</span></button>
        <div id="pf-add-pnl" style="display:none;position:absolute;right:0;top:40px;z-index:1000;min-width:210px;background:#fff;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,0.18);overflow:hidden">
          ${[['Add Recurring Charge','req-rec'],['Add One-Time Charge','req-one']].map(o=>`<div data-act="addopen" data-arg="${o[1]}" style="padding:10px 14px;font-size:14px;color:#13314c;cursor:pointer" onmouseover="this.style.background='#f0f6fb'" onmouseout="this.style.background=''">${o[0]}</div>`).join('')}
        </div>
      </span>
      <span data-act="profMenuOpen" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:36px;cursor:pointer"><span class="material-symbols-outlined" style="font-size:20px;color:var(--ac,#008dd5)">more_vert</span></span>
    </div>`;
  }
  profMenuHTML(){
    const p = this.state.profMenu; if (!p) return '';
    const left = Math.max(8, p.x - 260);
    const item = (t,act,arg) => `<div data-act="${act||'toast'}" data-arg="${arg!=null?arg:t}" style="padding:10px 14px;font-size:14px;color:var(--ac,#008dd5);cursor:pointer;white-space:nowrap" onmouseover="this.style.background='#f0f6fb'" onmouseout="this.style.background=''">${t}</div>`;
    const on = this.ilsOn();
    const ilsItem = `<div data-act="ilsPropToggle" style="display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:14px;color:var(--ac,#008dd5);cursor:pointer;white-space:nowrap" onmouseover="this.style.background='#f0f6fb'" onmouseout="this.style.background=''"><span class="material-symbols-outlined" style="font-size:18px;color:${on?'#12a150':'#c9d4dd'}">${on?'check_box':'check_box_outline_blank'}</span>Market this property on ILS</div>`;

        ${item('Memorize Rental Fee Profile')}${item('Load Memorized Rental Fee Profile')}${item('About Fee Transparency')}
      </div>`;

  // Recurring / One-Time subtable inside a profile section.
  profileTable(kind, rows, group, opts){
    const rec = kind === 'rec';
    const noLabel = !!(opts && opts.noLabel);
    // The ILS status column only appears on properties that market on ILS.
    const ils = this.ilsOn();
    const cols = rec ? (ils ? '120px minmax(160px,1fr) 110px 100px 90px 110px 120px 130px 40px'
                            : '120px minmax(160px,1fr) 110px 100px 90px 110px 120px 40px')
                     : (ils ? '120px minmax(160px,1fr) 110px 120px 130px 40px'
                            : '120px minmax(160px,1fr) 110px 120px 40px');
    const heads = rec ? ['Charge Type','Comment','Frequency','From','To','Amount','Charge Level'].concat(ils?['Listing Status']:[]).concat([''])
                      : ['Charge Type','Comment','Amount','Charge Level'].concat(ils?['Listing Status']:[]).concat(['']);
    const hc = (t,i) => `<span style="display:flex;align-items:center;padding:8px 12px${i===0?' 8px 16px':''};font-size:12px;font-weight:600;color:#13314c;white-space:nowrap;${/Amount/.test(t)?'justify-content:flex-end;':''}">${t}</span>`;
    const cell = (t,extra) => `<span style="display:flex;align-items:center;min-height:44px;box-sizing:border-box;padding:8px 12px;font-size:14px;color:#13314c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${extra||''}">${t}</span>`;
    const body = rows.length ? rows.map(r => {
      const kebab = `<span data-act="rowMenu" data-arg="${r.id}" style="display:flex;align-items:center;justify-content:center;min-height:44px;cursor:pointer"><span class="material-symbols-outlined" style="font-size:20px;color:var(--ac,#008dd5)">more_vert</span></span>`;
      const mid = rec
        ? cell(r.freq||'—') + cell(r.from||'—') + cell(r.to||'-')
        : '';
      return `<div data-act="rowDetails" data-arg="${r.id}" style="display:grid;grid-template-columns:${cols};align-items:center;border-bottom:1px solid #ebf1f5;cursor:pointer" onmouseover="this.style.background='#f7fafc'" onmouseout="this.style.background=''">
        ${cell(r.mits,'padding-left:16px')}${cell(r.desc||r.name)}${mid}${cell(String(r.amount||'').replace(/^\$/,''),'justify-content:flex-end;text-align:right')}
        <span style="display:flex;align-items:center;min-height:44px;padding:8px 12px">${this.chargeLevelPill(r)}</span>
        ${ils?`<span style="display:flex;align-items:center;min-height:44px;padding:8px 12px">${this.mitsStatusCell(r)}</span>`:''}${kebab}</div>`;
    }).join('') : `<div style="padding:14px 16px;font-size:13px;font-style:italic;color:#b3b3b3;border-bottom:1px solid #ebf1f5">No ${rec?'recurring':'one-time'} charges in this section.</div>`;
    const add = `<div data-act="addopen" data-arg="${group}" style="background:#f5f9fc;padding:9px 16px;cursor:pointer"><span style="display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ac,#008dd5)"><span class="material-symbols-outlined" style="font-size:18px">add</span>Add ${rec?'Recurring':'One-Time'} Charge</span></div>`;
    return `${noLabel?'':`<div style="font-size:13px;color:#666;padding:12px 20px 8px">${rec?'Recurring':'One-Time'}</div>`}
      <div style="padding:${noLabel?'4px':'0'} 20px 0;overflow-x:auto"><div style="min-width:${rec?(ils?1020:900):(ils?760:640)}px;border:1px solid #cedbe7;border-radius:4px;overflow:hidden">
        <div style="display:grid;grid-template-columns:${cols};border-bottom:1px solid #cedbe7">${heads.map(hc).join('')}</div>
        ${body}${add}</div></div>`;
  }
  // A charge's requirement comes from its marketing details; charges that haven't had one selected
  // yet fall into the "Individual Charges" group.
  reqOf(r){ return (r.listing && r.listing.requirement) || ''; }
  // Requirement-grouped section: Recurring + One-Time subtables under one requirement heading.
  profileSection(key, title, sub, rows, opts){
    const rec = rows.filter(r => !/-one$/.test(r.group));
    const one = rows.filter(r => /-one$/.test(r.group));
    const grp = key === 'opt' ? 'opt-' : key === 'sit' ? 'sit-' : 'req-';
    const inner = this.profileTable('rec', rec, grp+'rec') + this.profileTable('one', one, grp+'one');
    return this.acc(`${title} (${rows.length})`, sub, inner, null, 'pf-'+key, opts);
  }
  // Aggregate reminder of the MITS/listing work outstanding across the profile.
  mitsBanner(){
    const need = this.mitsIncompleteCount();
    const total = this.profileRows().length;
    const ils = this.ilsOn();
    // Marketing/MITS completeness only matters when the property publishes to ILS.
    if (!ils || !total) return '';
    if (!need) {
      const shown = this.profileRows().filter(r => r.ils).length;
      return `<div style="display:flex;align-items:center;gap:10px;background:#eaf7ef;border:1px solid #b7e4c6;border-radius:4px;padding:10px 16px">
        <span class="material-symbols-outlined" style="font-size:20px;color:#12a150">check_circle</span>
        <span style="font-size:13px;color:#2f5d43">Marketing details are complete on all ${total} charges. ${shown} shown on ILS listings.</span></div>`;
    }
    return `<div style="display:flex;align-items:flex-start;gap:10px;background:#fef4e8;border:1px solid #f6d9ac;border-radius:4px;padding:12px 16px">
      <span class="material-symbols-outlined" style="font-size:20px;color:#b35a00;flex:none">error</span>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
        <span style="font-size:13px;color:#13314c;line-height:1.5">${need} of ${total} charges still need marketing details before they can show on listings via ILS. Open a charge to fill in what's missing, or hover its listing status to see the exact fields required.</span>
      </div></div>`;
  }
  feeProfileBody(){
    const rows = this.visibleRows();
    let sections;
    if (this.state.groupByReq) {
      const sitHelp = `<span class="tipw" onclick="event.stopPropagation()"><span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ac,#008dd5);cursor:pointer"><span class="material-symbols-outlined" style="font-size:18px">info</span>What is a situational charge?</span><span class="tip" style="left:auto;right:0;top:24px">Additional fees may apply in cases of late payments, lease violations, or other charges.</span></span>`;
      const of = (req) => rows.filter(r => this.reqOf(r) === req);
      const groups = [
        ['req','Required Charges','', of('Required'), null],
        ['opt','Optional Charges','Tenant selects', of('Optional'), null],

  // Dismissible banner on the General tab pointing at the new profile.
  profileSetupBanner(p){
    if (this.profStatus(p) === 'active' || this.state.bannerDismissed[p]) return '';
    const n = this.setupCandidates().length;

        <span style="font-size:14px;font-weight:600;color:#13314c">This property has ${n} fees. Manage them in one place.</span>
        <span style="font-size:13px;color:#4a5b6b;line-height:1.5">A Rental Fee Profile centralizes your charges, deposits, and pricing on the property, simplifying setup, move-ins, and quotes. If you publish listings, fee transparency comes ready-made. Current tenants are unaffected.</span>
        <div style="display:flex;align-items:center;gap:16px;margin-top:6px">
          <button data-act="setupOpen" class="btn-pri" style="height:34px;padding:0 16px;border-radius:4px;font-size:14px">Setup Fee Profile</button>
          <a data-act="toast" data-arg="Opens contextual help" style="font-size:14px;color:var(--ac,#008dd5);cursor:pointer">Learn More</a>
        </div>
      </div>
      <span data-act="profBannerDismiss" class="material-symbols-outlined" style="font-size:20px;color:var(--ac,#008dd5);cursor:pointer;flex:none">close</span>
    </div>`;
  }

  // ================= SETUP WIZARD =================
  setupDots(step){
    const dot = on => `<span style="width:7px;height:7px;border-radius:50%;background:${on?'#8a9aa8':'#d7dee5'};display:inline-block"></span>`;
    return `<span style="display:inline-flex;align-items:center;gap:6px">${dot(step===1)}${dot(step===2)}${dot(step===3)}</span>`;
  }
  // The rows exactly as save will write them, so the review step counts what actually lands.
  setupRows(){
    const c = this.state.setup; if (!c) return [];
    return this.setupCandidates().filter(r => !c.excl[r.id]).map(r => {
      const req = this.setupRequirement(r);
      const suffix = /-one$/.test(r.group) ? '-one' : '-rec';
      const prefix = req === 'Optional' ? 'opt' : req === 'Situational' ? 'sit' : 'req';
      // The setup choice satisfies the MITS requirement field up front. Merge so charges that
      // already carry pulled-in marketing details (NSF, late fees) keep them.
      return Object.assign({}, r, { group: prefix + suffix, listing: Object.assign({}, r.listing, { requirement: req }) });
    });
  }
  setupHTML(){
    const c = this.state.setup; if (!c || c.step === 'saving') return '';
    const body = c.step === 1 ? this.setupStep1() : c.step === 2 ? this.setupStep2() : this.setupStep3();
    const back = `<button data-act="setupBack" class="btn-out" style="height:36px;min-height:36px;padding:0 20px;border-radius:4px;font-size:14px">Back</button>`;
    const next = `<button data-act="setupNext" class="btn-pri" style="height:36px;min-height:36px;padding:0 22px;border-radius:4px;font-size:14px">Next</button>`;
    // Saving stays behind the acknowledgement, since the profile takes over charging for the property.
    const save = `<button ${c.ack?'data-act="setupSave"':''} class="btn-pri" style="height:36px;min-height:36px;padding:0 20px;border-radius:4px;font-size:14px;${c.ack?'':'opacity:0.45;cursor:default'}">Save ${this.setupRows().length} Charges</button>`;
    const foot = c.step === 1
      ? `<div style="flex:1"></div>${next}`
      : `${back}<div style="flex:1"></div>${c.step === 2 ? next : save}`;
    return `<div data-act="setupClose" style="position:fixed;inset:0;background:rgba(19,49,76,0.5);display:flex;align-items:center;justify-content:center;z-index:120">
      <div data-act="noop" style="width:960px;max-width:96vw;max-height:92vh;background:#fff;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,0.3);display:flex;flex-direction:column;overflow:hidden">
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 16px 0"><span data-act="toast" data-arg="Help" class="material-symbols-outlined" style="font-size:22px;color:var(--ac,#008dd5);cursor:pointer">help</span><span data-act="setupClose" class="material-symbols-outlined" style="font-size:22px;color:var(--ac,#008dd5);cursor:pointer">close</span></div>
        <div style="text-align:center;font-size:20px;color:#13314c;padding:0 24px 16px">Rental Fee Profile Setup</div>
        <div style="flex:1;min-height:0;overflow-y:auto;padding:0 24px 8px">${body}</div>
        <div style="display:flex;align-items:center;gap:12px;padding:12px 24px 16px">${foot}</div>
        <div style="position:relative;height:0"><div style="position:absolute;left:50%;transform:translateX(-50%);bottom:26px">${this.setupDots(c.step)}</div></div>
      </div></div>`;
  }
  setupStep1(){
    const card = (t,b) => `<div style="flex:1;min-width:180px;background:#f7f9fb;border:1px solid #e3e9ee;border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:6px"><span style="font-size:14px;font-weight:600;color:#13314c">${t}</span><span style="font-size:13px;color:#4a5b6b;line-height:1.45">${b}</span></div>`;
    const src = this.setupSources();
    const total = src.reduce((n,r)=>n+r[1],0);
    const pill = lvl => this.chargeLevelPill({ level: lvl, target: lvl === 'Unit Type' ? 'Unit Type' : '' });
    const cols = 'minmax(200px,1fr) 140px 40px 130px';
    return `<div style="display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        ${card('One place for every fee','Charges, deposits, and pricing managed together on the property.')}
        ${card('Faster move-ins and quotes','New residents and rent quotes pull the right charges automatically.')}
        ${card('Ready for fee transparency','If you advertise listings, your complete pricing displays accurately.')}
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:14px;font-weight:600;color:#13314c">${total} charges configured in ${src.length} places</span>
        <span style="font-size:13px;color:#8a9aa8">The profile brings them into one page, organized by who they apply to:</span>
      </div>
      <div style="border:1px solid #e3e9ee;border-radius:4px;overflow:hidden">
        <div style="display:grid;grid-template-columns:${cols};border-bottom:1px solid #e3e9ee">${['Source','Number of Charges','','Charge Application'].map((h,i)=>`<span style="padding:8px 12px${i===0?' 8px 16px':''};font-size:12px;font-weight:600;color:#13314c">${h}</span>`).join('')}</div>
        ${src.map(r=>`<div style="display:grid;grid-template-columns:${cols};align-items:center;border-bottom:1px solid #f0f4f7">
          <span style="padding:9px 12px 9px 16px;font-size:13px;color:#13314c">${r[0]}</span>
          <span style="padding:9px 12px;font-size:13px;color:#13314c">${r[1]}</span>
          <span style="padding:9px 12px;color:#8a9aa8;font-size:16px">→</span>
          <span style="padding:9px 12px">${pill(r[2])}</span></div>`).join('')}
      </div>
      <div style="display:flex;align-items:flex-start;gap:10px;background:#13314c;border-radius:4px;padding:12px 16px">
        <span class="material-symbols-outlined" style="font-size:20px;color:#fff;flex:none">help</span>
        <span style="font-size:13px;color:#fff;line-height:1.5">Going forward, new move-ins, quotes, and renewals will charge from this profile. Existing tenant charges are unaffected.</span>
      </div></div>`;
  }
  // Explains the Charge Requirement field. Published to listings as the MITS "Requirement" value,
  // so the wording matches what a prospect would read on the listing.
  reqHelp(){
    const term = (t,d) => `<span style="display:block;font-size:13px;font-weight:400;color:#13314c;white-space:normal"><strong style="font-weight:600">${t}</strong> — ${d}</span>`;
    return `<span class="tipw" onclick="event.stopPropagation()"><span class="material-symbols-outlined" style="font-size:16px;color:var(--ac,#008dd5);cursor:pointer">info</span>`
      + `<span class="tip" style="left:auto;right:-6px;top:24px;width:310px;padding:14px 16px">`
      + `<span style="display:block;font-size:14px;font-weight:600;color:#13314c;padding-bottom:9px;border-bottom:1px solid #e3e9ee">Charge Requirement</span>`
      + `<span style="display:block;font-size:13px;font-weight:400;color:#666;white-space:normal;padding:11px 0 12px;line-height:1.5">Whether a charge applies to everyone, is the resident's to choose, or only applies under certain conditions.</span>`
      + `<span style="display:flex;flex-direction:column;gap:10px">`
      + term('Required', 'Applies to every resident. There is no way to opt out.')
      + term('Optional', 'The resident decides whether to add it, like a parking space or a storage unit.')
      + term('Situational', 'Only charged when something specific happens, like a late payment, a pet, or a lease violation.')
      + `</span></span></span>`;
  }
  setupStep2(){
    const c = this.state.setup;
    const all = this.setupCandidates();
    const inc = all.filter(r => !c.excl[r.id]).length;
    const box = on => `<span style="width:18px;height:18px;border-radius:3px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex:none;${on?'background:#f58220;border:1px solid #f58220':'background:#fff;border:1px solid #b3b3b3'}">${on?'<span class="material-symbols-outlined" style="font-size:14px;color:#fff;font-weight:600">check</span>':''}</span>`;
    const table = (label, rows, rec) => {
      const cols = '44px 120px minmax(150px,1fr) 110px 110px 150px';
      const heads = ['','Charge Type','Comment','Amount','Charge Level','Charge Requirement'];
      const hc = (t,i) => `<span style="padding:8px 10px;font-size:12px;font-weight:600;color:#13314c;white-space:nowrap;${/Amount/.test(t)?'justify-content:flex-end;display:flex;':''}${t===heads[5]?'display:flex;align-items:center;gap:5px;':''}">${t}${t===heads[5]?this.reqHelp():''}</span>`;
      const cell = (t,extra) => `<span style="display:flex;align-items:center;min-height:38px;padding:6px 10px;font-size:13px;color:#13314c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${extra||''}">${t}</span>`;
      // Pre-selected from the charge type/comment; the row click toggles inclusion so the select
      // stops propagation to stay independently changeable.
      const reqSel = (r) => { const v = this.setupRequirement(r);
        return `<span style="display:flex;align-items:center;min-height:38px;padding:6px 10px" onclick="event.stopPropagation()"><select onchange="window.__setupReq('${r.id}', this.value)" style="width:100%;height:30px;border:1px solid #cedbe7;border-radius:4px;background:#f5f8fa;font:400 13px Roboto,sans-serif;color:#13314c;padding:0 4px">${['Required','Optional','Situational'].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select></span>`; };
      return `<div style="font-size:13px;color:#666;padding:12px 0 6px">${label} (${rows.length})</div>
        <div style="border:1px solid #e3e9ee;border-radius:4px;overflow:hidden"><div style="overflow-x:auto"><div style="min-width:700px">
        <div style="display:grid;grid-template-columns:${cols};border-bottom:1px solid #e3e9ee">${heads.map(hc).join('')}</div>
        ${rows.map(r=>`<div data-act="setupToggle" data-arg="${r.id}" style="display:grid;grid-template-columns:${cols};align-items:center;border-bottom:1px solid #f0f4f7;cursor:pointer">
          <span style="display:flex;align-items:center;justify-content:center;min-height:38px">${box(!c.excl[r.id])}</span>
          ${cell(r.mits)}${cell(r.desc||r.name)}
          ${cell(r.amount,'justify-content:flex-end;text-align:right')}
          <span style="display:flex;align-items:center;min-height:38px;padding:6px 10px">${this.chargeLevelPill(r)}</span>
          ${reqSel(r)}</div>`).join('')}
        </div></div></div>`;
    };
    // Records a per-row requirement choice without losing it when the list re-renders.
    window.__setupReq = (id, val) => this.setState(s => ({
      setup: Object.assign({}, s.setup, { req: Object.assign({}, s.setup && s.setup.req, { [id]: val }) })
    }));
    return `<div style="display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;align-items:baseline;gap:12px"><span style="font-size:14px;font-weight:600;color:#13314c">Select which charges to include</span><div style="flex:1"></div><span style="font-size:13px;color:#4a5b6b">${inc} of ${all.length} included</span></div>
      <span style="font-size:13px;color:#8a9aa8;line-height:1.5">Unchecked charges won't be added. They won't apply to future move-ins, quotes, or listings. Existing tenant charges are unaffected either way. Not included: late fees, tenant-specific charges.</span>
      ${table('Recurring Charges', all.filter(r=>!/-one$/.test(r.group)), true)}
      ${table('One-Time Charges', all.filter(r=>/-one$/.test(r.group)), false)}
    </div>`;
  }
  // Step 3: the profile takes over charging for the whole property, so the change gets reviewed and
  // acknowledged before it lands. Listed properties additionally get told what it does to the listing.
  setupStep3(){
    const c = this.state.setup;
    const prop = c.prop;
    const rows = this.setupRows();
    const all = this.setupCandidates();
    const left = all.length - rows.length;
    const rec = rows.filter(r => !/-one$/.test(r.group)).length;
    const reqN = rows.filter(r => /^req/.test(r.group)).length;
    const optN = rows.filter(r => /^opt/.test(r.group)).length;
    const sitN = rows.filter(r => /^sit/.test(r.group)).length;
    const stat = (n, l) => `<div style="flex:1;min-width:130px;background:#f7f9fb;border:1px solid #e3e9ee;border-radius:4px;padding:12px 16px;display:flex;flex-direction:column;gap:2px"><span style="font-size:22px;font-weight:600;color:#13314c;line-height:1.2">${n}</span><span style="font-size:13px;color:#4a5b6b">${l}</span></div>`;
    // What the conversion does and doesn't reach. The dash row is the carve-out the user needs to see.
    const line = (icon, color, t, b) => `<div style="display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid #f0f4f7"><span class="material-symbols-outlined" style="font-size:20px;color:${color};flex:none">${icon}</span><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;color:#13314c">${t}</span><span style="font-size:13px;color:#8a9aa8;line-height:1.45">${b}</span></span></div>`;
    const scope = `<div style="border:1px solid #e3e9ee;border-radius:4px;overflow:hidden">
      ${line('check_circle','#12a150','Property, unit type, unit and rentable item charges','All '+rows.length+' move onto one page for '+prop+'. Editing a charge here changes it everywhere it applies.')}
      ${line('remove','#8a9aa8','Existing tenant charges','Not touched. Tenant-level charges stay where they are and keep billing exactly as they do today.')}
    </div>`;
    // Fee transparency raises the bar on every charge, so a listed property is told what is still missing.
    const ready = rows.filter(r => this.mitsComplete(r)).length;
    const short = rows.length - ready;
    const ils = !this.ilsOn(prop) ? '' : `<div style="display:flex;gap:12px;background:#fdf8ef;border:1px solid #f0d9ae;border-radius:4px;padding:14px 16px">
      <span class="material-symbols-outlined" style="font-size:20px;color:#b35a00;flex:none">warning</span>
      <span style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <span style="font-size:14px;font-weight:600;color:#13314c">${prop} is published to listings</span>
        <span style="font-size:13px;color:#4a5b6b;line-height:1.5">This conversion changes how your fees reach ILS. Fee transparency asks for more detail on every charge, so each one needs a Name, Charge Category, Charge Requirement, Fee Due and Charge Schedule before it can be published. Charges missing any of those stay off the listing until you fill them in.</span>
        <span style="font-size:13px;color:#4a5b6b">${short ? `<strong style="font-weight:600">${short} of ${rows.length} charges still need fields</strong> — the Rental Fee Profile flags each one after setup.` : `All ${rows.length} charges already have what listings need.`}</span>
      </span></div>`;
    const box = on => `<span style="width:18px;height:18px;border-radius:3px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;${on?'background:#f58220;border:1px solid #f58220':'background:#fff;border:1px solid #b3b3b3'}">${on?'<span class="material-symbols-outlined" style="font-size:14px;color:#fff;font-weight:600">check</span>':''}</span>`;
    return `<div style="display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:14px;font-weight:600;color:#13314c">Review and confirm</span>
        <span style="font-size:13px;color:#8a9aa8;line-height:1.5">This applies to all of ${prop}, not just one unit or lease. Check it over before you create the profile.</span>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        ${stat(rows.length, 'Charges added' + (rows.length ? ` · ${rec} recurring, ${rows.length - rec} one-time` : ''))}
        ${stat(left, left === 1 ? 'Charge left out' : 'Charges left out')}
        ${stat(`${reqN} / ${optN} / ${sitN}`, 'Required / Optional / Situational')}
      </div>
      ${ils}
      ${scope}
      <div data-act="setupAck" style="display:flex;gap:10px;align-items:flex-start;background:#f7f9fb;border:1px solid ${c.ack?'#cedbe7':'#e3e9ee'};border-radius:4px;padding:12px 16px;cursor:pointer">
        ${box(!!c.ack)}<span style="font-size:14px;color:#13314c;line-height:1.45">I understand this profile will charge every future move-in, quote and renewal on ${prop}.</span>
      </div>
    </div>`;
  }

  // ================= PRICING PREVIEW =================
  pricePreviewHTML(){
    const p = this.state.pricePreview; if (!p) return '';
    // On ILS-marketed properties the preview mirrors what publishes; elsewhere it previews every
    // charge whose marketing details are complete.
    const ilsProp = this.ilsOn(p.prop);
    const rows = this.profileRows().filter(r => ilsProp ? r.ils : this.mitsComplete(r));
    const money = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
    const unit = this.unitInfo(p.unit);
    const amtOf = r => { const a = this.parseAmt(r.amount); if (a) return a; if (r.est != null) return r.est; return /market/i.test(r.amount||'') ? this.parseAmt(unit.rent) : 0; };
    const of = pre => rows.filter(r => r.group.indexOf(pre) === 0);
    const optRows = of('opt'), sitRows = of('sit');
    const monthly = of('req').filter(r => !/-one$/.test(r.group));
    const moveIn = of('req').filter(r => /-one$/.test(r.group));
    const chosenOpt = optRows.filter(r => p.opt[r.id] && !/-one$/.test(r.group));
    const mTotal = monthly.reduce((n,r)=>n+amtOf(r),0) + chosenOpt.reduce((n,r)=>n+amtOf(r),0);
    const oTotal = moveIn.reduce((n,r)=>n+amtOf(r),0);

    const grp = (t, rws, suffix) => rws.length ? `<div style="padding:12px 0;border-top:1px solid #eef2f5"><div style="font-size:13px;font-style:italic;color:#8a9aa8;margin-bottom:4px">${t}</div>${rws.map(r=>line(r.name, money(amtOf(r))+(suffix||''))).join('')}${t==='Due at move-in'?line('Move-in fees total', money(oTotal), true):''}</div>` : '';
    const optCb = r => `<label data-act="ppOpt" data-arg="${r.id}" style="display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer;font-size:14px;color:#13314c"><span style="width:18px;height:18px;border-radius:3px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex:none;${p.opt[r.id]?'background:#f58220;border:1px solid #f58220':'background:#fff;border:1px solid #b3b3b3'}">${p.opt[r.id]?'<span class="material-symbols-outlined" style="font-size:14px;color:#fff;font-weight:600">check</span>':''}</span>${r.name}</label>`;
    const info = this.propInfo(p.prop);
    return `<div data-act="pricePreviewClose" style="position:fixed;inset:0;background:rgba(19,49,76,0.5);display:flex;align-items:center;justify-content:center;z-index:120">
      <div data-act="noop" style="width:940px;max-width:96vw;max-height:92vh;background:#fff;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,0.3);display:flex;flex-direction:column;overflow:hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #cedbe7"><span style="font-size:20px;color:#13314c">Pricing Preview</span><span style="display:inline-flex;align-items:center;gap:10px"><span data-act="toast" data-arg="Help" class="material-symbols-outlined" style="font-size:22px;color:var(--ac,#008dd5);cursor:pointer">help</span><span data-act="pricePreviewClose" class="material-symbols-outlined" style="font-size:22px;color:var(--ac,#008dd5);cursor:pointer">close</span></span></div>
        <div style="flex:1;min-height:0;overflow-y:auto;display:flex;gap:0;flex-wrap:wrap">
          <div style="flex:1;min-width:300px;padding:16px 20px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box">
            <div style="font-size:14px;font-weight:600;color:#13314c;border-bottom:1px solid #ebf1f5;padding-bottom:8px">Select Unit</div>
            <div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:13px;color:#666">Property</span><div style="display:flex;align-items:center;height:36px;box-sizing:border-box;padding:0 12px;font-size:14px;color:#13314c;background:#eef2f5;border:1px solid #e3e9ee;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.prop}</div></div>
            <div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:13px;color:#666">Unit</span>${this.singleSelect('pp-unit', this.units().map(u=>u.u), p.unit, { act:'ppUnit', noSearch:true })}</div>
            <div style="font-size:14px;font-weight:600;color:#13314c;border-bottom:1px solid #ebf1f5;padding-bottom:8px;margin-top:4px">Select Optional Fees</div>
            ${optRows.length ? optRows.map(optCb).join('') : '<span style="font-size:13px;font-style:italic;color:#b3b3b3">No optional fees with marketing details yet.</span>'}
            <div style="border:1px solid #cedbe7;border-radius:4px;overflow:hidden;margin-top:4px">
              <div data-act="ppSitToggle" style="display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer"><span style="font-size:14px;font-weight:600;color:#13314c;flex:1">Situational</span><span class="material-symbols-outlined" style="font-size:20px;color:#666">${p.sitOpen?'expand_less':'expand_more'}</span></div>
              ${p.sitOpen?`<div style="padding:0 14px 12px;display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#8a9aa8;line-height:1.5;margin-bottom:6px">Additional fees may apply in cases of late payments, lease violations, or other charges</span>${sitRows.length?'':'<span style="font-size:12px;font-style:italic;color:#b3b3b3">No situational fees with marketing details yet.</span>'}${(sitRows.length?sitRows:[]).map(r=>`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:#4a5b6b"><span>${r.name}</span><span>${money(this.parseAmt(r.amount))}/one-time</span></div>`).join('')}</div>`:''}
            </div>
          </div>
          <div style="flex:1;min-width:320px;background:#f5f8fa;padding:16px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px">
            <div style="background:#fff;border:1px solid #e3e9ee;border-radius:4px;overflow:hidden">
              <div style="padding:14px 16px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
                <div style="display:flex;flex-direction:column"><span style="font-size:14px;color:#4a5b6b">Total Monthly Price</span><span style="font-size:22px;font-weight:700;color:#13314c">${money(mTotal)}<span style="font-size:14px;font-weight:400;color:#8a9aa8">/mo</span></span></div>
                <span style="display:inline-flex;align-items:center;gap:10px;font-size:13px;color:#4a5b6b;white-space:nowrap"><span style="display:inline-flex;align-items:center;gap:4px"><span class="material-symbols-outlined" style="font-size:16px;color:var(--ac,#008dd5)">home</span>${info.short}</span><span style="display:inline-flex;align-items:center;gap:4px"><span class="material-symbols-outlined" style="font-size:16px;color:var(--ac,#008dd5)">apartment</span>${p.unit}</span></span>
              </div>
              <div style="padding:8px 16px 0">
                ${rows.length ? `${grp('Included every month', monthly)}${grp('Due at move-in', moveIn)}${chosenOpt.length?grp('Optional add-ons', chosenOpt, '/mo'):''}`
                  : `<div style="padding:16px 0;border-top:1px solid #eef2f5;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
                      <span class="material-symbols-outlined" style="font-size:30px;color:#c9d4dd">visibility_off</span>
                      <span style="font-size:13px;font-weight:600;color:#13314c">${ilsProp?'No charges are set to show on listings yet':'No charges have marketing details yet'}</span>
                      <span style="font-size:12px;color:#8a9aa8;line-height:1.5;max-width:300px">${ilsProp?'Fill in a charge\'s <b>Marketing Details</b> and turn on <b>Show on ILS Listings</b> to see it here.':'Fill in a charge\'s <b>Marketing Details</b> to see it here.'}</span>
                    </div>` }
              </div>
              <div style="margin:12px 16px 16px;background:#13314c;border-radius:4px;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="font-size:13px;color:#fff">Due monthly</span><span style="font-size:15px;font-weight:700;color:#fff">${money(mTotal)}</span><div style="flex:1"></div><span style="font-size:13px;color:#fff">Due one-time</span><span style="font-size:15px;font-weight:700;color:#fff">${money(oTotal)}</span></div>
            </div>
            <span style="font-size:12px;font-style:italic;color:#8a9aa8;line-height:1.5">${ilsProp?'Only charges with the Show on ILS option enabled will display in the pricing preview.':'Only charges with complete marketing details will display in the pricing preview.'}</span>
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;padding:12px 20px;border-top:1px solid #cedbe7;background:#f5f8fa"><button data-act="pricePreviewClose" class="btn-out" style="height:36px;min-height:36px;padding:0 28px;border-radius:4px;font-size:14px">OK</button></div>
      </div></div>`;
  }
  // Change log for the property's profile: what changed and when, plus a per-charge amount timeline.
  // Deliberately no trend graphs — the timeline itself carries the direction.
  profHistHTML(){
    const h = this.state.profHist; if (!h) return '';
    const prop = h.prop;
    const log = this.profileChangeLog(prop);
    const amt = this.profileAmountHistory(prop);
    const tile = (title, sub, inner, right) => `<div style="border:1px solid #cedbe7;border-radius:4px;overflow:hidden;background:#fff">

    const td = (t,extra) => `<span style="display:flex;align-items:center;min-height:38px;padding:6px 12px;font-size:13px;color:#13314c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${extra||''}">${t}</span>`;

    // ---- Change log ----
    const lcols = '104px 132px minmax(160px,1fr) minmax(230px,1.6fr) 130px';
    const lhead = `<div style="display:grid;grid-template-columns:${lcols};background:#f5f8fa;border-bottom:1px solid #cedbe7">${['Date','Changed by','Charge','Change','Charge Level'].map((t,i)=>hc(t,i)).join('')}</div>`;
    const lbody = log.map(e => `<div style="display:grid;grid-template-columns:${lcols};align-items:center;border-bottom:1px solid #ebf1f5">
      ${td(this.histLabel(e.k), 'padding-left:16px;color:' + (e.k==='now'?'#12a150;font-weight:500':'#13314c'))}
      ${td(e.by)}${td(e.charge)}${td(e.change,'color:#13314c;font-weight:500;white-space:normal;line-height:1.45;padding-top:9px;padding-bottom:9px')}${td(e.level,'color:#4a5b6b')}
    </div>`).join('');

    // ---- Amount history per charge ----
    const acols = 'minmax(180px,1fr) 130px 110px 160px 140px 60px';
    const ahead = `<div style="display:grid;grid-template-columns:${acols};background:#f5f8fa;border-bottom:1px solid #cedbe7">${['Charge','Charge Level','Current','Change over time','Last changed by',''].map((t,i)=>hc(t,i)).join('')}</div>`;
    const abody = amt.map((f, idx) => {
      const open = !!h.exp[idx];
      const first = this.parseAmt(f.hist[0][1]), cur = this.parseAmt(f.hist[f.hist.length-1][1]);
      const money = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
      const delta = f.hist.length < 2 || first === cur
        ? `<span style="font-size:13px;color:#8a9aa8">No change</span>`
        : `<span style="font-size:13px;color:${cur>first?'#b3261e':'#3a7d2c'};font-weight:500">${cur>first?'+':'−'}${money(Math.abs(cur-first)).replace('$','$')}</span><span style="font-size:12px;color:#8a9aa8">&nbsp;${f.hist[0][0]==='pre'?'this session':'since '+this.histLabel(f.hist[0][0])}</span>`;
      const sub = !open ? '' : `<div style="background:#f5f8fa;border-bottom:1px solid #ebf1f5;padding:6px 16px 12px 32px">${f.hist.map((e,i) => {
        const prev = i > 0 ? this.parseAmt(f.hist[i-1][1]) : null, v = this.parseAmt(e[1]);
        const dir = prev === null ? '<span style="color:#c9d4dd">•</span>'
          : v > prev ? '<span style="color:#b3261e;font-weight:600">▲</span>'
          : v < prev ? '<span style="color:#3a7d2c;font-weight:600">▼</span>' : '<span style="color:#8a9aa8">—</span>';
        const note = i === 0 ? 'Initial amount' : prev === v ? 'No change' : 'from ' + f.hist[i-1][1];
        return `<div style="display:flex;align-items:center;gap:14px;padding:6px 0;border-bottom:1px dashed #dce6ee">
          <span style="width:78px;font-size:12px;color:${e[0]==='now'?'#12a150':'#8a9aa8'}">${this.histLabel(e[0])}</span>
          <span style="width:72px;font-size:13px;font-weight:500;color:#13314c">${e[1]}</span>
          <span style="width:16px;text-align:center">${dir}</span>
          <span style="font-size:12px;color:#8a9aa8">${note}</span></div>`;
      }).join('')}</div>`;
      return `<div style="border-bottom:1px solid #ebf1f5">
        <div data-act="profHistExp" data-arg="${idx}" style="display:grid;grid-template-columns:${acols};align-items:center;cursor:pointer" onmouseover="this.style.background='#f4f8fb'" onmouseout="this.style.background=''">
          ${td(`${f.row.desc||f.row.name}<span style="display:block;font-size:11px;color:#8a9aa8">${f.row.mits}</span>`,'padding-left:16px;flex-direction:column;align-items:flex-start;justify-content:center;white-space:normal')}
          <span style="display:flex;align-items:center;min-height:38px;padding:6px 12px">${this.chargeLevelPill(f.row)}</span>
          ${td(f.row.amount,'font-weight:500')}

          ${td(f.by,'color:#4a5b6b')}

        </div>${sub}</div>`;

    return `<div data-act="profHistClose" style="position:fixed;inset:0;background:rgba(19,49,76,0.5);display:flex;align-items:center;justify-content:center;z-index:120">

        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #cedbe7"><span style="font-size:20px;color:#13314c">Rental Fee Profile History</span><span style="display:inline-flex;align-items:center;gap:10px"><span data-act="toast" data-arg="Help" class="material-symbols-outlined" style="font-size:22px;color:var(--ac,#008dd5);cursor:pointer">help</span><span data-act="profHistClose" class="material-symbols-outlined" style="font-size:22px;color:var(--ac,#008dd5);cursor:pointer">close</span></span></div>

        </div>

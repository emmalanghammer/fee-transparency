    const historyNotes = `<div class="card">${cardHead('History / Notes','Add Note',true)}${histRows.length?`<div style="padding:8px 0">${histRows.map(r=>`<div style="display:flex;gap:12px;padding:8px 16px;border-bottom:1px solid var(--rmx-brand-tint-bg, #ebf1f5)"><span style="font-size:14px;color:var(--rmx-text-muted, #b3b3b3);width:44px;flex:none">${r[0]}</span><span style="font-size:14px;color:var(--rmx-brand-hover, #0071aa);width:64px;flex:none">${r[1]}</span><span style="font-size:14px;color:var(--rmx-brand-dark, #13314c)">${r[2]}</span></div>`).join('')}</div>`:emptyGrid(['Date','Type','Note'])}</div>`;
    const pets = `<div class="card">${cardHead('Pets','Add Pet',true)}<div style="padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:12px"><span style="font-size:14px;color:var(--rmx-text-muted, #b3b3b3)">No pets recorded.</span><button data-act="toast" data-arg="Add pet" class="btn-pri" style="padding:8px 18px;font-size:14px">Add Pet</button></div></div>`;
    const udfs = `<div class="card">${cardHead('User Defined Fields','',true)}<div style="display:grid;grid-template-columns:1fr 1fr;background:var(--rmx-bg-subtle, #f5f8fa);border-bottom:1px solid var(--rmx-line, #cedbe7)"><span style="padding:8px 16px;font-size:14px;font-weight:500;color:var(--rmx-text, #666666)">Name</span><span style="padding:8px 16px;font-size:14px;font-weight:500;color:var(--rmx-text, #666666)">Value</span></div><div style="display:grid;grid-template-columns:1fr 1fr"><span class="td" style="border:none;padding-left:16px">Vendor Confirmation</span><span class="td" style="border:none">Yes</span></div></div>`;
    const cards = [ leases, contacts, historyNotes, transactions, serviceIssues, udfs, pets, general, addresses, misc ];
    h += `<div style="padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch">${cards.join('')}</div>`;
    return `<div style="flex:1;min-height:0;display:flex;align-items:stretch;overflow:hidden"><div style="flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column"><div style="flex:1;min-width:0;display:flex;flex-direction:column">${h}</div></div>${this.rail()}</div>`;
  }

  // Filters dropdown anchored to the profile toolbar's tune button (Figma 2496-54203).
  pfFilterHTML(){
    const p = this.state.pfFilter; if (!p) return '';
    const f = this.state.pfFilters || {};
    const W = 330;
    const left = Math.max(8, Math.min(p.x - W, window.innerWidth - W - 8));
    // Anchor below the trigger, but cap the height to the room actually available — and when there
    // isn't enough, lift the panel so its footer never lands past the bottom of the window.
    const gap = 8, vh = window.innerHeight;
    const cap = Math.min(660, Math.round(vh * 0.8));
    const below = vh - p.y - gap;
    let top = p.y, maxH = Math.min(cap, below);
    if (below < 300) { maxH = Math.min(cap, vh - gap * 2); top = Math.max(gap, vh - gap - maxH); }
    const lab = (t, menu) => `<span style="display:flex;align-items:center;font-size:14px;color:#5a6773">${t}${menu?`<div style="flex:1"></div><span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,var(--rmx-brand, #008dd5));cursor:pointer">menu</span>`:''}</span>`;
    const inp = (id, val, ph, icon) => `<div style="display:flex;align-items:center;gap:6px;height:34px;box-sizing:border-box;background:#fff;border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;padding:0 8px">${icon?`<span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,var(--rmx-brand, #008dd5));flex:none">${icon}</span>`:''}<input id="${id}" value="${(val||'').replace(/"/g,'&quot;')}" placeholder="${ph||''}" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font:400 14px Roboto,sans-serif;color:var(--rmx-brand-dark, #13314c)"></div>`;
    const dateInp = (id, val) => `<div style="flex:1;min-width:0;display:flex;align-items:center;gap:4px;height:34px;box-sizing:border-box;background:#fff;border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;padding:0 6px"><input id="${id}" value="${val||''}" placeholder="mm/dd/yyyy" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font:400 13px Roboto,sans-serif;color:var(--rmx-brand-dark, #13314c)"><span class="material-symbols-outlined" style="font-size:16px;color:#5a6773;flex:none">calendar_month</span></div>`;
    const cb = (id, label, on) => `<label style="display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--ac,var(--rmx-brand, #008dd5));cursor:pointer"><input type="checkbox" id="${id}" ${on?'checked':''} style="width:16px;height:16px;margin:0;accent-color:var(--ac,var(--rmx-brand, #008dd5))">${label}</label>`;
    const field = (label, inner, menu) => `<div style="display:flex;flex-direction:column;gap:4px">${lab(label, menu)}${inner}</div>`;
    return `<div data-act="pfFilterClose" style="position:fixed;inset:0;z-index:150"></div>
      <div data-act="noop" style="position:fixed;left:${left}px;top:${top}px;width:${W}px;max-height:${maxH}px;background:var(--rmx-brand-tint-bg, #ebf1f5);border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:151;display:flex;flex-direction:column;overflow:hidden">
        <div style="flex:none;display:flex;flex-direction:column;gap:8px;padding:14px 16px 0"><span style="font-size:14px;font-weight:600;color:var(--rmx-brand-dark, #13314c)">Filters</span><div style="height:1px;background:var(--rmx-line, #cedbe7)"></div></div>
        <div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:12px 16px">
        ${field('Type', this.multiSelect('pf-f-type', ['Recurring','One-Time'], (f.type && f.type.length) ? f.type : ['Recurring','One-Time']))}
        ${field('From Date Range', `<div style="display:flex;align-items:center;gap:6px">${dateInp('pf-f-from', f.from||'01/01/2026')}${dateInp('pf-f-to', f.to||'04/01/2026')}<span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,var(--rmx-brand, #008dd5));cursor:pointer;flex:none">menu</span></div>`)}
        ${field('Search Options', this.singleSelect('pf-f-op', ['Contains','Starts with','Equals'], f.op||'Contains', { noSearch:true }))}
        ${field('Charge Type', inp('pf-f-ctype', f.ctype, '', 'search'))}
        ${field('Frequency', inp('pf-f-freq', f.freq, ''))}
        ${field('Name', inp('pf-f-name', f.name, ''))}
        ${field('Comment', inp('pf-f-comment', f.comment, ''), true)}
        <div style="display:flex;align-items:center;gap:22px;padding-top:2px;flex-wrap:wrap">${cb('pf-f-past','Past',f.past)}${cb('pf-f-future','Future',f.future)}${cb('pf-f-exc','Exceptions',f.exc)}</div>
        </div>
        <div style="flex:none;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 16px;border-top:1px solid var(--rmx-line, #cedbe7);background:var(--rmx-brand-tint-bg, #ebf1f5)">
          <button data-act="pfFilterApply" class="btn-pri" style="height:34px;padding:0 20px;border-radius:4px;font-size:14px">Apply</button>
          <button data-act="pfFilterReset" class="btn-out" style="height:34px;padding:0 20px;border-radius:4px;font-size:14px;box-sizing:border-box">Reset</button>
        </div>
      </div>`;
  }

  // ================= ADD PROPERTY OVERLAY =================
  addPropHTML(){
    const a = this.state.addProp; if (!a) return '';
    const nav = ['Property Information','User Defined Fields','Ownerships','Management Fee Setup'];
    const navItem = (t) => { const on = a.nav === t; return `<div data-act="addPropNav" data-arg="${t}" style="padding:9px 16px;font-size:14px;cursor:pointer;${on?'background:#fff;color:var(--rmx-brand-dark, #13314c);font-weight:500':'color:#c6d4e2'}">${t}</div>`; };
    const sect = (title, inner) => `<div style="border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;background:#fff;overflow:hidden;flex:none">
      <div style="padding:7px 12px;border-bottom:2px solid var(--ac,var(--rmx-brand, #008dd5));font-size:14px;font-weight:600;color:var(--rmx-brand-dark, #13314c)">${title}</div>
      <div style="padding:14px 12px;display:flex;flex-direction:column;gap:12px">${inner}</div></div>`;
    const row = (...cols) => `<div style="display:flex;gap:12px;align-items:flex-start">${cols.join('')}</div>`;
    const fld = (label, inner, grow) => `<div style="flex:${grow||1};min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font-size:14px;color:var(--rmx-text, #666666)">${label}</span>${inner}</div>`;
    const inp = (o) => { o = o || {}; return `<input ${o.id?`id="${o.id}"`:''} value="${o.val||''}" placeholder="${o.ph||''}" style="height:32px;box-sizing:border-box;border:1px solid ${o.err?'var(--rmx-error, #eb343c)':'var(--rmx-line, #cedbe7)'};border-radius:4px;background:var(--rmx-bg-subtle, #f5f8fa);padding:0 8px;font:400 13px Roboto,sans-serif;color:var(--rmx-brand-dark, #13314c);outline:none">`; };
    const sel = (v) => `<div style="height:32px;box-sizing:border-box;border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;background:var(--rmx-bg-subtle, #f5f8fa);display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 4px 0 8px;font-size:14px;color:var(--rmx-brand-dark, #13314c);cursor:pointer"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v}</span><span class="material-symbols-outlined" style="font-size:18px;color:var(--rmx-text, #666666);flex:none">expand_more</span></div>`;
    const chk = (on, label) => `<label style="display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--rmx-brand-dark, #13314c);cursor:pointer"><span style="width:16px;height:16px;border-radius:2px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex:none;${on?'background:var(--rmx-attention, #f58220);border:1px solid var(--rmx-attention, #f58220)':'background:#fff;border:1px solid var(--rmx-text-muted, #b3b3b3)'}">${on?'<span class="material-symbols-outlined" style="font-size:14px;color:#fff;font-weight:600">check</span>':''}</span>${label}</label>`;
    const radio = (on, label, act, arg) => `<label data-act="${act}" data-arg="${arg}" style="display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--rmx-brand-dark, #13314c);cursor:pointer"><span style="width:16px;height:16px;border-radius:50%;box-sizing:border-box;border:2px solid ${on?'var(--ac,var(--rmx-brand, #008dd5))':'var(--rmx-text-muted, #b3b3b3)'};display:flex;align-items:center;justify-content:center;flex:none">${on?'<span style="width:8px;height:8px;border-radius:50%;background:var(--ac,var(--rmx-brand, #008dd5))"></span>':''}</span>${label}</label>`;
    const hint = (t) => `<span style="font-size:12px;color:var(--rmx-text-muted, #b3b3b3);padding-left:24px">${t}</span>`;

    // ---- Fee Transparency: Blank, or copy charges from a property that already has it on ----
    const copyable = this.copyableProfiles();
    const isCopy = a.fee === 'copy';
    // Unit-level marketing keeps fees on each unit, so there's no property-wide profile to configure.
    // Marketing configuration is independent of Fee Transparency — centralizing charges doesn't depend
    // on whether the property markets at property or unit level.
    const unitMkt = a.mkt === 'unit';
    const srcRows = isCopy && a.copyFrom ? this.profileRows(a.copyFrom) : [];
    const chargeTable = (label, rows, rec) => {
      const cols = rec ? '38px 110px minmax(140px,1fr) 80px 90px 50px 100px 90px' : '38px 110px minmax(140px,1fr) 100px 90px';
      const heads = rec ? ['','Charge Type','Comment','Frequency','From','To','Amount','Charge Level'] : ['','Charge Type','Comment','Amount','Charge Level'];
      const allOn = rows.length && rows.every(r => a.sel[r.id]);
      const hc = (t,i) => i === 0
        ? `<span data-act="addPropAll" data-arg="${rec?'rec':'one'}" title="${allOn?'Clear all':'Select all'}" style="display:flex;align-items:center;justify-content:center;padding:6px 8px;cursor:pointer">${chk(!!allOn,'')}</span>`
        : `<span style="padding:6px 8px;font-size:14px;font-weight:600;color:var(--rmx-brand-dark, #13314c);white-space:nowrap;${/Amount/.test(t)?'display:flex;justify-content:flex-end;':''}">${t}</span>`;
      const cell = (t, extra) => `<span style="display:flex;align-items:center;min-height:34px;padding:5px 8px;font-size:14px;color:var(--rmx-brand-dark, #13314c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${extra||''}">${t}</span>`;
      return `<div style="font-size:14px;color:var(--rmx-text, #666666);padding:8px 0 4px">${label} (${rows.length})</div>
        <div style="border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;overflow:hidden">
        <div style="display:grid;grid-template-columns:${cols};border-bottom:1px solid var(--rmx-line, #cedbe7);background:#fff">${heads.map(hc).join('')}</div>
        ${rows.map(r=>`<div data-act="addPropToggle" data-arg="${r.id}" style="display:grid;grid-template-columns:${cols};align-items:center;border-bottom:1px solid var(--rmx-bg-subtle, #f5f8fa);cursor:pointer;background:#fff">
          <span style="display:flex;align-items:center;justify-content:center;min-height:34px">${chk(!!a.sel[r.id],'')}</span>
          ${cell(r.mits)}${cell(r.desc||r.name)}${rec?(cell(this.freqNum(r)||'1')+cell(r.from||'—')+cell(r.to||'-')):''}
          ${cell(String(r.amount||'').replace(/^\$/,''),'justify-content:flex-end;text-align:right')}
          <span style="display:flex;align-items:center;min-height:34px;padding:5px 8px;min-width:0;overflow:hidden">${this.chargeLevelPill(r, a.copyFrom)}</span></div>`).join('')}
        </div>`;
    };
    const copyBlock = !isCopy ? '' : `<div style="display:flex;flex-direction:column;gap:6px;padding-left:24px">
        <div style="max-width:340px">${this.singleSelect('ap-copy', copyable.length?copyable:['No properties with a profile'], a.copyFrom, { act:'addPropCopyFrom' })}</div>
        <span style="font-size:12px;color:var(--rmx-text-muted, #b3b3b3)">Copy recurring and one-time charges from properties that already have Fee Transparency turned on.</span>
        ${srcRows.length?`<div style="margin-top:6px;display:flex;flex-direction:column;gap:2px">
          <div style="display:flex;align-items:baseline;gap:10px"><span style="font-size:14px;font-weight:600;color:var(--rmx-brand-dark, #13314c)">Select Recurring and One-Time Charges to Include</span><div style="flex:1"></div><span style="font-size:12px;color:var(--rmx-ink-2, #424e5b)">${srcRows.filter(r=>a.sel[r.id]).length} of ${srcRows.length} selected</span></div>
          <div style="border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;background:var(--rmx-bg-subtle, #f5f8fa);padding:10px 12px;max-height:260px;overflow-y:auto">
            ${chargeTable('Recurring Charges', srcRows.filter(r=>!/-one$/.test(r.group)), true)}
            ${chargeTable('One-Time Charges', srcRows.filter(r=>/-one$/.test(r.group)), false)}
          </div></div>`:''}
      </div>`;

    const propInfo = `
      ${sect('General Information', row(
        fld('Property Name *', inp({ id:'ap-name', err:a.err })),
        fld('Short Name *', inp({ id:'ap-short' }))
      ) + row(
        fld('Property Type', sel('&nbsp;')),
        fld('Display Color', sel('<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:11px;height:11px;background:var(--rmx-brand-dark, #13314c);border-radius:2px"></span>Default</span>'))
      ))}
      ${sect('Other Information', row(
        fld('Property Tax ID', inp({})),
        fld('Posting Day', inp({ val:'25' }))
      ) + row(
        fld('Default Bank', sel('1000 Fifth Third - Operating Bank Account For All Prope…')),
        fld('Rent Charge Type *', sel('RC'))
      ) + row(
        fld('Statement Method', sel('&lt;Use System Default&gt; (Email)'), 2),
        fld('NSF Fee', chk(true, 'Override system default ($100.00)')),
        fld('Custom Amount', inp({ val:'15.00' }))
      ) + fld('Comment', `<textarea style="height:56px;resize:none;box-sizing:border-box;border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;background:var(--rmx-bg-subtle, #f5f8fa);padding:6px 8px;font:400 13px Roboto,sans-serif;color:var(--rmx-brand-dark, #13314c);outline:none"></textarea>`))}
      ${sect('Add Unit, Unit Types, Amenities, and Users', row(
        fld('Valid Unit Types for Property', sel('All Selected')),
        fld('Property Amenities', sel('&nbsp;')),
        fld('Users with Access to Property', sel('64 Selected'))
      ) + row(
        fld('&nbsp;', chk(false, 'Automatically create a unit')),
        fld('Type of Unit to create', `<div style="height:32px;box-sizing:border-box;border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;background:var(--rmx-bg-subtle, #f5f8fa);display:flex;align-items:center;gap:6px;padding:0 8px"><span class="material-symbols-outlined" style="font-size:16px;color:var(--rmx-text-muted, #b3b3b3)">search</span></div>`)
      ))}
      ${sect('Marketing Configuration', `<div style="display:flex;align-items:center;gap:24px">${radio(unitMkt===false,'Property-level Marketing','addPropMkt','property')}${radio(unitMkt,'Unit-level Marketing','addPropMkt','unit')}</div>`)}
      ${sect('Fee Transparency', `
        ${radio(!isCopy,'Blank','addPropFee','blank')}
        ${hint('Start with no fees, and add charges after the property is created.')}
        ${radio(isCopy,'Copy From','addPropFee','copy')}
        ${copyBlock}`)}`;

    const placeholder = (t) => sect(t, `<span style="font-size:12px;font-style:italic;color:var(--rmx-text-muted, #b3b3b3)">No required ${t.toLowerCase()} found.</span>`);
    const body = a.nav === 'Property Information' ? propInfo : placeholder(a.nav);

    return `<div data-act="addPropClose" style="position:fixed;inset:0;background:rgba(19,49,76,0.5);display:flex;align-items:center;justify-content:center;z-index:120">
      <div data-act="noop" style="width:1180px;max-width:96vw;height:88vh;background:var(--rmx-bg-subtle, #f5f8fa);border-radius:4px;box-shadow:0 8px 28px rgba(0,0,0,0.3);display:flex;overflow:hidden">
        <div style="width:210px;flex:none;background:var(--rmx-brand-dark, #13314c);display:flex;flex-direction:column">
          <div style="display:flex;align-items:center;gap:8px;padding:14px 16px"><span style="font-size:16px;color:#fff;flex:1">Add Property</span><span data-act="toast" data-arg="Help" class="material-symbols-outlined" style="font-size:18px;color:#7fb2dd;cursor:pointer">help</span></div>
          <div style="display:flex;flex-direction:column">${nav.map(navItem).join('')}</div>
          <div style="flex:1"></div>
          <div style="display:flex;justify-content:center;padding:20px;opacity:0.22"><span class="material-symbols-outlined" style="font-size:74px;color:#fff">apartment</span></div>
        </div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column">
          <div style="flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px">${body}</div>
          <div style="display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid var(--rmx-line, #cedbe7);background:var(--rmx-bg-subtle, #f5f8fa);flex:none">
            <div style="flex:1"></div>
            ${a.err?`<span class="material-symbols-outlined" style="font-size:18px;color:var(--rmx-error, #eb343c)">error</span>`:''}
            <button data-act="addPropSave" class="btn-pri" style="height:32px;padding:0 14px;border-radius:4px;font-size:14px">Save and New</button>
            <button data-act="addPropSave" class="btn-pri" style="height:32px;padding:0 14px;border-radius:4px;font-size:14px">Save and Finish</button>
            <button data-act="addPropClose" class="btn-out" style="height:32px;padding:0 14px;border-radius:4px;font-size:14px;box-sizing:border-box">Cancel</button>
          </div>
        </div>
      </div></div>`;
  }

  // ================= MODAL / TOAST =================
  modalHTML(){
    const m = this.state.modal; if (!m) return '';
    // Bulk Update Charges hosts the same form in its own chrome, so the standalone overlay stands down.
    if (this.state.bulk) return '';
    const f = this.chargeForm(m);
    return `<div data-act="addclose" style="position:fixed;inset:0;background:rgba(19,49,76,0.5);display:flex;align-items:center;justify-content:center;z-index:${this.state.profHist?130:100}">
      <div data-act="noop" style="width:700px;max-width:94vw;max-height:92vh;background:#fff;border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;box-shadow:0 3px 12px rgba(0,0,0,0.2);display:flex;flex-direction:column;overflow:hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;height:48px;box-sizing:border-box;padding:8px 16px;border-bottom:1px solid var(--rmx-line, #cedbe7);flex:none">
          <span style="font-size:20px;line-height:28px;color:var(--rmx-brand-dark, #13314c)">${f.title}</span>
          <span data-act="addclose" class="material-symbols-outlined" style="font-size:24px;color:var(--ac,var(--rmx-brand, #008dd5));cursor:pointer">close</span>
        </div>
        <div style="flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px">${f.body}</div>
        <div style="display:flex;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid var(--rmx-line, #cedbe7);background:var(--rmx-bg-subtle, #f5f8fa);flex:none">
          <span id="m-err" style="display:none;align-items:center;gap:6px;color:var(--rmx-error, #eb343c);font-size:14px"><span class="material-symbols-outlined" style="font-size:16px">error</span><span id="m-err-txt"></span></span>
          <div style="flex:1"></div>
          <button data-act="addsave" class="btn-pri" style="height:36px;padding:8px 20px;font-size:14px;border-radius:4px">Save</button>
          <button data-act="addclose" class="btn-out" style="height:36px;padding:8px 20px;font-size:14px;border-radius:4px;box-sizing:border-box">Cancel</button>
        </div>
      </div></div>${this.catAddHTML()}${this.utConfHTML(!!(m && m.edit))}`;
  }
  // The charge form itself — General Details, the CRE sections and Marketing Details — shared by the
  // Charge Details overlay and by Bulk Update Charges, which frames it differently.
  chargeForm(m){
    const ed = m.edit || null;
    const isOne = /-one$/.test(m.group);
    // Property specific charges (NSF, late fees) pull every non-marketing field from the property,
    // so General Details renders locked and only the marketing details are editable.
    const spec = ed && ed.propSpecific ? ed.propSpecific : '';
    const cre = !!(m.cre || (ed && ed.cre));
    // The title names the kind of charge, and property specific charges name themselves too, so it's
    // clear which of the three overlays you're in without reading the fields.
    const kind = cre ? 'CRE Recurring' : (isOne ? 'One-Time' : 'Recurring');
    const specLabel = spec === 'NSF' ? 'NSF Fee' : spec === 'Late Charge' ? 'Late Fee' : spec;
    const title = ed ? `${kind} Charge Details${spec ? ' - ' + specLabel : ''}` : `Add ${kind} Charge`;
    const esc = s => (''+(s||'')).replace(/"/g,'&quot;');
    const lab = (t,info) => `<span style="display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--rmx-text, #666666)">${t}${info?`<span class="material-symbols-outlined" style="font-size:16px;color:var(--ac,var(--rmx-brand, #008dd5))">info</span>`:''}</span>`;
    const sect = (t,inner) => `<div style="display:flex;flex-direction:column;gap:10px"><span style="font-size:14px;font-weight:600;color:var(--rmx-brand-dark, #13314c)">${t}</span><div style="border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:12px">${inner}</div></div>`;
    const dd = (id,opts,sel,o) => this.singleSelect(id,opts,sel,o);
    const cat = this.chargeCategoryMap();
    const catFor = c => cat[(c||'').toUpperCase()] || '';

    // ---- Charge Application + its target field ----
    const app = ed ? (ed.level || 'Property') : 'Property';
    const appToggle = "if(window.__lvlChange)window.__lvlChange(_v)";
    const searchField = (id,val,ph) => `<div style="display:flex;align-items:center;gap:6px;background:var(--rmx-bg-subtle, #f5f8fa);border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;height:36px;box-sizing:border-box;padding:0 8px"><span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,var(--rmx-brand, #008dd5))">search</span><input id="${id}" value="${esc(val)}" placeholder="${ph}" style="flex:1;min-width:0;border:none;background:transparent;outline:none;font:400 14px Roboto,sans-serif;color:var(--rmx-brand-dark, #13314c)"></div>`;
    // lvl is the Charge Level this target belongs to — usually the same as its label, except ORI,
    // whose target is the property the rentable item comes from.
    const tgt = (key,label,lvl,id,val,ph,opts) => `<div id="m-appt-${key}-wrap" style="display:${app===lvl?'flex':'none'};flex-direction:column;gap:4px;flex:1;min-width:0">${lab(label+' *')}${opts ? dd(id, opts, val, { placeholder:'Select a '+label.toLowerCase(),
      // The ORI charge's property decides which charge types are on offer, so re-filter on change;
      // picking a unit type re-counts the units its warning covers.
      js: lvl === 'ORI' ? "if(window.__ctFilter)window.__ctFilter()"
        : lvl === 'Unit Type' ? "if(window.__utWarn)window.__utWarn()" : '' }) : searchField(id,val,ph)}</div>`;
    // An ORI charge only names the property here; the specific rentable item is chosen when the charge
    // is applied to a prospect. Legacy rows stored an item name, so anything that isn't a property
    // falls back to this one.
    // Editing an existing ORI charge keeps its property; a new ORI charge starts unselected so the
    // ORI Type stays disabled until a property is picked.
    const oriProp = (ed && ed.level === 'ORI') ? (this.propNames().indexOf(ed.target) >= 0 ? ed.target : this.state.property) : '';
    const oriTSel = (ed && ed.oriType) || '';
    const oriItemRow = (t) => `<div onclick="var h=document.getElementById('m-orit');h.value=this.textContent;var d=document.getElementById('m-orit-disp');d.textContent=this.textContent;d.style.fontStyle='normal';d.style.color='var(--rmx-brand-dark, #13314c)';document.getElementById('m-orit-pnl').style.display='none'" onmouseover="this.style.background='var(--rmx-brand-tint-bg, #ebf1f5)'" onmouseout="this.style.background='#fff'" style="padding:9px 14px;cursor:pointer;font-size:14px;color:var(--rmx-brand-dark, #13314c);background:#fff">${t}</div>`;
    window.__oriPropPick = (prop2) => {
      const btn = this.q('#m-orit-btn'), disp = this.q('#m-orit-disp'), lst = this.q('#m-orit-lst'), hid = this.q('#m-orit');
      if (!btn) return;
      btn.setAttribute('data-dis', '0'); btn.style.background = 'var(--rmx-bg-subtle, #f5f8fa)'; btn.style.borderColor = 'var(--rmx-line, #cedbe7)'; btn.style.cursor = 'pointer';
      btn.lastElementChild.style.color = 'var(--rmx-text, #666666)';
      if (hid) hid.value = '';
      if (disp) { disp.textContent = 'Select an ORI type'; disp.style.fontStyle = 'italic'; disp.style.color = 'var(--rmx-text-muted, #b3b3b3)'; }
      if (lst) lst.innerHTML = this.oriItemTypes(prop2).map(oriItemRow).join('');
    };
    const oriTypeCtl = `<div style="position:relative">
      <input type="hidden" id="m-orit" value="${esc(oriTSel)}">
      <div id="m-orit-btn" data-dis="${oriProp?'0':'1'}" onclick="if(this.getAttribute('data-dis')==='1')return;var p=document.getElementById('m-orit-pnl');if(p.style.display==='block'){p.style.display='none';return}var r=this.getBoundingClientRect();p.style.left=r.left+'px';p.style.width=r.width+'px';p.style.display='block';var ph=p.offsetHeight;var below=window.innerHeight-r.bottom;p.style.top=((below<ph+8&&r.top>below)?(r.top-ph-4):(r.bottom+4))+'px'" style="display:flex;align-items:center;justify-content:space-between;gap:4px;background:${oriProp?'var(--rmx-bg-subtle, #f5f8fa)':'var(--rmx-bg-muted, #f2f2f2)'};border:1px solid ${oriProp?'var(--rmx-line, #cedbe7)':'var(--rmx-line-soft, #ebf1f5)'};border-radius:4px;height:36px;box-sizing:border-box;padding:0 4px 0 12px;cursor:${oriProp?'pointer':'default'}">
        <span id="m-orit-disp" style="flex:1;min-width:0;font-size:14px;${oriTSel?'color:var(--rmx-brand-dark, #13314c)':'font-style:italic;color:var(--rmx-text-muted, #b3b3b3)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${oriTSel || (oriProp ? 'Select an ORI type' : 'Select a property first')}</span>
        <span class="material-symbols-outlined" style="font-size:20px;color:${oriProp?'var(--rmx-text, #666666)':'var(--rmx-line, #cedbe7)'}">arrow_drop_down</span>
      </div>
      <div id="m-orit-pnl" style="display:none;position:fixed;z-index:1000;border-radius:4px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,0.18);overflow:hidden"><div id="m-orit-lst" style="max-height:220px;overflow-y:auto">${oriProp ? this.oriItemTypes(oriProp).map(oriItemRow).join('') : ''}</div></div>
    </div>`;
    const chargeApp = `<div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;gap:12px;align-items:flex-start">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Charge Level *')}${dd('m-app',['Property','Unit Type','Unit'].concat(cre ? [] : ['ORI']),app,{noSearch:true,js:appToggle})}</div>
        ${tgt('ut','Unit Type','Unit Type','m-appt-ut', app==='Unit Type'?(ed&&ed.target||''):'', '2BR/2BA', this.utData().map(t=>t.name))}
        ${tgt('unit','Unit','Unit','m-appt-unit', app==='Unit'?(ed&&ed.target||''):'', '2C', this.units().map(u=>u.u))}
      </div>
      <div id="m-ut-warn" style="display:${app==='Unit Type'?'flex':'none'};gap:10px;align-items:flex-start;background:#fdf3e3;border:1px solid #f6d9ac;border-radius:4px;padding:10px 14px">
        <span class="material-symbols-outlined" style="font-size:18px;color:#e59f2e;flex:none">warning</span>
        <span id="m-ut-warn-txt" style="font-size:14px;color:var(--rmx-ink-2, #424e5b);line-height:1.5">${this.utWarnText(app === 'Unit Type' ? (ed && ed.target) || '' : '')}</span>
      </div>
      ${cre ? '' : `<div id="m-ori-row" style="display:${app==='ORI'?'flex':'none'};gap:12px;align-items:flex-start">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Property *')}${dd('m-appt-ori', this.propNames(), oriProp, { placeholder:'Select a property', js:"if(window.__oriPropPick)window.__oriPropPick(_v);if(window.__ctFilter)window.__ctFilter()" })}</div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('ORI Type *')}${oriTypeCtl}</div>
      </div>`}
    </div>`;

    // ---- Charge Type typeahead; selecting one derives the Charge Category below ----
    const setCat = "var cc=this.getAttribute('data-cat');var d=document.getElementById('m-cat-disp');var e=document.getElementById('m-cat-err');var ph=document.getElementById('m-cat-ph');document.getElementById('m-cat').value=cc||'';ph.style.display='none';if(cc){d.textContent=cc;d.style.display='block';e.style.display='none';}else{d.style.display='none';e.style.display='flex';}if(window.__attrCheck)window.__attrCheck();if(window.__mitsRecheck)window.__mitsRecheck();";
    // Storage / Parking categories reveal their optional attribute sections.
    window.__attrCheck = () => {
      const cc = ((this.q('#m-cat') || {}).value) || '';
      const sw = this.q('#m-stor-wrap'), pw = this.q('#m-park-wrap'), tw = this.q('#m-pet-wrap');
      if (sw) sw.style.display = (cc === 'Storage') ? 'flex' : 'none';
      if (pw) pw.style.display = (cc === 'Parking') ? 'flex' : 'none';
      if (tw) tw.style.display = (cc === 'Pet') ? 'flex' : 'none';
    };
    // Charge types that can sit on a rentable item — the only ones offered at the ORI level.
    const ctItems = this.chargeTypeList().map(([c,d2]) => `<div data-cat="${catFor(c)}" data-code="${c}" data-ct="${(c+' '+d2).toLowerCase()}" onmousedown="document.getElementById('m-ctype').value='${c}';document.getElementById('m-ctype-desc').value='${d2.replace(/'/g,"")}';${setCat}document.getElementById('m-ctype-panel').style.display='none'" style="padding:8px 12px;cursor:pointer" onmouseover="this.style.background='var(--rmx-brand-tint-bg, #ebf1f5)'" onmouseout="this.style.background=''"><div style="font-size:14px;color:var(--rmx-brand-dark, #13314c)">${c}</div><div style="font-size:14px;color:var(--rmx-text-muted, #b3b3b3)">${d2}</div></div>`).join('');
    // Every charge type is on offer, except on an ORI charge — there the list is what the selected
     // property actually rents out as items. The search box narrows whatever is left.
    window.__ctFilter = () => {
      const list = this.q('#m-ctype-list'); if (!list) return;
      const q = ((this.q('#m-ctype') || {}).value || '').toLowerCase();
      const onOri = ((this.q('#m-app') || {}).value) === 'ORI';
      const allowed = onOri ? this.oriTypesFor(((this.q('#m-appt-ori') || {}).value) || '') : null;
      list.querySelectorAll('[data-ct]').forEach(el => {
        const ok = el.getAttribute('data-ct').indexOf(q) >= 0
          && (!allowed || allowed.indexOf(el.getAttribute('data-code')) >= 0);
        el.style.display = ok ? 'block' : 'none';
      });
    };
    // Charge Level changes swap the target field, and ORI additionally narrows the charge types and
    // prices off market rent, since a rentable item's rate follows the property's market rate.
    // A unit-type charge lands on every unit of that type, so the warning follows the level (and names
    // the units once a type is picked).
    window.__utConfSave = () => {
      const ov = this.q('#m-utconf'); if (ov) ov.style.display = 'none';
      this._utOk = true;
      this.saveFee();
    };
    window.__utWarn = () => {
      const txt = this.q('#m-ut-warn-txt');
      if (txt) txt.innerHTML = this.utWarnText(((this.q('#m-appt-ut') || {}).value) || '');
    };
    window.__lvlChange = (v) => {
      ['ut','unit'].forEach(k => { const e = this.q('#m-appt-' + k + '-wrap'); if (e) e.style.display = 'none'; });
      const t = { 'Unit Type':'ut', 'Unit':'unit' }[v];
      if (t) { const w = this.q('#m-appt-' + t + '-wrap'); if (w) w.style.display = 'flex'; }
      const utw = this.q('#m-ut-warn');
      if (utw) utw.style.display = (v === 'Unit Type') ? 'flex' : 'none';
      if (v === 'Unit Type' && window.__utWarn) window.__utWarn();
      // Exceptions only exist at the property and unit type levels, and each level offers its own fields.
      const es = this.q('#m-excl-sect');
      if (es) es.style.display = (v === 'Property' || v === 'Unit Type') ? 'block' : 'none';
      const pr = this.q('#m-excl-prop-row');
      if (pr) pr.style.display = (v === 'Unit Type') ? 'flex' : 'none';
      const tw = this.q('#m-excl-types-wrap');
      if (tw) tw.style.display = (v === 'Property') ? 'flex' : 'none';
      const pe = this.q('#m-excl-prop');
      // Leaving the unit type level clears the property tick — it has no meaning anywhere else.
      if (pe && v !== 'Unit Type' && pe.value === '1') {
        pe.value = '0';
        const b = this.q('#m-excl-prop-box');
        if (b) { b.style.background = '#fff'; b.style.borderColor = 'var(--rmx-text-muted, #b3b3b3)';
          if (b.firstElementChild) b.firstElementChild.style.display = 'none'; }
      }
      const uw = this.q('#m-excl-units-wrap');
      if (uw) uw.style.display = (v === 'Unit Type' && pe && pe.value === '1') ? 'none' : 'flex';
      const nt = this.q('#m-excl-note');
      if (nt && (v === 'Property' || v === 'Unit Type') && !/^Exception/.test(nt.textContent)) nt.textContent = 'Applies everywhere at the ' + v.toLowerCase() + ' level';
      const oriRow = this.q('#m-ori-row');
      if (oriRow) oriRow.style.display = (v === 'ORI') ? 'flex' : 'none';
      if (v === 'ORI') {
        const m = this.q('#m-method'), md = this.q('#m-method-disp'), s = this.q('#m-source');
        if (m) m.value = 'Reference';
        if (s) s.value = 'Reference';
        if (md) { md.textContent = 'Reference'; md.style.color = 'var(--rmx-brand-dark, #13314c)'; md.style.fontStyle = 'normal'; }
        ['flat','ref','calc'].forEach(k => { const b = this.q('#m-blk-' + k); if (b) b.style.display = (k === 'ref' ? 'flex' : 'none'); });
        if (window.__calcNote) window.__calcNote();
      }
      window.__ctFilter();
    };
    const ctypeField = `<div style="position:relative">
      <div style="display:flex;align-items:center;gap:4px;background:var(--rmx-bg-subtle, #f5f8fa);border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;height:36px;box-sizing:border-box;padding:0 8px"><span class="material-symbols-outlined" style="font-size:20px;color:var(--ac,var(--rmx-brand, #008dd5))">search</span><input id="m-ctype" autocomplete="off" placeholder="Search charge types" value="${esc(ed?ed.mits:'')}" onfocus="document.getElementById('m-ctype-panel').style.display='block';if(window.__ctFilter)window.__ctFilter()" onblur="var p=document.getElementById('m-ctype-panel');setTimeout(function(){p.style.display='none'},200)" oninput="document.getElementById('m-ctype-panel').style.display='block';if(window.__ctFilter)window.__ctFilter()" style="flex:1;min-width:0;border:none;background:transparent;outline:none;font:400 14px Roboto,sans-serif;color:var(--rmx-brand-dark, #13314c)"></div>
      <input type="hidden" id="m-ctype-desc" value="${esc(ed?ed.name:'')}">
      <div id="m-ctype-panel" style="display:none;position:absolute;left:0;right:0;top:40px;z-index:20;background:#fff;border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;box-shadow:0 3px 6px rgba(0,0,0,0.15);max-height:220px;overflow-y:auto"><div id="m-ctype-list">${ctItems}</div></div>
    </div>`;

    // ---- Amount method ----
    const src = ed ? (ed.amtMethod || 'Flat') : 'Flat';
    const amtFlat = ed && /^\$/.test(ed.amount||'') ? (ed.amount||'').replace(/^\$/,'') : '';
    const radio = (label,value,blk) => `<label style="display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--rmx-text, #666666);cursor:pointer"><input type="radio" name="m-amt-r" value="${value}" data-blk="${blk}" ${src===value?'checked':''} onchange="var b=this.getAttribute('data-blk');document.getElementById('m-source').value=this.value;['flat','ref','calc'].forEach(function(k){document.getElementById('m-blk-'+k).style.display=(k===b?'flex':'none')});if(window.__calcNote)window.__calcNote()" style="accent-color:var(--ac,var(--rmx-brand, #008dd5));width:16px;height:16px;margin:0">${label}</label>`;
    const iconInput = (id,val,ph,icon) => `<div style="display:flex;align-items:center;gap:4px;background:var(--rmx-bg-subtle, #f5f8fa);border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;height:36px;box-sizing:border-box;padding:0 8px"><input id="${id}" value="${esc(val)}" placeholder="${ph}" oninput="if(window.__mitsRecheck)window.__mitsRecheck()" style="flex:1;min-width:0;border:none;background:transparent;outline:none;font:400 14px Roboto,sans-serif;color:var(--rmx-brand-dark, #13314c)"><span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,var(--rmx-brand, #008dd5))">${icon}</span></div>`;
    // A calculated amount has no single figure to publish, so listing providers show it as a varying
    // amount. Only worth saying once the charge is actually going out to listings.
    const calcNote = (src === 'Calculation' && ed && ed.ils) ? 'block' : 'none';
    window.__calcNote = () => {
      const n = this.q('#m-calc-note'); if (!n) return;
      const method = (this.q('#m-source') || {}).value;
      const on = ((this.q('#m-ils') || {}).value) === '1';
      n.style.display = (method === 'Calculation' && on) ? 'block' : 'none';
    };
    const methodJs = "var t={'Flat':'flat','Reference':'ref','Calculation':'calc'}[_v];document.getElementById('m-source').value=_v;['flat','ref','calc'].forEach(function(k){document.getElementById('m-blk-'+k).style.display=(k===t?'flex':'none')});if(window.__calcNote)window.__calcNote()";
    const amount = `<div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;gap:12px;align-items:flex-start">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Amount Method')}${dd('m-method',['Flat','Reference','Calculation'],src,{noSearch:true,js:methodJs})}</div>
      <div style="flex:1;min-width:0">
        <input type="hidden" id="m-source" value="${src}">
        <div id="m-blk-flat" style="display:${src==='Flat'?'flex':'none'};flex-direction:column;gap:4px">${lab('Amount')}${iconInput('m-amount',amtFlat,'00.00','calculate')}</div>
        <div id="m-blk-ref" style="display:${src==='Reference'?'flex':'none'};flex-direction:column;gap:4px">${lab('Amount')}${dd('m-ref',['Market Rent','Field: Market Rent','Unit UDF: Parking Spot #'],'Market Rent',{noSearch:true})}</div>
        <div id="m-blk-calc" style="display:${src==='Calculation'?'flex':'none'};flex-direction:column;gap:4px">${lab('Amount')}${iconInput('m-calc','','','edit')}</div>
      </div></div>
      <span id="m-calc-note" style="display:${calcNote};font-size:12px;color:var(--rmx-text, #666666);line-height:1.45">Calculated charges may be labeled as a <i>Varying Amount</i> on the listing provider site.</span></div>`;

    // ---- General Details ----
    // One-time charges have a date window too — they just don't repeat, so only Frequency is
    // recurring-only.
    const freqRow = `<div style="display:flex;gap:12px;align-items:flex-start">
      ${isOne ? '' : `<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Frequency *')}<input id="m-freq" class="fld" value="1" style="height:36px;box-sizing:border-box"></div>`}
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('From')}${iconInput('m-from',ed?ed.from:'','mm/dd/yy','calendar_month')}</div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('To')}${iconInput('m-to',ed?ed.to:'','mm/dd/yy','calendar_month')}</div>
    </div>`;
    const ilsOn = ed ? !!ed.ils : true;
    // Locked General Details for property specific charges: application, type and amount only.

        <div style="display:flex;align-items:center;gap:14px;background:#e8f4fb;padding:10px 20px;flex:none">
          <span style="font-size:14px;color:var(--rmx-brand-dark, #13314c)">Include/Exclude</span>
          <div style="display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;height:32px;padding:0 8px 0 12px;font-size:14px;color:var(--rmx-brand-dark, #13314c);cursor:default">Use System Preferences<span class="material-symbols-outlined" style="font-size:18px;color:var(--rmx-text, #666666)">keyboard_arrow_down</span></div>
          <div style="flex:1"></div>
          <span style="font-size:14px;color:var(--rmx-brand-dark, #13314c)">Feed Type: Single Family</span>
        </div>
        <div style="flex:1;min-height:0;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px">
          <div style="display:flex;align-items:center;gap:22px;background:#fff;border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;padding:14px 20px;flex-wrap:wrap">
            <span style="font-size:16px;font-weight:600;color:var(--rmx-brand-dark, #13314c)">${P.name}</span>
            <span style="font-size:14px;color:var(--rmx-brand-dark, #13314c)">Owner: ${P.manager}</span>
            <span style="display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--rmx-brand-dark, #13314c)"><span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,var(--rmx-brand, #008dd5))">mail</span>${P.email}</span>
            <span style="display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--rmx-brand-dark, #13314c)"><span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,var(--rmx-brand, #008dd5))">call</span><span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,var(--rmx-brand, #008dd5))">sms</span>513-838-7264</span>
            <div style="flex:1"></div>
            <span style="font-size:14px;color:var(--rmx-brand-dark, #13314c)">Occupied Units: <strong>${P.occupied != null ? P.occupied : 30}</strong></span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));gap:16px;align-items:stretch">
            ${contact1}${contact2}${listing}
            ${features}${floor}
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;background:#fff;border-top:1px solid var(--rmx-line, #cedbe7);padding:12px 20px;flex:none">
          <button data-act="mktAdvOpen" style="height:34px;min-height:34px;padding:0 20px;border-radius:4px;font:400 14px Roboto,sans-serif;background:#fff;border:1px solid var(--ac,var(--rmx-brand, #008dd5));color:var(--ac,var(--rmx-brand, #008dd5));cursor:pointer">Advanced</button>
          <button data-act="mktSave" class="btn-pri" style="height:34px;min-height:34px;padding:0 24px;border-radius:4px;font-size:14px">Save</button>
          <button data-act="mktClose" style="height:34px;min-height:34px;padding:0 18px;border-radius:4px;font:400 14px Roboto,sans-serif;background:#fff;border:1px solid var(--ac,var(--rmx-brand, #008dd5));color:var(--ac,var(--rmx-brand, #008dd5));cursor:pointer">Cancel</button>
        </div>
      </div>
    </div>`;
  }
  // ---------- Advanced Settings overlay (on top of Marketing Setup) ----------
  mktAdvHTML(){
    if (!this.state.mktAdv) return '';
    const lab = (t) => `<span style="font-size:14px;color:var(--rmx-ink-2, #424e5b)">${t}</span>`;
    const dd = (v) => `<div style="display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--rmx-bg-subtle, #f5f8fa);border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;height:38px;box-sizing:border-box;padding:0 8px 0 12px;cursor:default"><span style="font-size:14px;${v?'color:var(--rmx-brand-dark, #13314c)':''};overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${v||''}</span><span class="material-symbols-outlined" style="font-size:20px;color:var(--rmx-text, #666666)">keyboard_arrow_down</span></div>`;
    const ddPh = () => `<div style="display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--rmx-bg-subtle, #f5f8fa);border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;height:38px;box-sizing:border-box;padding:0 8px 0 12px;cursor:default"><span style="font-size:14px;font-style:italic;color:var(--rmx-text-muted, #b3b3b3);overflow:hidden;white-space:nowrap">Type or select an entry</span><span class="material-symbols-outlined" style="font-size:20px;color:var(--rmx-text, #666666)">keyboard_arrow_down</span></div>`;
    const field = (l, ctrl, span) => `<div style="${span?'grid-column:span 2;':''}display:flex;flex-direction:column;gap:6px">${lab(l)}${ctrl}</div>`;
    const heading = (t) => `<div style="grid-column:span 2;font-size:14px;font-weight:600;color:var(--rmx-brand-dark, #13314c);padding:6px 0 8px;border-bottom:1px solid var(--rmx-line, #cedbe7)">${t}</div>`;
    const cardHead = (t) => `<div style="padding:11px 16px;border-bottom:1px solid var(--rmx-line, #cedbe7);font-size:14px;font-weight:600;color:var(--rmx-brand-dark, #13314c)">${t}</div>`;
    // Fee Transparency's publish state surfaces here too: publish from Advanced Settings when the
    // property is set up, or confirm complete pricing is already live.
    const prop2 = this.state.property;
    const ftOn = this.profStatus(prop2) === 'active';
    const ftPublished = !!this.state.publishedProps[prop2];
    const ftNote = !ftOn ? '' : ftPublished
      ? `<span style="display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--rmx-brand-dark, #13314c);padding-top:2px"><span class="material-symbols-outlined" style="font-size:18px;color:var(--rmx-success, #6eb744);font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24">verified</span>This property is using Fee Transparency and is displaying complete pricing on its listings.</span>`
      : (this.ilsOn(prop2) ? (() => { const need = this.ftStatus(prop2).issues || 0;
          // Publishing waits until every charge has the fields listings require.
          return need
            ? `<div style="display:flex;align-items:flex-start;gap:10px;background:#fef4e8;border:1px solid #f6d9ac;border-radius:4px;padding:11px 14px">
                <span class="material-symbols-outlined" style="font-size:18px;color:var(--rmx-attention, #f58220);flex:none;margin-top:1px">error</span>
                <span style="flex:1;min-width:0;font-size:14px;color:var(--rmx-brand-dark, #13314c);line-height:1.5">Complete pricing can publish once every charge has its required fields — ${need} still need${need===1?'s':''} details.</span>
                <a data-act="openFeeProfile" data-arg="${prop2}" style="flex:none;font-size:14px;color:var(--ac,var(--rmx-brand, #008dd5));cursor:pointer;white-space:nowrap">Add Charge Details</a>
              </div>`
            : `<div style="display:flex;align-items:center;gap:18px">
                <button data-act="pubOpen" data-arg="${prop2}" class="btn-pri" style="height:36px;min-height:36px;padding:0 18px;border-radius:4px;font-size:14px;white-space:nowrap">Publish Complete Pricing</button>
                <a data-act="announceOpen" style="font-size:14px;color:var(--ac,var(--rmx-brand, #008dd5));cursor:pointer;white-space:nowrap">Learn More</a>
              </div>`; })() : '');
    const prefs = `<div style="border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;background:#fff">
      ${cardHead('Preferences')}
      <div style="padding:14px 20px 20px;display:grid;grid-template-columns:1fr 1fr;gap:16px 28px">
        ${heading('Feed Information')}
        ${field('Feed Type', dd('Single Family'))}
        ${field('Property Type', dd('Field: Property Type (Commercial)'))}
        ${field('Rental Type', dd(''))}
        ${field('Marketing Name', ddPh())}
        ${field('Listing URL', ddPh())}
        ${field('Virtual Tour URL', ddPh())}
        ${field('Latitude', ddPh())}
        ${field('Longitude', ddPh())}
        ${field('Rental Classification', dd('House for Rent'), true)}
        ${heading('Agent Information')}
        ${field('First Name', ddPh())}
        ${field('Last Name', ddPh())}
        ${field('Email Address', ddPh())}
        ${field('Phone Number', ddPh())}
      </div>
    </div>`;
    const provider = `<div style="border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;background:#fff">
      ${cardHead('Provider Settings')}
      <div style="padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px">
        ${ftNote}
        ${ftNote ? '<div style="height:1px;background:var(--rmx-line, #cedbe7);margin:4px 0"></div>' : ''}
        <label style="display:inline-flex;align-items:center;gap:10px;cursor:pointer"><input type="checkbox" style="accent-color:var(--ac,var(--rmx-brand, #008dd5));width:16px;height:16px;margin:0"><span style="font-size:14px;color:var(--rmx-ink-2, #424e5b)">Override System Preferences</span></label>
        <label style="display:inline-flex;align-items:center;gap:10px;padding-left:28px;cursor:default"><input type="checkbox" disabled style="width:16px;height:16px;margin:0"><span style="font-size:14px;color:var(--rmx-text-muted, #b3b3b3)">Enable Online Listings</span></label>
        <span style="font-size:14px;color:var(--rmx-error, #eb343c);padding-left:28px">ILS Providers may require a paid account before your listings can be posted.</span>
        <div style="height:38px;background:#fff;border:1px solid var(--rmx-line, #cedbe7);border-radius:4px;margin-left:28px"></div>
      </div>
    </div>`;
    return `<div style="position:fixed;inset:0;background:rgba(19,49,76,0.45);display:flex;align-items:center;justify-content:center;z-index:148">
      <div data-act="noop" style="width:min(1300px, 90vw);max-height:88vh;background:var(--rmx-bg-subtle, #f5f8fa);border-radius:4px;box-shadow:0 8px 28px rgba(0,0,0,0.35);display:flex;flex-direction:column;overflow:hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;background:#fff;padding:13px 20px;border-bottom:1px solid var(--rmx-line, #cedbe7);flex:none">
          <span style="font-size:20px;font-weight:600;color:var(--rmx-brand-dark, #13314c)">Advanced Settings</span>
          <span style="display:inline-flex;align-items:center;gap:12px"><span data-act="toast" data-arg="Help" class="material-symbols-outlined" style="font-size:20px;color:var(--ac,var(--rmx-brand, #008dd5));cursor:pointer">help</span><span data-act="mktAdvClose" class="material-symbols-outlined" style="font-size:20px;color:var(--ac,var(--rmx-brand, #008dd5));cursor:pointer">close</span></span>
        </div>
        <div style="flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px">
          ${prefs}
          ${provider}
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;background:#fff;border-top:1px solid var(--rmx-line, #cedbe7);padding:12px 20px;flex:none">
          <button data-act="mktAdvSave" class="btn-pri" style="height:34px;min-height:34px;padding:0 24px;border-radius:4px;font-size:14px">Save</button>
          <button data-act="mktAdvClose" style="height:34px;min-height:34px;padding:0 18px;border-radius:4px;font:400 14px Roboto,sans-serif;background:#fff;border:1px solid var(--ac,var(--rmx-brand, #008dd5));color:var(--ac,var(--rmx-brand, #008dd5));cursor:pointer">Cancel</button>
        </div>
      </div>
    </div>`;
  }
  toastHTML(){ return this.state.toast ? `<div class="toast"><span class="material-symbols-outlined" style="font-size:18px">check_circle</span>${this.state.toast}</div>` : ''; }

  // ================= SCREENS =================
  screenHTML(){
    this._tid = 0;
    const s = this.state;
    let out = this.header();
    if (s.view === 'property') {
      // Full-width blue bar first; the action rail starts right under it and runs to the bottom.
      out += this.ctx('Property', [{ label: s.property }], '125 of 255', 'navRegister');
      let inner = this.propScoreboard();
      inner += this.tabRow(['General','Leasing','Documents','Charges'], s.propTab, 'proptab', { badge: { 'Charges':'New' } });
      if (s.propTab === 'Charges') {
        inner += `<div style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden">${this.feeProfileTab()}</div>`;
      } else {
        inner += `<div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column"><div style="flex:1;min-width:0;padding:16px;display:flex;flex-direction:column;gap:16px;width:100%;box-sizing:border-box">${this.propGeneralBody()}</div></div>`;
        inner += this.footer('Save property');
      }
      out += `<div style="flex:1;min-height:0;display:flex;align-items:stretch;overflow:hidden"><div style="flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden">${inner}</div>${this.rail()}</div>`;
    } else if (s.view === 'sysprefs') {
      out += `<div style="height:44px;background:var(--ac,var(--rmx-brand, #008dd5));display:flex;align-items:center;padding:0 16px;gap:14px;color:#fff;flex:none">
        <span data-act="navRegister" class="material-symbols-outlined" style="font-size:20px;cursor:pointer">keyboard_double_arrow_left</span>
        <span style="font-size:18px;line-height:24px">System Preferences:&nbsp; <span>General Options - ${s.spNav}</span></span>
        <div style="flex:1"></div>
        <span class="material-symbols-outlined" style="font-size:20px;opacity:0.9;cursor:pointer">help</span>
      </div>`;
      out += this.sysPrefsBody();
    } else if (s.view === 'pettypes') {
      out += `<div style="height:40px;background:var(--ac,var(--rmx-brand, #008dd5));display:flex;align-items:center;padding:0 16px;gap:12px;color:#fff;flex:none">
        <span style="font-size:18px;line-height:24px">Pet Types</span>
        <div style="flex:1"></div>
        <span data-act="toast" data-arg="Refresh" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">autorenew</span>
        <span class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">help</span>
      </div>`;
      out += `<div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column">${this.petTypesBody()}</div>`;
    } else if (s.view === 'listings') {
      out += `<div style="height:40px;background:var(--ac,var(--rmx-brand, #008dd5));display:flex;align-items:center;padding:0 16px;gap:12px;color:#fff;flex:none">
        <span style="font-size:18px;line-height:24px">Listings</span>
        <div style="flex:1"></div>
        <span data-act="navFeeTrans" style="display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;opacity:0.95;margin-right:4px">Fee Transparency<span class="material-symbols-outlined" style="font-size:18px">arrow_right_alt</span></span>
        <span data-act="toast" data-arg="Print" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">print</span>
        <span data-act="toast" data-arg="Refresh" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">autorenew</span>
        <span class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">help</span>
      </div>`;
      out += `<div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column">${this.listingsBody()}</div>`;
    } else if (s.view === 'feetrans') {
      out += `<div style="height:40px;background:var(--ac,var(--rmx-brand, #008dd5));display:flex;align-items:center;padding:0 16px;gap:12px;color:#fff;flex:none">
        <span style="font-size:18px;line-height:24px">Fee Transparency</span>
        <div style="flex:1"></div>
        <span data-act="navListings" style="display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;opacity:0.95;margin-right:4px">Listings<span class="material-symbols-outlined" style="font-size:18px">arrow_right_alt</span></span>
        <span data-act="toast" data-arg="Print" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">print</span>
        <span data-act="toast" data-arg="Refresh" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">autorenew</span>
        <span class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">help</span>
      </div>`;
      out += `<div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column">${this.feeTransBody()}</div>`;
    } else if (s.view === 'register') {
      out += `<div style="height:40px;background:var(--ac,var(--rmx-brand, #008dd5));display:flex;align-items:center;padding:0 16px;gap:12px;color:#fff;flex:none">
        <span style="font-size:18px;line-height:24px">Properties</span>
        <div style="flex:1"></div>
        <span data-act="toast" data-arg="Print" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">print</span>
        <span data-act="toast" data-arg="Refresh" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">autorenew</span>
        <span class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">help</span>
      </div>`;
      out += `<div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column">${this.registerBody()}</div>`;
    } else {
      out += this.ctx('Unit', [{ label: s.property, act:'navProperty', arg: s.property }, { label:'Unit ' + s.unit }], '125 of 255');
      out += this.unitBody();
      out += this.footer('Save unit');
    }
    out += this.modalHTML();
    out += this.rowMenuHTML();
    out += this.chargeExclHTML();
    out += this.recViewHTML();
    out += this.setupHTML();
    out += this.setupExitHTML();
    out += this.utDelHTML();
    out += this.ltErrHTML();
    out += this.colSetupHTML();
    out += this.addPropHTML();
    out += this.pfFilterHTML();
    out += this.pubModalHTML();
    out += this.ftSelHTML();
    out += this.mktSetupHTML();
    out += this.mktAdvHTML();
    out += this.petTypeHTML();
    out += this.pricePreviewHTML();
    out += this.profMenuHTML();
    out += this.profHistHTML();
    out += this.kickoffHTML();
    out += this.announceHTML();
    out += this.bulkUpdHTML();
    out += this.copyFeesHTML();
    out += this.toastHTML();
    return out;
  }
  renderVals(){
    return {
      rootRef: this.setRoot,
      onClick: this.onClick,
      screen: React.createElement('div', { style: { display:'flex', flexDirection:'column', flex:1, minHeight:0 }, dangerouslySetInnerHTML: { __html: this.screenHTML() } })
    };
  }
}
</script>
</body>
</html>

      </div></div>`;
  }
  // Unit types present at this property, derived from its units.
  utData(){ const seen=[]; this.units().forEach(u=>{ if(!seen.some(t=>t.name===u.type)) seen.push({name:u.type,units:0,occ:0}); }); this.units().forEach(u=>{ const t=seen.find(x=>x.name===u.type); t.units++; if(u.tenant&&!/vacant/i.test(u.tenant)) t.occ++; }); return seen; }
  // Selected-scope header row (mirrors the property scoreboard) used by the Unit Type Fees and Unit Fees tabs.
  ufUnits(){ const p=this.state.property; return this.units().map(u=>Object.assign({}, u, { prop:p })); }
  recChargesTile(scope){
    return `<div class="tile">
      <div class="thead2" style="border-bottom-color:var(--ac,#008dd5)"><span class="ttl">Recurring Charges</span><div style="flex:1"></div><a data-act="openFeeProfile" style="font-size:14px;color:var(--ac,#008dd5)">Open Rental Fee Profile</a><span data-act="recViewOpen" data-arg="${scope}" class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5);cursor:pointer" title="View recurring charges">open_in_new</span></div>

    </div>`;

  // Shared Recurring Charges table.
  // opts.scope 'property' (default) shows property-level charges only; 'unit' also shows
  // unit-type and unit charges (they trickle down), including an override example.
  recChargesTableHTML(opts){
    opts=opts||{};
    const unit = opts.scope==='unit';
    const two = !!opts.twoComment;
    const rec = this.propertyCharges()
      .filter(f=>!f.excluded && !/-one$/.test(f.group))
      .filter(f=>unit || f.level==='Property');
    const lvlMap={ 'Property':{c:'#1570ef',l:'Property'}, 'Unit type':{c:'#d92d20',l:'Unit Type'}, 'Unit Type':{c:'#d92d20',l:'Unit Type'}, 'Unit':{c:'#099250',l:'Unit'}, 'ORI':{c:'#6a4aa8',l:'ORI'}, 'Tenant':{c:'#98a2b3',l:'Tenant'} };
    const recCols = two ? '32px 94px minmax(100px,1fr) minmax(120px,1fr) minmax(120px,1fr) 80px 92px 92px 110px' : '32px 94px minmax(110px,1fr) minmax(150px,1fr) 84px 96px 96px 124px';
    const rh=(t,align)=>`<span style="display:flex;align-items:center;height:32px;box-sizing:border-box;padding:0 8px;font-size:12px;font-weight:500;letter-spacing:0.5px;color:#13314c;background:#fff;border-bottom:1px solid #cedbe7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${align==='right'?'justify-content:flex-end;text-align:right':''}">${t}</span>`;
    const heads = two ? [['',''],['',''],['Charge Type',''],['Comment',''],['Comment',''],['Frequency','right'],['From Date',''],['To Date',''],['Amount','right']] : [['',''],['',''],['Charge Type',''],['Comment',''],['Frequency','right'],['From Date',''],['To Date',''],['Amount','right']];
    const recHead=`<div style="display:grid;grid-template-columns:${recCols}">${heads.map(h=>rh(h[0],h[1])).join('')}</div>`;
    const cell=(t,align,color)=>`<span style="display:flex;align-items:center;height:36px;box-sizing:border-box;padding:0 8px;font-size:14px;color:${color||'#13314c'};border-bottom:1px solid #ebf1f5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${align==='right'?'justify-content:flex-end;text-align:right':''}">${t}</span>`;
    const barFor=(c)=>`<span style="display:flex;justify-content:center;height:36px;box-sizing:border-box;border-bottom:1px solid #ebf1f5"><span style="width:10px;background:${c}"></span></span>`;
    const row=(idx,bar,level,code,comment,amount,commentColor,comment2)=>{
      const rowBg = (idx%2===1) ? '#f5f8fa' : '#fff';
      const mid = two ? `${cell(comment,'',commentColor||'#666')}${cell(comment2||'','',commentColor||'#666')}` : cell(comment,'',commentColor||'#666');
      return `<div style="display:grid;grid-template-columns:${recCols};background:${rowBg}">${barFor(bar)}${cell(level)}${cell(code)}${mid}${cell('Monthly','right')}${cell('01/01/2026')}${cell('—','','#b3b3b3')}${cell(amount,'right')}</div>`;
    };
    let idx=0;
    // Property-level charges (shown everywhere).
    let recRows=rec.map((f)=>{ const lv=lvlMap[f.level]||lvlMap['Property']; return row(idx++, lv.c, lv.l, f.mits, f.desc, f.amount); }).join('');
    if(unit){
      // Unit type charge trickles down.
      recRows += row(idx++, lvlMap['Unit type'].c, 'Unit Type', 'UTILITY', 'Additional trash valet', '$4.00');
      // Unit-level override example.
      const cmt=`Trash service<span style="margin-left:8px;background:#fdeedd;color:#b35a00;border-radius:4px;padding:1px 8px;font-size:12px">Override</span>`;
      const amt=`<s style="color:#8a9aa8;font-size:12px">$28.00</s> <span style="color:#8a9aa8">→</span> <span style="font-weight:600;color:#b35a00">$32.00</span>`;
      recRows += row(idx++, lvlMap['Unit'].c, 'Unit', 'UTILITY', cmt, amt);
    }
    if(opts.exclusion){
      const excLv = unit ? lvlMap['Unit'] : lvlMap['Property'];
      const excPill=`<span style="margin-left:8px;background:#eef1f4;color:#8a9aa8;border-radius:4px;padding:1px 8px;font-size:12px">Excluded</span>`;
      recRows += row(idx++, excLv.c, excLv.l, '<s style="color:#8a9aa8">PARKING</s>', `<s style="color:#8a9aa8">Covered parking</s>${excPill}`, '<s style="color:#8a9aa8">$75.00</s>', '#8a9aa8');
    }
    return `<div style="border:1px solid #cedbe7;border-radius:4px;overflow:hidden"><div style="overflow-x:auto">${recHead}${recRows}</div></div>`;
  }
  // "View Recurring Charges" modal opened from the property tile's pop-out icon (Figma 2385-32329).

      <div style="display:flex;align-items:center;justify-content:space-between;height:52px;box-sizing:border-box;padding:8px 20px;border-bottom:1px solid #cedbe7;flex:none"><span style="font-size:16px;font-weight:600;color:#666">View Recurring Charges</span><span style="display:inline-flex;align-items:center;gap:16px"><button data-act="toast" data-arg="Print" class="btn-pri" style="padding:8px 16px;font-size:14px;display:inline-flex;align-items:center;gap:6px"><span class="material-symbols-outlined" style="font-size:18px">print</span>Print</button><span data-act="recViewClose" class="material-symbols-outlined" style="font-size:22px;color:var(--ac,#008dd5);cursor:pointer">close</span></span></div>

        <div style="display:flex;align-items:center;gap:16px"><div style="flex:1"></div><div style="display:flex;align-items:center;gap:20px">${cbox('Past')}${cbox('Future')}</div></div>
        ${this.recChargesTableHTML({scope:(this.state.recView==='unit'?'unit':'property'), twoComment:true})}

    </div></div>`;

    const misc = `<div class="card">${cardHead('Miscellaneous','',true)}<div style="padding:16px;display:flex;flex-direction:column;gap:14px"><div style="display:flex;gap:14px"><div style="flex:1;display:flex;flex-direction:column;gap:4px"><span class="flabel">Bedrooms</span><input class="fld" value="${info.type[0]==='S'?'0':info.type[0]}"></div><div style="flex:1;display:flex;flex-direction:column;gap:4px"><span class="flabel">Bathrooms</span><input class="fld" value="1"></div></div><div style="display:flex;gap:14px"><div style="flex:1;display:flex;flex-direction:column;gap:4px"><span class="flabel">Max Occupancy</span><input class="fld" value="2"></div><div style="flex:1;display:flex;flex-direction:column;gap:4px"><span class="flabel">Square Footage</span><input class="fld" value="${info.sqft}"></div></div><div style="display:flex;flex-direction:column;gap:4px"><span class="flabel">Inspection Template</span><div class="fld" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer">&nbsp;<span class="material-symbols-outlined" style="font-size:20px;color:#666">arrow_drop_down</span></div></div></div></div>`;
    const occupied = info.tenant && !/vacant/i.test(info.tenant);
    const field=(l,v)=>`<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#666">${l}</span><span style="font-size:14px;color:#13314c;font-weight:500">${v||'—'}</span></div>`;
    const initials=(info.tenant||'').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
    // Tenant-oriented tiles (blended into the unit page).
    const leases = `<div class="card">${cardHead('Leases',occupied?'Renew':'',true)}<div style="padding:16px;display:flex;flex-direction:column;gap:14px">${occupied?`
      ${field('Property',this.state.property)}
      <div style="display:flex;gap:14px"><div style="flex:1">${field('Lease Start','01/01/2025')}</div><div style="flex:1">${field('Lease End','12/31/2025')}</div></div>
      <div style="display:flex;gap:14px"><div style="flex:1">${field('Move In','01/01/2025')}</div><div style="flex:1">${field('Lease Terms','12 Months')}</div></div>`:`<span style="font-size:13px;font-style:italic;color:#b3b3b3">No active lease for this unit.</span>`}</div></div>`;
    const contacts = `<div class="card">${cardHead('Contacts','Add Contact',true)}<div style="padding:16px;display:flex;flex-direction:column;gap:14px">${occupied?`
      <div style="display:flex;align-items:center;gap:12px"><span style="width:36px;height:36px;border-radius:50%;background:#e5f3fb;color:#0071aa;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:none">${initials}</span><div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600;color:#13314c">${info.tenant} <span style="font-size:12px;color:#8a9aa8;font-weight:400">(Primary)</span></span><span style="font-size:13px;color:#666">${(info.tenant||'').toLowerCase().replace(/[^a-z]/g,'.')}@email.com</span><span style="font-size:13px;color:#666">(555) 555-5555</span></div></div>`:`<span style="font-size:13px;font-style:italic;color:#b3b3b3">No contacts.</span>`}</div></div>`;
    const txnRows = occupied ? [['07/17/26','Late Fees','50.00','1,470.00'],['07/01/26','Rent','1,350.00','1,420.00'],['07/01/26','Water & sewer','38.00','70.00'],['07/01/26','Trash','32.00','32.00']] : [];
    const txnCols='104px 1fr 100px 104px';
    const transactions = `<div class="card" style="grid-column:span 3">${cardHead('Transactions','Add Charge',true)}<div style="display:grid;grid-template-columns:${txnCols};background:#f5f8fa;border-bottom:1px solid #cedbe7">${['Date','Description','Amount','Balance'].map((x,i)=>`<span style="padding:8px 12px${i===0?' 8px 16px':''};font-size:12px;font-weight:500;color:#666;${i>=2?'text-align:right':''}">${x}</span>`).join('')}</div>${txnRows.length?txnRows.map(r=>`<div style="display:grid;grid-template-columns:${txnCols};align-items:center;border-bottom:1px solid #ebf1f5"><span class="td" style="border:none;padding-left:16px">${r[0]}</span><span class="td" style="border:none">${r[1]}</span><span class="td num" style="border:none;text-align:right">${r[2]}</span><span class="td num" style="border:none;text-align:right;padding-right:16px">${r[3]}</span></div>`).join(''):`<div style="padding:16px;text-align:center;font-size:13px;font-style:italic;color:#b3b3b3">No transactions.</div>`}</div>`;
    const serviceIssues = `<div class="card">${cardHead('Service Issues','Add Issue',true)}<div style="padding:28px 16px;text-align:center;font-size:13px;font-style:italic;color:#b3b3b3">No open service issues.</div></div>`;
    const histRows = occupied ? [['07/17','System','Late fee posted — balance updated'],['03/12','Web Acc.','Flexible Rent status: Eligible'],['11/20','Survey','Survey sent to '+info.tenant]] : [];
    const historyNotes = `<div class="card">${cardHead('History / Notes','Add Note',true)}${histRows.length?`<div style="padding:8px 0">${histRows.map(r=>`<div style="display:flex;gap:12px;padding:8px 16px;border-bottom:1px solid #ebf1f5"><span style="font-size:12px;color:#8a9aa8;width:44px;flex:none">${r[0]}</span><span style="font-size:12px;color:#0071aa;width:64px;flex:none">${r[1]}</span><span style="font-size:13px;color:#13314c">${r[2]}</span></div>`).join('')}</div>`:emptyGrid(['Date','Type','Note'])}</div>`;
    const pets = `<div class="card">${cardHead('Pets','Add Pet',true)}<div style="padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:12px"><span style="font-size:13px;color:#8a9aa8">No pets recorded.</span><button data-act="toast" data-arg="Add pet" class="btn-pri" style="padding:8px 18px;font-size:14px">Add Pet</button></div></div>`;
    const udfs = `<div class="card">${cardHead('User Defined Fields','',true)}<div style="display:grid;grid-template-columns:1fr 1fr;background:#f5f8fa;border-bottom:1px solid #cedbe7"><span style="padding:8px 16px;font-size:12px;font-weight:500;color:#666">Name</span><span style="padding:8px 16px;font-size:12px;font-weight:500;color:#666">Value</span></div><div style="display:grid;grid-template-columns:1fr 1fr"><span class="td" style="border:none;padding-left:16px">Vendor Confirmation</span><span class="td" style="border:none">Yes</span></div></div>`;
    const cards = [ leases, contacts, historyNotes, transactions, serviceIssues, udfs, pets, general, addresses, misc ];
    h += `<div style="padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start">${cards.join('')}</div>`;
    return `<div style="flex:1;min-height:0;display:flex;align-items:stretch;overflow:hidden"><div style="flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column"><div style="flex:1;min-width:0;display:flex;flex-direction:column">${h}</div></div>${this.rail()}</div>`;
  }

  // Filters dropdown anchored to the profile toolbar's tune button (Figma 2496-54203).
  pfFilterHTML(){
    const p = this.state.pfFilter; if (!p) return '';
    const f = this.state.pfFilters || {};
    const W = 330;
    const left = Math.max(8, Math.min(p.x - W, window.innerWidth - W - 8));
    const lab = (t, menu) => `<span style="display:flex;align-items:center;font-size:13px;color:#5a6773">${t}${menu?`<div style="flex:1"></div><span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5);cursor:pointer">menu</span>`:''}</span>`;
    const inp = (id, val, ph, icon) => `<div style="display:flex;align-items:center;gap:6px;height:34px;box-sizing:border-box;background:#fff;border:1px solid #cedbe7;border-radius:4px;padding:0 8px">${icon?`<span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5);flex:none">${icon}</span>`:''}<input id="${id}" value="${(val||'').replace(/"/g,'&quot;')}" placeholder="${ph||''}" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font:400 14px Roboto,sans-serif;color:#13314c"></div>`;
    const dateInp = (id, val) => `<div style="flex:1;min-width:0;display:flex;align-items:center;gap:4px;height:34px;box-sizing:border-box;background:#fff;border:1px solid #cedbe7;border-radius:4px;padding:0 6px"><input id="${id}" value="${val||''}" placeholder="mm/dd/yyyy" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font:400 13px Roboto,sans-serif;color:#13314c"><span class="material-symbols-outlined" style="font-size:17px;color:#5a6773;flex:none">calendar_month</span></div>`;
    const cb = (id, label, on) => `<label style="display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--ac,#008dd5);cursor:pointer"><input type="checkbox" id="${id}" ${on?'checked':''} style="width:16px;height:16px;margin:0;accent-color:var(--ac,#008dd5)">${label}</label>`;
    const field = (label, inner, menu) => `<div style="display:flex;flex-direction:column;gap:4px">${lab(label, menu)}${inner}</div>`;
    return `<div data-act="pfFilterClose" style="position:fixed;inset:0;z-index:150"></div>
      <div data-act="noop" style="position:fixed;left:${left}px;top:${p.y}px;width:${W}px;max-height:min(80vh,660px);overflow-y:auto;background:#eaf4fb;border:1px solid #cedbe7;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:151;padding:14px 16px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:15px;font-weight:600;color:#13314c">Filters</span><div style="height:1px;background:#cedbe7"></div></div>
        ${field('Type', this.multiSelect('pf-f-type', ['Recurring','One-Time'], (f.type && f.type.length) ? f.type : ['Recurring','One-Time']))}
        ${field('From Date Range', `<div style="display:flex;align-items:center;gap:6px">${dateInp('pf-f-from', f.from||'01/01/2026')}${dateInp('pf-f-to', f.to||'04/01/2026')}<span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5);cursor:pointer;flex:none">menu</span></div>`)}
        ${field('Search Options', this.singleSelect('pf-f-op', ['Contains','Starts with','Equals'], f.op||'Contains', { noSearch:true }))}
        ${field('Charge Type', inp('pf-f-ctype', f.ctype, '', 'search'))}
        ${field('Frequency', inp('pf-f-freq', f.freq, ''))}
        ${field('Name', inp('pf-f-name', f.name, ''))}
        ${field('Comment', inp('pf-f-comment', f.comment, ''), true)}
        <div style="display:flex;align-items:center;gap:22px;padding-top:2px">${cb('pf-f-past','Past',f.past)}${cb('pf-f-future','Future',f.future)}</div>
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;padding-top:2px">
          <button data-act="pfFilterApply" class="btn-pri" style="height:34px;padding:0 20px;border-radius:4px;font-size:14px">Apply</button>
          <button data-act="pfFilterReset" class="btn-out" style="height:34px;padding:0 20px;border-radius:4px;font-size:14px;box-sizing:border-box">Reset</button>
        </div>
      </div>`;
  }

  // ================= ADD PROPERTY OVERLAY =================
  addPropHTML(){
    const a = this.state.addProp; if (!a) return '';
    const nav = ['Property Information','User Defined Fields','Ownerships','Management Fee Setup'];
    const navItem = (t) => { const on = a.nav === t; return `<div data-act="addPropNav" data-arg="${t}" style="padding:9px 16px;font-size:13px;cursor:pointer;${on?'background:#fff;color:#13314c;font-weight:500':'color:#c6d4e2'}">${t}</div>`; };
    const sect = (title, inner) => `<div style="border:1px solid #e3e9ee;border-radius:4px;background:#fff;overflow:hidden;flex:none">
      <div style="padding:7px 12px;border-bottom:2px solid var(--ac,#008dd5);font-size:13px;font-weight:600;color:#13314c">${title}</div>
      <div style="padding:14px 12px;display:flex;flex-direction:column;gap:12px">${inner}</div></div>`;
    const row = (...cols) => `<div style="display:flex;gap:12px;align-items:flex-start">${cols.join('')}</div>`;
    const fld = (label, inner, grow) => `<div style="flex:${grow||1};min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#666">${label}</span>${inner}</div>`;
    const inp = (o) => { o = o || {}; return `<input ${o.id?`id="${o.id}"`:''} value="${o.val||''}" placeholder="${o.ph||''}" style="height:32px;box-sizing:border-box;border:1px solid ${o.err?'#d02830':'#cedbe7'};border-radius:4px;background:#f5f8fa;padding:0 8px;font:400 13px Roboto,sans-serif;color:#13314c;outline:none">`; };
    const sel = (v) => `<div style="height:32px;box-sizing:border-box;border:1px solid #cedbe7;border-radius:4px;background:#f5f8fa;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 4px 0 8px;font-size:13px;color:#13314c;cursor:pointer"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v}</span><span class="material-symbols-outlined" style="font-size:18px;color:#666;flex:none">expand_more</span></div>`;
    const chk = (on, label) => `<label style="display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#13314c;cursor:pointer"><span style="width:16px;height:16px;border-radius:3px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex:none;${on?'background:#f58220;border:1px solid #f58220':'background:#fff;border:1px solid #b3b3b3'}">${on?'<span class="material-symbols-outlined" style="font-size:13px;color:#fff;font-weight:600">check</span>':''}</span>${label}</label>`;
    const radio = (on, label, act, arg) => `<label data-act="${act}" data-arg="${arg}" style="display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#13314c;cursor:pointer"><span style="width:16px;height:16px;border-radius:50%;box-sizing:border-box;border:2px solid ${on?'var(--ac,#008dd5)':'#b3b3b3'};display:flex;align-items:center;justify-content:center;flex:none">${on?'<span style="width:8px;height:8px;border-radius:50%;background:var(--ac,#008dd5)"></span>':''}</span>${label}</label>`;
    const hint = (t) => `<span style="font-size:12px;color:#8a9aa8;padding-left:24px">${t}</span>`;

    // ---- Rental Fee Profile: Blank, or copy charges from a property that already has one ----
    const copyable = this.copyableProfiles();
    const isCopy = a.fee === 'copy';
    const srcRows = isCopy && a.copyFrom ? this.profileRows(a.copyFrom) : [];
    const chargeTable = (label, rows, rec) => {
      const cols = rec ? '38px 110px minmax(140px,1fr) 80px 90px 50px 100px 90px' : '38px 110px minmax(140px,1fr) 100px 90px';
      const heads = rec ? ['','Charge Type','Comment','Frequency','From','To','Amount','Charge Level'] : ['','Charge Type','Comment','Amount','Charge Level'];
      const hc = (t) => `<span style="padding:6px 8px;font-size:11px;font-weight:600;color:#13314c;white-space:nowrap;${/Amount/.test(t)?'display:flex;justify-content:flex-end;':''}">${t}</span>`;
      const cell = (t, extra) => `<span style="display:flex;align-items:center;min-height:34px;padding:5px 8px;font-size:12px;color:#13314c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${extra||''}">${t}</span>`;
      return `<div style="font-size:12px;color:#666;padding:8px 0 4px">${label} (${rows.length})</div>
        <div style="border:1px solid #e3e9ee;border-radius:4px;overflow:hidden">
        <div style="display:grid;grid-template-columns:${cols};border-bottom:1px solid #e3e9ee;background:#fff">${heads.map(hc).join('')}</div>
        ${rows.map(r=>`<div data-act="addPropToggle" data-arg="${r.id}" style="display:grid;grid-template-columns:${cols};align-items:center;border-bottom:1px solid #f0f4f7;cursor:pointer;background:#fff">
          <span style="display:flex;align-items:center;justify-content:center;min-height:34px">${chk(!a.excl[r.id],'')}</span>
          ${cell(r.mits)}${cell(r.desc||r.name)}${rec?(cell('1')+cell(r.from||'—')+cell(r.to||'-')):''}
          ${cell(String(r.amount||'').replace(/^\$/,''),'justify-content:flex-end;text-align:right')}
          <span style="display:flex;align-items:center;min-height:34px;padding:5px 8px">${this.chargeLevelPill(r)}</span></div>`).join('')}
        </div>`;
    };
    const copyBlock = !isCopy ? '' : `<div style="display:flex;flex-direction:column;gap:6px;padding-left:24px">
        <div style="max-width:340px">${this.singleSelect('ap-copy', copyable.length?copyable:['No properties with a profile'], a.copyFrom, { act:'addPropCopyFrom' })}</div>
        <span style="font-size:12px;color:#8a9aa8">Copy recurring and one-time charges from properties that have a rental fee profile set up.</span>
        ${srcRows.length?`<div style="margin-top:6px;display:flex;flex-direction:column;gap:2px">
          <span style="font-size:13px;font-weight:600;color:#13314c">Select Recurring and One-Time Charges to Include</span>
          <div style="border:1px solid #e3e9ee;border-radius:4px;background:#f7f9fb;padding:10px 12px;max-height:260px;overflow-y:auto">
            ${chargeTable('Recurring Charges', srcRows.filter(r=>!/-one$/.test(r.group)), true)}
            ${chargeTable('One-Time Charges', srcRows.filter(r=>/-one$/.test(r.group)), false)}
          </div></div>`:''}
      </div>`;

    const propInfo = `
      ${sect('General Information', row(
        fld('Property Name *', inp({ id:'ap-name', err:a.err })),
        fld('Short Name *', inp({ id:'ap-short' }))
      ) + row(
        fld('Property Type', sel('&nbsp;')),
        fld('Display Color', sel('<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:11px;height:11px;background:#13314c;border-radius:2px"></span>Default</span>'))
      ))}
      ${sect('Other Information', row(
        fld('Property Tax ID', inp({})),
        fld('Posting Day', inp({ val:'25' }))
      ) + row(
        fld('Default Bank', sel('1000 Fifth Third - Operating Bank Account For All Prope…')),
        fld('Rent Charge Type *', sel('RC'))
      ) + row(
        fld('Statement Method', sel('&lt;Use System Default&gt; (Email)'), 2),
        fld('NSF Fee', chk(true, 'Override system default ($100.00)')),
        fld('Custom Amount', inp({ val:'15.00' }))
      ) + fld('Comment', `<textarea style="height:56px;resize:none;box-sizing:border-box;border:1px solid #cedbe7;border-radius:4px;background:#f5f8fa;padding:6px 8px;font:400 13px Roboto,sans-serif;color:#13314c;outline:none"></textarea>`))}
      ${sect('Add Unit, Unit Types, Amenities, and Users', row(
        fld('Valid Unit Types for Property', sel('All Selected')),
        fld('Property Amenities', sel('&nbsp;')),
        fld('Users with Access to Property', sel('64 Selected'))
      ) + row(
        fld('&nbsp;', chk(false, 'Automatically create a unit')),
        fld('Type of Unit to create', `<div style="height:32px;box-sizing:border-box;border:1px solid #cedbe7;border-radius:4px;background:#f5f8fa;display:flex;align-items:center;gap:6px;padding:0 8px"><span class="material-symbols-outlined" style="font-size:16px;color:#8a9aa8">search</span></div>`)
      ))}
      ${sect('Marketing Configuration', `<div style="display:flex;align-items:center;gap:24px">${radio(true,'Property-level Marketing','toast','Property-level Marketing')}${radio(false,'Unit-level Marketing','toast','Unit-level Marketing')}</div>`)}
      ${sect('Rental Fee Profile', `
        ${radio(!isCopy,'Blank','addPropFee','blank')}
        ${hint('Start with no fees, and add charges after the property is created.')}
        ${radio(isCopy,'Copy From','addPropFee','copy')}
        ${copyBlock}`)}`;

    const placeholder = (t) => sect(t, `<span style="font-size:13px;font-style:italic;color:#b3b3b3">No required ${t.toLowerCase()} found.</span>`);
    const body = a.nav === 'Property Information' ? propInfo : placeholder(a.nav);

    return `<div data-act="addPropClose" style="position:fixed;inset:0;background:rgba(19,49,76,0.5);display:flex;align-items:center;justify-content:center;z-index:120">
      <div data-act="noop" style="width:1180px;max-width:96vw;height:88vh;background:#f5f8fa;border-radius:4px;box-shadow:0 8px 28px rgba(0,0,0,0.3);display:flex;overflow:hidden">
        <div style="width:210px;flex:none;background:#13314c;display:flex;flex-direction:column">
          <div style="display:flex;align-items:center;gap:8px;padding:14px 16px"><span style="font-size:16px;color:#fff;flex:1">Add Property</span><span data-act="toast" data-arg="Help" class="material-symbols-outlined" style="font-size:18px;color:#7fb2dd;cursor:pointer">help</span></div>
          <div style="display:flex;flex-direction:column">${nav.map(navItem).join('')}</div>
          <div style="flex:1"></div>
          <div style="display:flex;justify-content:center;padding:20px;opacity:0.22"><span class="material-symbols-outlined" style="font-size:74px;color:#fff">apartment</span></div>
        </div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column">
          <div style="flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px">${body}</div>
          <div style="display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid #cedbe7;background:#f5f8fa;flex:none">
            <div style="flex:1"></div>
            ${a.err?`<span class="material-symbols-outlined" style="font-size:18px;color:#d02830">error</span>`:''}
            <button data-act="addPropSave" class="btn-pri" style="height:32px;padding:0 14px;border-radius:4px;font-size:13px">Save and New</button>
            <button data-act="addPropSave" class="btn-pri" style="height:32px;padding:0 14px;border-radius:4px;font-size:13px">Save and Finish</button>
            <button data-act="addPropClose" class="btn-out" style="height:32px;padding:0 14px;border-radius:4px;font-size:13px;box-sizing:border-box">Cancel</button>
          </div>
        </div>
      </div></div>`;
  }

  // ================= MODAL / TOAST =================
  modalHTML(){
    const m = this.state.modal; if (!m) return '';
    const ed = m.edit || null;
    const isOne = /-one$/.test(m.group);
    // Property specific charges (NSF, late fees) pull every non-marketing field from the property,
    // so General Details renders locked and only the marketing details are editable.
    const spec = ed && ed.propSpecific ? ed.propSpecific : '';
    const title = spec ? `Add ${spec} One-Time Charge` : (ed ? 'Charge Details' : (isOne ? 'Add One-Time Charge' : 'Add Recurring Charge'));
    const esc = s => (''+(s||'')).replace(/"/g,'&quot;');
    const lab = (t,info) => `<span style="display:inline-flex;align-items:center;gap:4px;font-size:14px;color:#666">${t}${info?`<span class="material-symbols-outlined" style="font-size:16px;color:var(--ac,#008dd5)">info</span>`:''}</span>`;
    const sect = (t,inner) => `<div style="display:flex;flex-direction:column;gap:10px"><span style="font-size:15px;font-weight:600;color:#13314c">${t}</span><div style="border:1px solid #cedbe7;border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:12px">${inner}</div></div>`;
    const dd = (id,opts,sel,o) => this.singleSelect(id,opts,sel,o);
    const cat = this.chargeCategoryMap();
    const catFor = c => cat[(c||'').toUpperCase()] || '';

    // ---- Charge Application + its target field ----
    const app = ed ? (ed.level || 'Property') : 'Property';
    const appToggle = "var v=_v;['ut','unit','ori'].forEach(function(k){var e=document.getElementById('m-appt-'+k+'-wrap');if(e)e.style.display='none'});var t={'Unit Type':'ut','Unit':'unit','ORI':'ori'}[v];if(t){var w=document.getElementById('m-appt-'+t+'-wrap');if(w)w.style.display='flex'}";
    const searchField = (id,val,ph) => `<div style="display:flex;align-items:center;gap:6px;background:#f5f8fa;border:1px solid #cedbe7;border-radius:4px;height:36px;box-sizing:border-box;padding:0 8px"><span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5)">search</span><input id="${id}" value="${esc(val)}" placeholder="${ph}" style="flex:1;min-width:0;border:none;background:transparent;outline:none;font:400 14px Roboto,sans-serif;color:#13314c"></div>`;
    const tgt = (key,label,id,val,ph) => `<div id="m-appt-${key}-wrap" style="display:${app===label?'flex':'none'};flex-direction:column;gap:4px;flex:1;min-width:0">${lab(label+' *')}${searchField(id,val,ph)}</div>`;
    const chargeApp = `<div style="display:flex;gap:12px;align-items:flex-start">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Charge Application *')}${dd('m-app',['Property','Unit Type','Unit','ORI'],app,{noSearch:true,js:appToggle})}</div>
      ${tgt('ut','Unit Type','m-appt-ut', app==='Unit Type'?(ed&&ed.target||''):'', '2BR/2BA')}
      ${tgt('unit','Unit','m-appt-unit', app==='Unit'?(ed&&ed.target||''):'', '2C')}
      ${tgt('ori','ORI','m-appt-ori', app==='ORI'?(ed&&ed.target||''):'', 'Garage Spot 1')}
    </div>`;

    // ---- Charge Type typeahead; selecting one derives the Charge Category below ----
    const setCat = "var cc=this.getAttribute('data-cat');var d=document.getElementById('m-cat-disp');var e=document.getElementById('m-cat-err');var ph=document.getElementById('m-cat-ph');document.getElementById('m-cat').value=cc||'';ph.style.display='none';if(cc){d.textContent=cc;d.style.display='block';e.style.display='none';}else{d.style.display='none';e.style.display='flex';}";
    const ctItems = this.chargeTypeList().map(([c,d2]) => `<div data-cat="${catFor(c)}" data-ct="${(c+' '+d2).toLowerCase()}" onmousedown="document.getElementById('m-ctype').value='${c}';document.getElementById('m-ctype-desc').value='${d2.replace(/'/g,"")}';${setCat}document.getElementById('m-ctype-panel').style.display='none'" style="padding:8px 12px;cursor:pointer" onmouseover="this.style.background='#f0f6fb'" onmouseout="this.style.background=''"><div style="font-size:15px;color:#13314c">${c}</div><div style="font-size:13px;color:#8a9aa8">${d2}</div></div>`).join('');
    const ctypeField = `<div style="position:relative">
      <div style="display:flex;align-items:center;gap:4px;background:#f5f8fa;border:1px solid #cedbe7;border-radius:4px;height:36px;box-sizing:border-box;padding:0 8px"><span class="material-symbols-outlined" style="font-size:20px;color:var(--ac,#008dd5)">search</span><input id="m-ctype" autocomplete="off" placeholder="Search charge types" value="${esc(ed?ed.mits:'')}" onfocus="document.getElementById('m-ctype-panel').style.display='block'" onblur="var p=document.getElementById('m-ctype-panel');setTimeout(function(){p.style.display='none'},200)" oninput="var q=this.value.toLowerCase();document.getElementById('m-ctype-panel').style.display='block';document.getElementById('m-ctype-list').querySelectorAll('[data-ct]').forEach(function(el){el.style.display=(el.getAttribute('data-ct').indexOf(q)>=0?'block':'none')})" style="flex:1;min-width:0;border:none;background:transparent;outline:none;font:400 14px Roboto,sans-serif;color:#13314c"></div>
      <input type="hidden" id="m-ctype-desc" value="${esc(ed?ed.name:'')}">
      <div id="m-ctype-panel" style="display:none;position:absolute;left:0;right:0;top:40px;z-index:20;background:#fff;border:1px solid #cedbe7;border-radius:4px;box-shadow:0 3px 6px rgba(0,0,0,0.15);max-height:220px;overflow-y:auto"><div id="m-ctype-list">${ctItems}</div></div>
    </div>`;

    // ---- Amount method ----
    const src = ed ? (ed.amtMethod || 'Flat') : 'Flat';
    const amtFlat = ed && /^\$/.test(ed.amount||'') ? (ed.amount||'').replace(/^\$/,'') : '';
    const radio = (label,value,blk) => `<label style="display:inline-flex;align-items:center;gap:8px;font-size:14px;color:#666;cursor:pointer"><input type="radio" name="m-amt-r" value="${value}" data-blk="${blk}" ${src===value?'checked':''} onchange="var b=this.getAttribute('data-blk');document.getElementById('m-source').value=this.value;['flat','ref','calc'].forEach(function(k){document.getElementById('m-blk-'+k).style.display=(k===b?'flex':'none')})" style="accent-color:var(--ac,#008dd5);width:16px;height:16px;margin:0">${label}</label>`;
    const iconInput = (id,val,ph,icon) => `<div style="display:flex;align-items:center;gap:4px;background:#f5f8fa;border:1px solid #cedbe7;border-radius:4px;height:36px;box-sizing:border-box;padding:0 8px"><input id="${id}" value="${esc(val)}" placeholder="${ph}" style="flex:1;min-width:0;border:none;background:transparent;outline:none;font:400 14px Roboto,sans-serif;color:#13314c"><span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5)">${icon}</span></div>`;
    const amount = `<div style="display:flex;gap:12px;align-items:flex-start">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Amount Method')}${dd('m-method',['Flat','Reference','Calculation'],src,{noSearch:true,js:"var t={'Flat':'flat','Reference':'ref','Calculation':'calc'}[_v];document.getElementById('m-source').value=_v;['flat','ref','calc'].forEach(function(k){document.getElementById('m-blk-'+k).style.display=(k===t?'flex':'none')})"})}</div>
      <div style="flex:1;min-width:0">
        <input type="hidden" id="m-source" value="${src}">
        <div id="m-blk-flat" style="display:${src==='Flat'?'flex':'none'};flex-direction:column;gap:4px">${lab('Amount')}${iconInput('m-amount',amtFlat,'00.00','calculate')}</div>
        <div id="m-blk-ref" style="display:${src==='Reference'?'flex':'none'};flex-direction:column;gap:4px">${lab('Amount')}${dd('m-ref',['Market Rent','Field: Market Rent','Unit UDF: Parking Spot #'],'Market Rent',{noSearch:true})}</div>
        <div id="m-blk-calc" style="display:${src==='Calculation'?'flex':'none'};flex-direction:column;gap:4px">${lab('Amount')}${iconInput('m-calc','','','edit')}</div>
      </div></div>`;

    // ---- General Details ----
    const freqRow = isOne ? '' : `<div style="display:flex;gap:12px;align-items:flex-start">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Frequency *')}<input id="m-freq" class="fld" value="${ed?'1':'1'}" style="height:36px;box-sizing:border-box"></div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('From')}${iconInput('m-from',ed?ed.from:'','mm/dd/yy','calendar_month')}</div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('To')}${iconInput('m-to',ed?ed.to:'','mm/dd/yy','calendar_month')}</div>
    </div>`;
    const ilsOn = ed ? !!ed.ils : false;
    // Locked General Details for property specific charges: application, type and amount only.
    const dis = (v) => `<div style="display:flex;align-items:center;height:36px;box-sizing:border-box;padding:0 10px;background:#f5f8fa;border:1px solid #e3e9ee;border-radius:4px;font-size:14px;color:#a6b2bd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v}</div>`;
    const disSel = (v) => `<div style="display:flex;align-items:center;justify-content:space-between;gap:4px;height:36px;box-sizing:border-box;padding:0 6px 0 10px;background:#f5f8fa;border:1px solid #e3e9ee;border-radius:4px;font-size:14px;color:#a6b2bd"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${v}</span><span class="material-symbols-outlined" style="font-size:20px;color:#c9d4dd">expand_more</span></div>`;
    const disSearch = (v) => `<div style="display:flex;align-items:center;gap:6px;height:36px;box-sizing:border-box;padding:0 10px;background:#f5f8fa;border:1px solid #e3e9ee;border-radius:4px;font-size:14px;color:#a6b2bd"><span class="material-symbols-outlined" style="font-size:18px;color:#c9d4dd">search</span>${v}</div>`;
    const specGeneral = !spec ? '' : `
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Charge Application *')}${disSel('Property')}</div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Charge Type *')}${disSearch(ed.mits)}</div>
      <div style="display:flex;gap:12px;align-items:flex-start">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Amount Method')}${disSel(ed.amtMethod||'Flat')}</div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Amount')}${dis(String(ed.amount||'').replace(/^\$/,''))}</div>
      </div>`;
    const specNote = !spec ? '' : `<div style="display:flex;align-items:center;gap:10px;border:1px solid var(--ac,#008dd5);border-radius:4px;padding:10px 14px"><span class="material-symbols-outlined" style="font-size:20px;color:var(--ac,#008dd5)">info</span><span style="font-size:13px;color:#13314c">Only the marketing details can be edited here, ${spec==='NSF'?'NSF fees':'late fees'} are property specific and have special circumstances.</span></div>`;
    const general = `${chargeApp}
      <div style="display:flex;gap:12px;align-items:flex-start">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Charge Type *')}${ctypeField}</div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Comment')}<div style="display:flex;align-items:center;gap:4px;background:#f5f8fa;border:1px solid #cedbe7;border-radius:4px;height:36px;box-sizing:border-box;padding:0 8px"><input id="m-comment" value="${esc(ed?ed.desc:'')}" placeholder="Internal only" style="flex:1;min-width:0;border:none;background:transparent;outline:none;font:400 14px Roboto,sans-serif;color:#13314c"><span class="material-symbols-outlined" style="font-size:18px;color:#8a9aa8">notes</span></div></div>
      </div>
      ${freqRow}
      ${amount}`;

    // ---- Marketing Details (always available; MITS 5.0 / listing fields) ----
    const edCat = ed ? catFor(ed.mits) : '';
    const hasCode = !!(ed && ed.mits);
    const req = (ed && ed.listing && ed.listing.requirement) || this.defaultRequirement(ed || m);
    const refundable = ed && ed.listing && ed.listing.refundable !== undefined ? ed.listing.refundable : this.defaultRefundable(ed);
    const catBlock = `<div style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:0">${lab('Charge Category',true)}
      <input type="hidden" id="m-cat" value="${esc(edCat)}">
      <span id="m-cat-ph" style="display:${(hasCode&&edCat)?'none':'block'};font-size:13px;font-style:italic;color:#b3b3b3">Select a charge type to display a charge category.</span>
      <span id="m-cat-disp" style="display:${edCat?'block':'none'};font-size:14px;font-weight:600;color:#13314c">${edCat}</span>
      <div id="m-cat-err" style="display:${(hasCode&&!edCat)?'flex':'none'};align-items:center;gap:8px;background:#fdeaea;border:1px solid #f3c2c2;border-radius:4px;padding:8px 10px"><span class="material-symbols-outlined" style="font-size:18px;color:#d02830">error</span><span style="flex:1;font-size:12px;color:#7a1f26;line-height:1.4">You don't have a charge category assigned to this charge type.</span><a data-act="toast" data-arg="Add Category" style="font-size:13px;color:var(--ac,#008dd5);white-space:nowrap;cursor:pointer">Add Category</a></div>
    </div>`;
    const listing = `<div style="display:flex;gap:12px;align-items:flex-start">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Name')}<input id="m-name" class="fld" value="${esc(ed&&ed.listing?ed.listing.name:'')}" oninput="if(window.__mitsRecheck)window.__mitsRecheck()" style="height:36px;box-sizing:border-box"></div>
        ${catBlock}
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">${lab('Marketing Description')}<textarea id="m-marketing" class="fld" style="height:56px;resize:none;box-sizing:border-box;padding:8px 12px;font:400 14px Roboto,sans-serif">${ed&&ed.listing?(ed.listing.marketing||''):''}</textarea></div>
      <div style="display:flex;gap:12px;align-items:flex-start">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Charge Requirement')}${dd('m-req',['Required','Optional','Situational'],req,{noSearch:true,js:"document.getElementById('m-sitdesc-wrap').style.display=(_v==='Situational'?'flex':'none');if(window.__mitsRecheck)window.__mitsRecheck()"})}</div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Fee Due')}${dd('m-due',['At Application','During Term','Move-Out'],(ed&&ed.listing&&ed.listing.feeDue)||'During Term',{noSearch:true,js:"if(window.__mitsRecheck)window.__mitsRecheck()"})}</div>
        ${isOne?'':`<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Charge Schedule',true)}${dd('m-sched',['Monthly','Weekly','Daily'],(ed&&ed.listing&&ed.listing.schedule)||'Monthly',{noSearch:true,js:"if(window.__mitsRecheck)window.__mitsRecheck()"})}</div>`}
      </div>
      <label style="display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:14px;color:#13314c;cursor:pointer"><input type="checkbox" id="m-refund" ${refundable?'checked':''} style="width:16px;height:16px;margin:0;accent-color:#f58220">Refundable</label>
      <div id="m-sitdesc-wrap" style="display:${req==='Situational'?'flex':'none'};flex-direction:column;gap:4px">${lab('Situational Charge Description')}<textarea id="m-sitdesc" class="fld" style="height:48px;resize:none;box-sizing:border-box;padding:8px 12px;font:400 14px Roboto,sans-serif">${esc(ed?ed.cond:'')}</textarea></div>`;

    // ILS box that sits at the top of Marketing Details (mock 2489-119627). Lists the MITS fields
    // still missing as chips and keeps "Show on ILS" disabled until they're all filled in.
    const missing = ed ? this.mitsMissing(ed) : this.mitsFields().map(f => f.label);
    const chip = (n) => `<span style="display:inline-flex;align-items:center;gap:5px;background:#fdf3e3;border-radius:12px;padding:2px 9px;font-size:13px;color:#7a5a2a;white-space:nowrap"><span class="material-symbols-outlined" style="font-size:15px;color:#b35a00">error</span>${n}</span>`;
    const complete = !missing.length;
    // Live re-check so the toggle unlocks as the fields get filled in.
    window.__mitsRecheck = () => {
      const g = (id) => { const e = this.q('#' + id); return e ? String(e.value || '').trim() : ''; };
      const need = [];
      if (!g('m-name')) need.push('Name');
      if (!g('m-cat')) need.push('Charge Category');
      if (!g('m-req')) need.push('Charge Requirement');
      if (!g('m-due')) need.push('Fee Due');
      if (!isOne && !g('m-sched')) need.push('Charge Schedule');
      const msg = this.q('#m-ils-msg'), ok = this.q('#m-ils-ok'), sw = this.q('#m-ils-sw'), lbl = this.q('#m-ils-lbl'), needEl = this.q('#m-ils-need');
      if (!msg || !sw) return;
      if (need.length) {
        needEl.innerHTML = need.map(chip).join('');
        msg.style.display = 'flex'; ok.style.display = 'none';
        sw.setAttribute('data-dis', '1'); sw.style.background = '#dfe6ec'; sw.style.cursor = 'default';
        sw.setAttribute('data-on', '0'); sw.firstElementChild.style.left = '2px';
        const h = this.q('#m-ils'); if (h) h.value = '0';
        lbl.style.color = '#a6b2bd';
      } else {
        msg.style.display = 'none'; ok.style.display = 'inline-flex';
        sw.setAttribute('data-dis', '0'); sw.style.cursor = 'pointer';
        sw.style.background = sw.getAttribute('data-on') === '1' ? 'var(--ac,#008dd5)' : '#cedbe7';
        lbl.style.color = '#13314c';
      }
    };
    const swOn = ilsOn && complete;
    const ilsBox = this.ilsOn() ? `<div style="border:1px solid #cedbe7;border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
        <div id="m-ils-msg" style="display:${complete?'none':'flex'};align-items:center;gap:10px;flex-wrap:wrap">
          <span style="font-size:14px;color:#13314c">Fill in the following fields to have this charge appear on listings:</span>
          <span id="m-ils-need" style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap">${missing.map(chip).join('')}</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <label style="display:inline-flex;align-items:center;gap:10px;cursor:${complete?'pointer':'default'}"><span id="m-ils-sw" data-dis="${complete?'0':'1'}" onclick="if(this.getAttribute('data-dis')==='1')return;var on=this.getAttribute('data-on')==='1';on=!on;this.setAttribute('data-on',on?'1':'0');document.getElementById('m-ils').value=on?'1':'0';this.style.background=on?'var(--ac,#008dd5)':'#cedbe7';this.firstElementChild.style.left=on?'16px':'2px'" data-on="${swOn?'1':'0'}" style="display:inline-block;width:32px;height:18px;border-radius:999px;background:${!complete?'#dfe6ec':(swOn?'var(--ac,#008dd5)':'#cedbe7')};position:relative;flex:none;cursor:${complete?'pointer':'default'}"><span style="position:absolute;top:2px;left:${swOn?'16px':'2px'};width:14px;height:14px;border-radius:50%;background:#fff;transition:left 120ms ease-out"></span></span><span id="m-ils-lbl" style="font-size:14px;color:${complete?'#13314c':'#a6b2bd'}">Show on ILS</span></label>
          <span id="m-ils-ok" style="display:${complete?'inline-flex':'none'};align-items:center;gap:6px"><span class="material-symbols-outlined" style="font-size:17px;color:#12a150">check_circle</span><span style="font-size:13px;color:#4a5b6b">All required fields filled out to display charge on listings.</span></span>
        </div>
        <input type="hidden" id="m-ils" value="${swOn?'1':'0'}">
      </div>` : `<input type="hidden" id="m-ils" value="0">`;

    return `<div data-act="addclose" style="position:fixed;inset:0;background:rgba(19,49,76,0.5);display:flex;align-items:center;justify-content:center;z-index:100">
      <div data-act="noop" style="width:700px;max-width:94vw;max-height:92vh;background:#fff;border:1px solid #cedbe7;border-radius:4px;box-shadow:0 3px 12px rgba(0,0,0,0.2);display:flex;flex-direction:column;overflow:hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;height:48px;box-sizing:border-box;padding:8px 16px;border-bottom:1px solid #cedbe7;flex:none">
          <span style="font-size:20px;line-height:28px;color:#13314c">${title}</span>
          <span data-act="addclose" class="material-symbols-outlined" style="font-size:24px;color:var(--ac,#008dd5);cursor:pointer">close</span>
        </div>
        <div style="flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px">
          ${specNote}
          ${sect('General Details', spec ? specGeneral : general)}
          <div style="display:flex;flex-direction:column;gap:10px">
            <span style="font-size:15px;font-weight:600;color:#13314c">Marketing Details</span>
            ${ilsBox}
            <div style="border:1px solid #cedbe7;border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:12px">${listing}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid #cedbe7;background:#f5f8fa;flex:none">
          <span id="m-err" style="display:none;align-items:center;gap:6px;color:#d02830;font-size:13px"><span class="material-symbols-outlined" style="font-size:16px">error</span><span id="m-err-txt"></span></span>
          <div style="flex:1"></div>
          <button data-act="addsave" class="btn-pri" style="height:36px;padding:8px 20px;font-size:14px;border-radius:4px">Save</button>
          <button data-act="addclose" class="btn-out" style="height:36px;padding:8px 20px;font-size:14px;border-radius:4px;box-sizing:border-box">Cancel</button>
        </div>
      </div></div>`;
  }
  toastHTML(){ return this.state.toast ? `<div class="toast"><span class="material-symbols-outlined" style="font-size:18px">check_circle</span>${this.state.toast}</div>` : ''; }

  // ================= SCREENS =================
  screenHTML(){
    this._tid = 0;
    const s = this.state;
    let out = this.header();
    if (s.view === 'property') {
      out += this.ctx('Property', [{ label: s.property }], '125 of 255', 'navRegister');
      out += this.propScoreboard();
      out += this.tabRow(['General','Leasing','Documents','Rental Fee Profile'], s.propTab, 'proptab', { badge: { 'Rental Fee Profile':'New' } });
      if (s.propTab === 'Rental Fee Profile') {
        out += `<div style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden">${this.feeProfileTab()}</div>`;
      } else {
        out += `<div style="flex:1;min-height:0;display:flex;align-items:stretch;overflow:hidden"><div style="flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column"><div style="flex:1;min-width:0;padding:16px;display:flex;flex-direction:column;gap:16px;max-width:1500px;width:100%;box-sizing:border-box;margin:0 auto">${this.propGeneralBody()}</div></div>${this.rail()}</div>`;
        out += this.footer('Save property');
      }
    } else if (s.view === 'register') {
      out += `<div style="height:40px;background:var(--ac,#008dd5);display:flex;align-items:center;padding:0 16px;gap:12px;color:#fff;flex:none">
        <span style="font-size:18px;line-height:24px">Properties</span>
        <div style="flex:1"></div>
        <span data-act="toast" data-arg="Print" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">print</span>
        <span data-act="toast" data-arg="Refresh" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">autorenew</span>
        <span class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">help</span>
      </div>`;
      out += `<div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column">${this.registerBody()}</div>`;
    } else {
      out += this.ctx('Unit', [{ label: s.property, act:'navProperty', arg: s.property }, { label:'Unit ' + s.unit }], '125 of 255');
      out += this.unitBody();
      out += this.footer('Save unit');
    }
    out += this.modalHTML();
    out += this.rowMenuHTML();
    out += this.recViewHTML();
    out += this.setupHTML();
    out += this.addPropHTML();
    out += this.pfFilterHTML();
    out += this.pricePreviewHTML();
    out += this.profMenuHTML();
    out += this.profHistHTML();
    out += this.toastHTML();
    return out;
  }
  renderVals(){
    return {
      rootRef: this.setRoot,
      onClick: this.onClick,
      screen: React.createElement('div', { style: { display:'flex', flexDirection:'column', flex:1, minHeight:0 }, dangerouslySetInnerHTML: { __html: this.screenHTML() } })
    };
  }
}
</script>
</body>
</html>

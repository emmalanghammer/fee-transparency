class Component extends DCLogic {
  state = {
    view: 'register',
    accOpen: { 'pf-rec':true, 'pf-one':true, 'pf-req':true, 'pf-opt':true, 'pf-sit':true, 'pf-ind':true },
    groupByReq: false,
    pfFilter: null,
    pfFilters: null,
    addProp: null,
    newProps: [],
    propTab: 'General',
    property: 'Riverview Apartments',
    unit: '1B',
    toggles: {},
    // Per-property Rental Fee Profile. profileStatus[prop]='active' once set up;
    // profileFees[prop] holds that property's charge rows.
    // Properties opted into marketing on online listings. Marketing/MITS details are editable on
    // every property; this flag only controls whether listing publishing is surfaced at all.
    // The Berkshires is listed but not yet converted, so the setup review can warn about the
    // listing impact. The opt-in itself only surfaces once a profile exists.
    ilsProps: { 'Riverview Apartments': true, 'The Berkshires': true },
    profileStatus: {},
    profileFees: {},
    profHist: null,
    // Bulk Update Fees: { idx, open:{rec,one} }. state.modal carries the charge being edited, so the
    // shared form and saveFee work unchanged.
    bulk: null,
    // Copy Property Fees: { from, dup:'skip'|'replace', excl }
    copyFees: null,
    // Register selection mode for the bulk profile setup: { sel: {propName:true} }
    bulkSetup: null,
    // The "Coming Soon" kickoff announcement. Starts closed on purpose — it's opened from the nav
    // menu when it needs showing, rather than interrupting every refresh.
    kickoff: false,
    // The "Introducing Rental Fee Profiles" launch announcement, opened from the same nav menu.
    announce: false,
    // Changes made while using the prototype. The seeded history stops at today, so everything in
    // here is something the user did this session.
    histLog: [],
    nextFeeId: 101,
    setup: null,            // { prop, step:1|2|'saving', excl:{} }
    lvlSel: 'all',          // 'all' | 'Property' | 'Unit Type' | 'Unit' | 'ORI'
    bannerDismissed: {},
    pricePreview: null,     // { prop, unit, opt:{}, sitOpen }
    profMenu: null,
    recView: null,
    recViewNote: true,
    rowMenu: null,
    modal: null,
    toast: null
  };

  // ---------- properties (the top-level entity; fee profiles hang off these) ----------
  propertiesData(){
    return (this.state.newProps || []).concat([
      { name:'Riverview Apartments', short:'RIVER', email:'stewart@riverviewapts.com', manager:'Stewart Chandler', addr:'1492 Loveland-Madeira Road, Loveland, OH 45140', billing:'1492 Loveland-Madeira Road, Loveland, OH 45140', color:'#1570ef', loc:'Loveland, OH', units:50, occupied:30, owner:'Thompson Family Trust', logo:'assets/logo-riverview.png' },
      { name:'The Berkshires', short:'BERK', email:'malik@theberkshires.com', manager:'Malik Roberson', addr:'4321 Loveland-Miamiville Rd, Loveland, OH 45140', billing:'9876 Socialville-Fosters Rd, Mason, OH 45040', color:'#1570ef', loc:'Loveland, OH', units:64, occupied:58 },
      { name:'The Windermere', short:'WIND', email:'kiana@thewindermere.com', manager:'Kiana Booker', addr:'1234 Tylersville Rd, West Chester, OH 45069', billing:'5678 Fields Ertel Rd, Cincinnati, OH 45249', color:'', loc:'West Chester, OH', units:42, occupied:39 },
      { name:'The Estates', short:'ESTATE', email:'zack@theestates.com', manager:'Zackary Nixon', addr:'1357 Milford-Blanchester Rd, Milford, OH 45150', billing:'2468 Morrow-Rossburg Rd, Morrow, OH 45152', color:'#d92d20', loc:'Milford, OH', units:88, occupied:71 },
      { name:'Willow Creek', short:'WILLOW', email:'jaquan@willowcreek.com', manager:'Jaquan Fry', addr:'9012 Lebanon Rd, Maineville, OH 45039', billing:'3579 Columbia Rd, South Lebanon, OH 45065', color:'#12a150', loc:'Maineville, OH', units:36, occupied:33 },
      { name:'Greenbriar Village', short:'GREENB', email:'jaqueline@greenbriarvillage.com', manager:'Jaqueline Rush', addr:'4680 Wilmington Rd, Clarksville, OH 45113', billing:'5791 Jamestown-New Jasper Rd, Jamestown, OH 45335', color:'', loc:'Clarksville, OH', units:24, occupied:20 },
      { name:'Oakwood Manor', short:'OAKMAN', email:'bryan@oakwoodmanor.com', manager:'Bryan Ashley', addr:'6802 Paintersville-New Jasper Rd, Xenia, OH 45385', billing:'7913 Bellbrook-Sugarcreek Rd, Bellbrook, OH 45305', color:'', loc:'Xenia, OH', units:72, occupied:64 },
      { name:'Pinewood Place', short:'PINEPL', email:'arley@pinewoodplace.com', manager:'Arley Harrell', addr:'8024 Franklin St, Spring Valley, OH 45370', billing:'9135 Dayton-Xenia Rd, Beavercreek, OH 45434', color:'', loc:'Spring Valley, OH', units:18, occupied:15 },
      { name:'Cedar Ridge', short:'CRIDGE', email:'shea@cedarridge.com', manager:'Shea Ferry', addr:'0246 Indian Ripple Rd, Dayton, OH 45440', billing:'1357 Miamisburg-Centerville Rd, Dayton, OH 45459', color:'#f58220', loc:'Dayton, OH', units:56, occupied:49 },
      { name:'The Highlands', short:'HIGH', email:'kobe@thehighlands.com', manager:'Kobe Mccarty', addr:'2468 Far Hills Ave, Kettering, OH 45419', billing:'3579 Whipp Rd, Centerville, OH 45458', color:'#1570ef', loc:'Kettering, OH', units:44, occupied:40 },
      { name:'Valley Forge', short:'VALLEY', email:'jayson@valleyforge.com', manager:'Jayson Locklear', addr:'4680 Yankee St, Dayton, OH 45458', billing:'5791 Social Row Rd, Mason, OH 45040', color:'#737373', loc:'Dayton, OH', units:30, occupied:22 },
      { name:'The Arbors', short:'ARBORS', email:'rylee@thearbors.com', manager:'Rylee Herron', addr:'6802 Butler Warren Rd, Mason, OH 45040', billing:'7913 Columbia Rd, Kings Mills, OH 45034', color:'#13314c', loc:'Mason, OH', units:60, occupied:52 },
      { name:'Stonegate Village', short:'STONEG', email:'neha@stonegatevillage.com', manager:'Neha Walter', addr:'8024 Western Row Rd, Maineville, OH 45039', billing:'9135 Irwin Simpson Rd, Mason, OH 45040', color:'#12a150', loc:'Maineville, OH', units:58, occupied:39 },
      { name:'The Hamptons', short:'HAMPTON', email:'zavier@thehamptons.com', manager:'Zavier Burks', addr:'0246 Fields Ertel Rd, Cincinnati, OH 45241', billing:'1357 Loveland Madeira Rd, Loveland, OH 45140', color:'#f58220', loc:'Cincinnati, OH', units:34, occupied:31 }
    ]);
  }
  // Properties whose Rental Fee Profile can be copied when adding a property.
  copyableProfiles(){ return this.propertiesData().map(p=>p.name).filter(n=>this.usingProfile(n)); }
  propNames(){ return this.propertiesData().map(p => p.name); }
  propInfo(name){ const n = name || this.state.property; return this.propertiesData().find(p => p.name === n) || this.propertiesData()[0]; }
  properties(){ return this.propertiesData(); }

  // ---------- per-property Rental Fee Profile ----------
  // Properties that already have a Rental Fee Profile — the register's "Using Rental Fee Profile"
  // column. Opening one of these lands on the populated profile; the rest land on pre-setup.
  seededProfiles(){
    return ['Riverview Apartments','The Windermere','The Estates','Willow Creek','Greenbriar Village',
            'Oakwood Manor','Pinewood Place','Stonegate Village','The Hamptons'];
  }
  usingProfile(p){ return this.profStatus(p) === 'active'; }
  profStatus(p){
    const n = p || this.state.property;
    return this.state.profileStatus[n] || (this.seededProfiles().indexOf(n) >= 0 ? 'active' : 'none');
  }
  ilsOn(p){ return !!this.state.ilsProps[p || this.state.property]; }
  // The MITS 5.0 / listing fields a charge must carry before it can be marketed.
  mitsFields(){
    return [
      { key:'name',        label:'Name' },                                 // MITS: Name
      { key:'category',    label:'Charge Category' },                      // MITS: Code
      { key:'requirement', label:'Charge Requirement' },                   // MITS: Requirement
      { key:'feeDue',      label:'Fee Due' },                              // MITS: Lifecycle
      { key:'schedule',    label:'Charge Schedule', recurringOnly:true }   // MITS: Payment Frequency
    ];
  }
  // Charge Category resolves from the charge-type -> category map, so it only counts as missing
  // when a type has no mapping. Everything else — including the marketing Name, which is distinct
  // from the charge's operational name — must be entered by the user.
  // Best-guess MITS charge requirement from the charge type and comment. Situational charges only
  // apply when a condition is met; optional ones are tenant-selected add-ons; everything else
  // (rent, utilities, admin, deposits, application) is required.
  inferRequirement(r){
    const code = String(r.mits || '').toUpperCase();
    const text = ((r.desc || '') + ' ' + (r.name || '')).toLowerCase();
    if (/^PET/.test(code) || /\bpets?\b/.test(text)) return 'Situational';
    if (/^(LATE|LC|NSF|DAMAGE|VIOLATION|LEGAL)/.test(code)) return 'Situational';
    if (/^(SF|STORAGE|COVPARK|PARK|PARKING|GARAGE|HOLD|AMENFEE|AMENITY|UPGRADE|TECH|CABLE|TRANSFER|EVCHG)/.test(code)) return 'Optional';
    if (/\b(optional|add-?on|valet|storage|parking|garage|reservation|locker|access)\b/.test(text)) return 'Optional';
    return 'Required';
  }
  // The requirement chosen for a charge during setup (falls back to the inferred value).
  // Blank until the user picks one — setup shouldn't guess a requirement on their behalf. Charges
  // left unset land in the Individual Charges group and get flagged as missing the MITS field.
  // Which selected property step 2 is currently reviewing.
  setupCurProp(){ const c = this.state.setup; if (!c) return ''; return this.setupProps()[c.pi || 0] || ''; }
  setupExclFor(prop){ const c = this.state.setup; return (c && c.excl && c.excl[prop]) || {}; }
  setupRequirement(r, prop){
    const c = this.state.setup; if (!c) return '';
    const m = (c.req && c.req[prop || this.setupCurProp()]) || {};
    return m[r.id] || '';
  }
  // Requirement comes from the charge's group when marketing details haven't been saved yet.
  defaultRequirement(r){
    const g = String(r.group || '');
    // 'ind' means no requirement was ever chosen, so there's nothing to fall back on.
    if (g.indexOf('ind') === 0) return '';
    return g.indexOf('opt') === 0 ? 'Optional' : g.indexOf('sit') === 0 ? 'Situational' : 'Required';
  }
  // ---------- Rental Fee Profile history ----------
  // Preloaded demo history, running up to today. Keyed to charge codes so it only surfaces for
  // charges the property actually has. Keys sort as 'YYYY-MM'; anything after this is tracked live.
  profileAmountSeed(){
    return {
      GARBAG:     { by:'Devon Marsh',    hist:[['2025-01','$25.00'],['2026-01','$26.00'],['2026-07','$28.00']] },
      GARBAGEFEE: { by:'Devon Marsh',    hist:[['2026-01','$4.00']] },
      ADMIN:      { by:'Admin',          hist:[['2025-01','$125.00'],['2026-01','$150.00']] },
      APPFEE:     { by:'Rachel Hodges',  hist:[['2025-01','$50.00'],['2026-01','$50.00']] },
      AMENFEE:    { by:'Admin',          hist:[['2025-01','$25.00'],['2026-01','$28.00']] },
      PETFEE:     { by:'Devon Marsh',    hist:[['2025-01','$35.00'],['2026-01','$45.00']] },
      DP:         { by:'Admin',          hist:[['2025-01','$450.00'],['2026-01','$500.00']] },
      HOLD:       { by:'Rachel Hodges',  hist:[['2026-01','$200.00']] }
    };
  }
  histLabel(k){
    if (k === 'now') return 'Just now';
    if (k === 'pre') return 'Earlier';
    const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const p = String(k).split('-');
    return mo[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }
  // ---------- change tracking ----------
  // Records something the user did in this session. Every profile mutation routes through here so
  // the history keeps up rather than being seeded fiction.
  logChange(prop, charge, change, level, extra){
    const e = Object.assign({ prop, by: 'Emma Langhammer', charge, change, level: level || prop }, extra || {});
    this.setState(s => ({ histLog: s.histLog.concat([e]) }));
  }
  histLabelFor(r){ return (r.mits ? r.mits + ' · ' : '') + (r.desc || (r.listing && r.listing.name) || r.name || 'Charge'); }
  // Field-by-field diff so an edit logs what actually changed instead of a bare "edited".
  chargeDiff(a, b){
    const out = [];
    const la = this.resolvedListing(a), lb = this.resolvedListing(b);
    const cmp = (label, x, y) => {
      const sx = x == null ? '' : String(x), sy = y == null ? '' : String(y);
      if (sx === sy) return;
      out.push(label + ' ' + (sx || '—') + ' → ' + (sy || '—'));
    };
    cmp('Amount', a.amount, b.amount);
    cmp('Charge Type', a.mits, b.mits);
    cmp('Comment', a.desc, b.desc);
    cmp('Charge Application', a.target || a.level, b.target || b.level);
    cmp('Amount Method', a.amtMethod, b.amtMethod);
    // "Every Month" and "Every 1 Month" are the same frequency written two ways — compare the
    // multiplier so re-saving a converted charge doesn't read as a change.
    const freqKey = v => { const s = String(v || ''); if (!s) return ''; const m = s.match(/\d+/);
      return (m ? m[0] : '1') + ' ' + s.replace(/Every\s*|\d+\s*/gi, '').trim(); };
    if (freqKey(a.freq) !== freqKey(b.freq)) cmp('Frequency', a.freq, b.freq);
    cmp('Name', la.name, lb.name);
    cmp('Marketing Description', la.marketing, lb.marketing);
    cmp('Charge Requirement', la.requirement, lb.requirement);
    cmp('Fee Due', la.feeDue, lb.feeDue);
    cmp('Charge Schedule', la.schedule, lb.schedule);
    cmp('Situational Description', a.cond, b.cond);
    cmp('Amount Distribution', a.creDist, b.creDist);
    cmp('Divide', a.creDivide, b.creDivide);
    cmp('User Defined Field', a.creUdf, b.creUdf);
    if (!!la.refundable !== !!lb.refundable) out.push('Refundable turned ' + (lb.refundable ? 'on' : 'off'));
    if (!!a.ils !== !!b.ils) out.push(b.ils ? 'Included on listings' : 'Excluded from listings');
    return out;
  }
  // Logs a charge edit and, when the amount moved, carries the before/after so the amount timeline
  // can pick it up too.
  logChargeEdit(before, after){
    const diff = this.chargeDiff(before, after);
    if (!diff.length) return;
    // chargeId is what makes the log entry link back to the charge; amtFrom/amt additionally feed
    // the amount timeline, so they're only set when the amount actually moved.
    const extra = { chargeId: after.id != null ? after.id : before.id };
    if (this.parseAmt(before.amount) !== this.parseAmt(after.amount)) { extra.amtFrom = before.amount; extra.amt = after.amount; }
    this.logChange(this.state.property, this.histLabelFor(after), diff.join(' · '), after.target || after.level, extra);
  }
  // Per-charge amount timelines: the preloaded history, then anything changed this session.
  profileAmountHistory(prop){
    const p = prop || this.state.property;
    const seed = this.profileAmountSeed();
    return this.profileRows(p).map(r => {
      const s = seed[r.mits];
      const sess = this.state.histLog.filter(e => e.prop === p && String(e.chargeId) === String(r.id) && e.amt);
      let hist = s ? s.hist.slice() : [];
      if (!hist.length && sess.length) hist = [['pre', sess[0].amtFrom]];
      sess.forEach(e => hist.push(['now', e.amt]));
      if (!hist.length) return null;
      const by = sess.length ? sess[sess.length - 1].by : s.by;
      return { row: r, by, hist };
    }).filter(f => f && this.parseAmt(f.hist[f.hist.length - 1][1]));
  }
  // Newest first: this session's tracked changes, then the preloaded demo history beneath them.
  profileChangeLog(prop){
    const p = prop || this.state.property;
    const log = this.state.histLog.filter(e => e.prop === p).slice().reverse()
      .map(e => ({ k:'now', by:e.by, charge:e.charge, change:e.change, level:e.level, chargeId:e.chargeId }));
    const seed = this.profileAmountSeed();
    const pre = [];
    this.profileRows(p).forEach(r => {
      const s = seed[r.mits]; if (!s) return;
      s.hist.forEach((entry, i) => {
        if (!i) return;
        const from = s.hist[i-1][1], to = entry[1];
        if (this.parseAmt(from) === this.parseAmt(to)) return;
        pre.push({ k: entry[0], by: s.by, charge: this.histLabelFor(r), change: from + ' → ' + to,
          level: r.target || r.level, chargeId: r.id });
      });

    const fiscal = tile('Fiscal Year','', select('Fiscal Year Start','January'));

      gtable('140px 1fr 100px',['Type','Number','Primary'],[
        ['Office','(513) 555-0142','<span class="material-symbols-outlined" style="font-size:18px;color:#3a7d2c">check</span>'],

  // ================= RENTAL FEE PROFILE (property tab) =================
  feeProfileTab(){
    const s = this.state;
    if (s.setup && s.setup.step === 'saving') return this.feeProfileLoading();
    if (this.profStatus() === 'active') return this.feeProfileBody();
    return this.feeProfileEmpty();
  }
  feeProfileEmpty(){
    return `<div style="flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:48px 24px;text-align:center">
      <img src="assets/logo-rentmanager-mark.svg" alt="" style="width:76px;height:76px">
      <div style="font-size:16px;font-weight:600;color:#666">Manage this property&rsquo;s charges in one place</div>
      <div style="font-size:14px;color:#666;line-height:1.5">A Rental Fee Profile brings your charges, deposits, and pricing together for setup, move-ins, quotes, and listings.&nbsp; <a data-act="toast" data-arg="Opens contextual help" style="color:var(--ac,#008dd5);cursor:pointer;white-space:nowrap">Learn More</a></div>
      <button data-act="setupOpen" class="btn-pri" style="margin-top:4px;height:36px;padding:0 18px;border-radius:4px;font-size:14px">Setup Fee Profile</button>
    </div>`;
  }
  feeProfileLoading(){
    return `<div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:80px 24px">
      <span style="position:relative;width:104px;height:104px;display:flex;align-items:center;justify-content:center">
        <span style="position:absolute;inset:0;border:5px solid #fbe4cf;border-top-color:#f58220;border-radius:50%;animation:spin 0.9s linear infinite"></span>
        <span class="material-symbols-outlined" style="font-size:46px;color:var(--ac,#008dd5)">apartment</span>
      </span></div>`;
  }
  // Charge Level pill — Property / a unit-type name / Unit N / ORI.
  chargeLevelPill(r){
    const cls = { 'Property':'lvl-prop', 'Unit Type':'lvl-ut', 'Unit':'lvl-unit', 'ORI':'lvl-ori' }[r.level] || 'lvl-prop';
    const label = r.level === 'Unit Type' ? (r.target || 'Unit Type')
      : r.level === 'Unit' ? ('Unit ' + (r.target || ''))
      : r.level === 'ORI' ? 'ORI' : 'Property';
    return `<span class="lvl ${cls}">${label}</span>`;
  }
  // Marketing/MITS status for one charge. Hovering lists the exact fields still required, so the
  // work required is visible from the list without opening every charge.
  mitsStatusCell(r){
    const missing = this.mitsMissing(r);
    const pill = (t) => `<span style="display:inline-flex;align-items:center;gap:5px;background:#fdf3e3;border-radius:12px;padding:2px 9px;cursor:default"><span class="material-symbols-outlined" style="font-size:15px;color:#b35a00">error</span><span style="font-size:13px;color:#7a5a2a;white-space:nowrap">${t}</span></span>`;
    // One missing field is named outright; more than one needs the hover to list them.
    if (missing.length === 1) return pill('Needs ' + missing[0]);
    if (missing.length) {
      return `<span class="tipw" style="display:inline-flex">${pill(missing.length + ' needed')}<span class="tip" style="left:auto;right:-4px;top:26px;width:auto;min-width:190px;max-width:280px;padding:14px 16px"><span style="display:block;font-size:14px;font-weight:600;color:#13314c;padding-bottom:9px;border-bottom:1px solid #e3e9ee">${missing.length} fields still required:</span><span style="display:flex;flex-direction:column;gap:10px;padding-top:11px">${missing.map(n=>`<span style="font-size:14px;color:#13314c;white-space:nowrap">${n}</span>`).join('')}</span></span></span>`;
    }
    // Every field is in place; Include on listings decides whether the charge actually goes out.
    if (!r.ils) {
      return `<span style="display:inline-flex;align-items:center;gap:5px" title="All fields filled in — this charge isn't included on listings"><span class="material-symbols-outlined" style="font-size:17px;color:#8a9aa8">visibility_off</span><span style="font-size:13px;color:#8a9aa8;white-space:nowrap">Charge excluded</span></span>`;
    }
    return `<span style="display:inline-flex;align-items:center;gap:5px"><span class="material-symbols-outlined" style="font-size:17px;color:#12a150">check_circle</span><span style="font-size:13px;color:#13314c;white-space:nowrap">Charge ready</span></span>`;
  }
  levelCounts(){
    const rows = this.profileRows();
    const c = { all: rows.length, 'Property':0, 'Unit Type':0, 'Unit':0, 'ORI':0 };
    rows.forEach(r => { if (c[r.level] != null) c[r.level]++; });
    return c;
  }
  visibleRows(){
    const sel = this.state.lvlSel;
    return this.profileRows()
      .filter(r => sel === 'all' || r.level === sel)
      .filter(r => this.matchesFilters(r));
  }
  // Applied filter-panel criteria. Text fields honour the chosen Search Option.
  matchesFilters(r){
    const f = this.state.pfFilters; if (!f) return true;
    const op = f.op || 'Contains';
    const test = (needle, hay) => {
      if (!needle) return true;
      const n = String(needle).toLowerCase(), h = String(hay || '').toLowerCase();
      return op === 'Equals' ? h === n : op === 'Starts with' ? h.indexOf(n) === 0 : h.indexOf(n) >= 0;
    };
    const oneTime = /-one$/.test(r.group || '');
    if (f.type && f.type.length === 1) {
      if (f.type[0] === 'Recurring' && oneTime) return false;
      if (f.type[0] === 'One-Time' && !oneTime) return false;
    }
    if (!test(f.ctype, r.mits)) return false;
    if (!test(f.freq, r.freq)) return false;
    if (!test(f.name, (r.listing && r.listing.name) || r.name)) return false;
    if (!test(f.comment, r.desc)) return false;
    return true;
  }
  activeFilterCount(){
    const f = this.state.pfFilters; if (!f) return 0;
    let n = 0;
    if (f.type && f.type.length === 1) n++;
    ['ctype','freq','name','comment'].forEach(k => { if (f[k]) n++; });
    if (f.past) n++; if (f.future) n++;
    return n;
  }
  levelCountChip(label, count, key, icon){
    const on = this.state.lvlSel === key;
    return `<span data-act="lvlSel" data-arg="${key}" class="chip${on?' on':''}">${icon?`<span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5)">${icon}</span>`:''}${label}<span class="cnt">${count}</span></span>`;
  }
  feeProfileToolbar(){
    const c = this.levelCounts();
    const on = this.state.groupByReq;

  profMenuHTML(){

  // Recurring / One-Time subtable inside a profile section.
  profileTable(kind, rows, group, opts){

  // Requirement-grouped section: Recurring + One-Time subtables under one requirement heading.

    const inner = this.profileTable('rec', rec, grp+'rec') + this.profileTable('one', one, grp+'one');

  // ================= SETUP WIZARD =================
  setupDots(step){
    const dot = on => `<span style="width:7px;height:7px;border-radius:50%;background:${on?'#8a9aa8':'#d7dee5'};display:inline-block"></span>`;

  // The properties this setup run applies to — one for a single property, many for a bulk run.
  setupProps(){ const c = this.state.setup; return (c && c.props) || []; }
  // The rows exactly as save will write them, so the review step counts what actually lands.
  setupRows(prop){
    const c = this.state.setup; if (!c) return [];
    const p = prop || this.setupCurProp();
    const ex = this.setupExclFor(p);
    return this.setupCandidates().filter(r => !ex[r.id]).map(r => {
      const req = this.setupRequirement(r, p);
      const suffix = /-one$/.test(r.group) ? '-one' : '-rec';

  infoTip(inner, width){
    const show = "var t=this.querySelector('.tipf');t.style.display='block';var r=this.getBoundingClientRect();"
      + "var w=t.offsetWidth,h=t.offsetHeight;var l=r.right-w;if(l<8)l=8;if(l+w>window.innerWidth-8)l=window.innerWidth-8-w;"
      + "var y=r.bottom+6;if(y+h>window.innerHeight-8)y=r.top-h-6;"
      + "if(y+h>window.innerHeight-8)y=window.innerHeight-8-h;if(y<8)y=8;"
      + "t.style.left=l+'px';t.style.top=y+'px';";
    const hide = "this.querySelector('.tipf').style.display='none';";
    return `<span onmouseenter="${show}" onmouseleave="${hide}" onclick="event.stopPropagation()" style="display:inline-flex"><span class="material-symbols-outlined" style="font-size:16px;color:var(--ac,#008dd5);cursor:pointer">info</span>`
      + `<span class="tipf" style="display:none;position:fixed;left:0;top:0;width:${width||310}px;padding:14px 16px;background:#fff;border:1px solid #cedbe7;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,0.18);font-size:13px;color:#13314c;line-height:1.5;z-index:400">${inner}</span></span>`;
  }
  reqHelp(){
    const term = (t,d) => `<span style="display:block;font-size:13px;font-weight:400;color:#13314c;white-space:normal"><strong style="font-weight:600">${t}</strong> — ${d}</span>`;
    return this.infoTip(``
      + `<span style="display:block;font-size:14px;font-weight:600;color:#13314c;padding-bottom:9px;border-bottom:1px solid #e3e9ee">Charge Requirement</span>`
      + `<span style="display:block;font-size:13px;font-weight:400;color:#666;white-space:normal;padding:11px 0 12px;line-height:1.5">Whether a charge applies to everyone, is the resident's to choose, or only applies under certain conditions.</span>`
      + `<span style="display:flex;flex-direction:column;gap:10px">`
      + term('Required', 'Applies to every resident. There is no way to opt out.')
      + term('Optional', 'The resident decides whether to add it, like a pet, a parking space, or a storage unit.')

      + `</span>`);
  }
  setupStep2(){
    const c = this.state.setup;

    const box = on => `<span style="width:18px;height:18px;border-radius:3px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex:none;${on?'background:#f58220;border:1px solid #f58220':'background:#fff;border:1px solid #b3b3b3'}">${on?'<span class="material-symbols-outlined" style="font-size:14px;color:#fff;font-weight:600">check</span>':''}</span>`;
    const table = (label, rows, rec) => {
      const cols = '44px 120px minmax(150px,1fr) 110px 110px 150px';

      const hc = (t,i) => `<span style="padding:8px 10px;font-size:12px;font-weight:600;color:#13314c;white-space:nowrap;${/Amount/.test(t)?'justify-content:flex-end;display:flex;':''}${t===heads[5]?'display:flex;align-items:center;gap:5px;':''}">${t}${t===heads[5]?this.reqHelp():''}</span>`;

      const reqSel = (r, off) => { const v = this.setupRequirement(r);
        return `<span style="display:flex;align-items:center;min-height:38px;padding:6px 10px" onclick="event.stopPropagation()"><select ${off?'disabled':''} onchange="window.__setupReq('${r.id}', this.value)" style="width:100%;height:30px;border:1px solid ${off?'#e3e9ee':'#cedbe7'};border-radius:4px;background:${off?'#f7f9fb':'#f5f8fa'};font:400 13px Roboto,sans-serif;color:${off?'#c1cbd4':'#13314c'};padding:0 4px;cursor:${off?'default':'pointer'}"><option value="" ${v?'':'selected'}>Select</option>${['Required','Optional','Situational'].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select></span>`; };
      return `<div style="font-size:13px;color:#666;padding:12px 0 6px">${label} (${rows.length})</div>

        <div style="display:grid;grid-template-columns:${cols};border-bottom:1px solid #e3e9ee">${heads.map(hc).join('')}</div>
        ${rows.map(r=>{ const off = !!ex[r.id]; return `<div data-act="setupToggle" data-arg="${r.id}" style="display:grid;grid-template-columns:${cols};align-items:center;border-bottom:1px solid #f0f4f7;cursor:pointer;background:${off?'#fbfcfd':'transparent'}">
          <span style="display:flex;align-items:center;justify-content:center;min-height:38px">${box(!off)}</span>
          ${cell(r.mits,'',off)}${cell(r.desc||r.name,'',off)}

          <span style="display:flex;align-items:center;min-height:38px;padding:6px 10px;${off?'opacity:0.45':''}">${this.chargeLevelPill(r)}</span>
          ${reqSel(r, off)}</div>`; }).join('')}
        </div></div></div>`;
    };
    // Records a per-row requirement choice against the property being reviewed, without losing it
    // when the list re-renders.
    window.__setupReq = (id, val) => this.setState(s => {
      const p = this.setupCurProp();

    });
    const many = props.length > 1;
    // A pill per property, so it's plain that this step repeats and which one is being answered.
    const pill = (p, i) => { const done = i < (c.pi || 0), now = i === (c.pi || 0);
      return `<span style="display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:3px 10px;font-size:13px;white-space:nowrap;${now?'background:var(--ac,#008dd5);color:#fff':(done?'background:#e4f3ea;color:#2f5d43':'background:#eef2f5;color:#8a9aa8')}">${done?'<span class="material-symbols-outlined" style="font-size:15px">check</span>':''}${p}</span>`; };
    return `<div style="display:flex;flex-direction:column;gap:2px">
      ${!many ? '' : `<div style="display:flex;flex-direction:column;gap:8px;background:#f0f6fb;border:1px solid #cedbe7;border-radius:4px;padding:12px 14px;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:10px">
          <span class="material-symbols-outlined" style="font-size:19px;color:var(--ac,#008dd5);flex:none">home</span>
          <span style="font-size:15px;font-weight:600;color:#13314c">${cur}</span>
          <div style="flex:1"></div>
          <span style="font-size:13px;font-weight:600;color:var(--ac,#008dd5);white-space:nowrap">Property ${(c.pi||0)+1} of ${props.length}</span>
        </div>
        <span style="font-size:13px;color:#4a5b6b;line-height:1.45">You're choosing charges for <strong style="font-weight:600">${cur}</strong> only. Each property is set up separately, so you'll pick again for ${props.length - (c.pi||0) - 1 === 1 ? 'the last one' : 'each of the remaining ' + (props.length - (c.pi||0) - 1)} after this.</span>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${props.map(pill).join('')}</div>
      </div>`}
      <div style="display:flex;align-items:baseline;gap:12px"><span style="font-size:14px;font-weight:600;color:#13314c">Select which charges to include</span><div style="flex:1"></div><span style="font-size:13px;color:#4a5b6b">${inc} of ${all.length} included</span></div>
      <span style="font-size:13px;color:#8a9aa8;line-height:1.5">Unchecked charges won't be added. They won't apply to future move-ins, quotes, or listings. Existing tenant charges are unaffected either way. Set a Charge Requirement on any charge you want enabled for online listings &mdash; a charge can't be listed without one.</span>
      ${table('Recurring Charges', all.filter(r=>!/-one$/.test(r.group)), true)}
      ${table('One-Time Charges', all.filter(r=>/-one$/.test(r.group)), false)}
    </div>`;
  }
  // Saving happens inside the same overlay, so review → saving → success is one continuous surface.
  setupSaving(){

  // Step 3: the profile takes over charging for the whole property, so the change gets reviewed and
  // acknowledged before it lands. Listed properties additionally get told what it does to the listing.
  setupStep3(){
    const props = this.setupProps();
    const one = props.length === 1;
    // Reads as one property or as a set, without two versions of the screen.
    const prop = one ? props[0] : props.length + ' properties';
    const all = this.setupCandidates();
    // Each property carries its own selections, so the totals add up across them.
    const per = props.map(p => ({ p, rows: this.setupRows(p) }));
    const rows = per.reduce((a, x) => a.concat(x.rows), []);
    const left = all.length * props.length - rows.length;
    const rec = rows.filter(r => !/-one$/.test(r.group)).length;
    const reqN = rows.filter(r => /^req/.test(r.group)).length;
    const optN = rows.filter(r => /^opt/.test(r.group)).length;
    const sitN = rows.filter(r => /^sit/.test(r.group)).length;
    const indN = rows.filter(r => /^ind/.test(r.group)).length;
    const stat = (n, l) => `<div style="flex:1;min-width:130px;background:#f7f9fb;border:1px solid #e3e9ee;border-radius:4px;padding:12px 16px;display:flex;flex-direction:column;gap:2px"><span style="font-size:22px;font-weight:600;color:#13314c;line-height:1.2">${n}</span><span style="font-size:13px;color:#4a5b6b">${l}</span></div>`;
    // What the conversion does and doesn't reach. The dash row is the carve-out the user needs to see.
    const line = (icon, color, t, b) => `<div style="display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid #f0f4f7"><span class="material-symbols-outlined" style="font-size:20px;color:${color};flex:none">${icon}</span><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:14px;color:#13314c">${t}</span><span style="font-size:13px;color:#8a9aa8;line-height:1.45">${b}</span></span></div>`;
    const scope = `<div style="border:1px solid #e3e9ee;border-radius:4px;overflow:hidden">
      ${line('check_circle','#12a150','Property, unit type, unit and rentable item charges',(one?'All '+rows.length+' move onto one page':'They move onto one page per property')+'. Edit a charge once and it applies everywhere.')}
      ${line('remove','#8a9aa8','Existing tenant charges','Not touched &mdash; they keep billing as they do today.')}
    </div>`;
    // Fee transparency raises the bar on every charge, so a listed property is told what is still missing.
    const ready = rows.filter(r => this.mitsComplete(r)).length;

      </span></div>`;

      </div>
      ${one ? '' : `<div style="display:flex;flex-direction:column;gap:6px">
        <span style="font-size:14px;font-weight:600;color:#13314c">What each property gets</span>
        <div style="border:1px solid #e3e9ee;border-radius:4px;overflow:hidden">${per.map((x,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:11px 16px;${i?'border-top:1px solid #f0f4f7':''}">

        ${stat(left, left === 1 ? 'Charge left out' : 'Charges left out')}
        ${stat(indN ? `${reqN} / ${optN} / ${sitN} / ${indN}` : `${reqN} / ${optN} / ${sitN}`,
          'Required / Optional / Situational' + (indN ? ' / Not set' : ''))}
      </div>
      ${ils}
      ${scope}
    </div>`;

  // Change log for the property's profile: what changed and when, plus a per-charge amount timeline.
  // Deliberately no trend graphs — the timeline itself carries the direction.
  profHistHTML(){
    const h = this.state.profHist; if (!h) return '';
    const prop = h.prop;
    const log = this.profileChangeLog(prop);
    const amt = this.profileAmountHistory(prop);
    const tile = (title, sub, inner, right) => `<div style="border:1px solid #cedbe7;border-radius:4px;overflow:hidden;background:#fff">

      ${inner}</div>`;
    const hc = (t,i,extra) => `<span style="padding:8px 12px${i===0?' 8px 16px':''};font-size:12px;font-weight:500;color:#666;white-space:nowrap;${extra||''}">${t}</span>`;
    const td = (t,extra) => `<span style="display:flex;align-items:center;min-height:38px;padding:6px 12px;font-size:13px;color:#13314c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${extra||''}">${t}</span>`;

    // A charge name opens its details, but only while the charge is still on the profile — a
    // "Charge removed" entry has nothing left to open.
    const liveIds = this.profileRows(prop).map(r => String(r.id));
    const chargeLink = (id, inner, extra) => `<span data-act="rowDetails" data-arg="${id}" style="display:flex;align-items:center;min-height:38px;padding:6px 12px;font-size:13px;color:var(--ac,#008dd5);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${extra||''}" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${inner}</span>`;
    const chargeCell = e => e.chargeId != null && liveIds.indexOf(String(e.chargeId)) >= 0
      ? chargeLink(e.chargeId, e.charge) : td(e.charge);

    // ---- Change log ----
    const lcols = '104px 132px minmax(160px,1fr) minmax(230px,1.6fr) 130px';
    const lhead = `<div style="display:grid;grid-template-columns:${lcols};background:#f5f8fa;border-bottom:1px solid #cedbe7">${['Date','Changed by','Charge','Change','Charge Level'].map((t,i)=>hc(t,i)).join('')}</div>`;
    const lbody = log.map(e => `<div style="display:grid;grid-template-columns:${lcols};align-items:center;border-bottom:1px solid #ebf1f5">
      ${td(this.histLabel(e.k), 'padding-left:16px;color:' + (e.k==='now'?'#12a150;font-weight:500':'#13314c'))}
      ${td(e.by)}${chargeCell(e)}${td(e.change,'color:#13314c;font-weight:500;white-space:normal;line-height:1.45;padding-top:9px;padding-bottom:9px')}${td(e.level,'color:#4a5b6b')}
    </div>`).join('');

    // ---- Amount history per charge ----
    const acols = 'minmax(180px,1fr) 130px 110px 160px 140px 60px';
    const ahead = `<div style="display:grid;grid-template-columns:${acols};background:#f5f8fa;border-bottom:1px solid #cedbe7">${['Charge','Charge Level','Current','Change over time','Last changed by',''].map((t,i)=>hc(t,i)).join('')}</div>`;
    const abody = amt.map((f, idx) => {
      const open = !!h.exp[idx];
      const first = this.parseAmt(f.hist[0][1]), cur = this.parseAmt(f.hist[f.hist.length-1][1]);
      const money = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
      const delta = f.hist.length < 2 || first === cur
        ? `<span style="font-size:13px;color:#8a9aa8">No change</span>`
        : `<span style="font-size:13px;color:${cur>first?'#b3261e':'#3a7d2c'};font-weight:500">${cur>first?'+':'−'}${money(Math.abs(cur-first)).replace('$','$')}</span><span style="font-size:12px;color:#8a9aa8">&nbsp;${f.hist[0][0]==='pre'?'this session':'since '+this.histLabel(f.hist[0][0])}</span>`;
      const sub = !open ? '' : `<div style="background:#f5f8fa;border-bottom:1px solid #ebf1f5;padding:6px 16px 12px 32px">${f.hist.map((e,i) => {
        const prev = i > 0 ? this.parseAmt(f.hist[i-1][1]) : null, v = this.parseAmt(e[1]);
        const dir = prev === null ? '<span style="color:#c9d4dd">•</span>'
          : v > prev ? '<span style="color:#b3261e;font-weight:600">▲</span>'
          : v < prev ? '<span style="color:#3a7d2c;font-weight:600">▼</span>' : '<span style="color:#8a9aa8">—</span>';
        const note = i === 0 ? 'Initial amount' : prev === v ? 'No change' : 'from ' + f.hist[i-1][1];
        return `<div style="display:flex;align-items:center;gap:14px;padding:6px 0;border-bottom:1px dashed #dce6ee">
          <span style="width:78px;font-size:12px;color:${e[0]==='now'?'#12a150':'#8a9aa8'}">${this.histLabel(e[0])}</span>
          <span style="width:72px;font-size:13px;font-weight:500;color:#13314c">${e[1]}</span>
          <span style="width:16px;text-align:center">${dir}</span>
          <span style="font-size:12px;color:#8a9aa8">${note}</span></div>`;
      }).join('')}</div>`;
      return `<div style="border-bottom:1px solid #ebf1f5">
        <div data-act="profHistExp" data-arg="${idx}" style="display:grid;grid-template-columns:${acols};align-items:center;cursor:pointer" onmouseover="this.style.background='#f4f8fb'" onmouseout="this.style.background=''">
          ${chargeLink(f.row.id, `${f.row.desc||f.row.name}<span style="display:block;font-size:11px;color:#8a9aa8">${f.row.mits}</span>`, 'padding-left:16px;flex-direction:column;align-items:flex-start;justify-content:center;white-space:normal')}
          <span style="display:flex;align-items:center;min-height:38px;padding:6px 12px">${this.chargeLevelPill(f.row)}</span>
          ${td(f.row.amount,'font-weight:500')}
          <span style="display:flex;align-items:baseline;min-height:38px;padding:6px 12px;white-space:nowrap">${delta}</span>
          ${td(f.by,'color:#4a5b6b')}
          <span style="display:flex;align-items:center;justify-content:center;min-height:38px"><span class="material-symbols-outlined" style="font-size:20px;color:var(--ac,#008dd5)">${open?'expand_less':'expand_more'}</span></span>
        </div>${sub}</div>`;
    }).join('');
    const empty = `<div style="padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center"><span class="material-symbols-outlined" style="font-size:28px;color:#c9d4dd">history</span><span style="font-size:13px;color:#8a9aa8">No amount changes recorded for these charges yet.</span></div>`;

    return `<div data-act="profHistClose" style="position:fixed;inset:0;background:rgba(19,49,76,0.5);display:flex;align-items:center;justify-content:center;z-index:120">
      <div data-act="noop" style="width:980px;max-width:96vw;max-height:92vh;background:#fff;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,0.3);display:flex;flex-direction:column;overflow:hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #cedbe7"><span style="font-size:20px;color:#13314c">Rental Fee Profile History</span><span style="display:inline-flex;align-items:center;gap:10px"><span data-act="toast" data-arg="Help" class="material-symbols-outlined" style="font-size:22px;color:var(--ac,#008dd5);cursor:pointer">help</span><span data-act="profHistClose" class="material-symbols-outlined" style="font-size:22px;color:var(--ac,#008dd5);cursor:pointer">close</span></span></div>
        <div style="flex:1;min-height:0;overflow-y:auto;background:#f5f8fa;padding:16px 20px;display:flex;flex-direction:column;gap:16px">
          <span style="font-size:13px;color:#4a5b6b">Every change made to the charges on <strong style="font-weight:600">${prop}</strong>.</span>
          ${tile('Amount history by charge', amt.length ? 'Click a charge for its full timeline' : '', amt.length ? `<div style="overflow-x:auto"><div style="min-width:800px">${ahead}${abody}</div></div>` : empty,
            amt.length ? `<a data-act="toast" data-arg="Export history" style="font-size:13px;color:var(--ac,#008dd5);cursor:pointer">Export</a>` : '')}
          ${tile('Change log', 'Newest first', `<div style="overflow-x:auto"><div style="min-width:760px">${lhead}${lbody}</div></div>`)}
        </div>
        <div style="display:flex;justify-content:flex-end;padding:12px 20px;border-top:1px solid #cedbe7;background:#f5f8fa"><button data-act="profHistClose" class="btn-out" style="height:36px;min-height:36px;padding:0 28px;border-radius:4px;font-size:14px">OK</button></div>
      </div></div>`;
  }
  // Unit types present at this property, derived from its units.
  utData(){ const seen=[]; this.units().forEach(u=>{ if(!seen.some(t=>t.name===u.type)) seen.push({name:u.type,units:0,occ:0}); }); this.units().forEach(u=>{ const t=seen.find(x=>x.name===u.type); t.units++; if(u.tenant&&!/vacant/i.test(u.tenant)) t.occ++; }); return seen; }
  // Selected-scope header row (mirrors the property scoreboard) used by the Unit Type Fees and Unit Fees tabs.
  ufUnits(){ const p=this.state.property; return this.units().map(u=>Object.assign({}, u, { prop:p })); }
  recChargesTile(scope){
    return `<div class="tile">
      <div class="thead2"><span class="ttl">Recurring Charges</span><div style="flex:1"></div><a data-act="openFeeProfile" style="font-size:14px;color:var(--ac,#008dd5)">Open Rental Fee Profile</a><span data-act="recViewOpen" data-arg="${scope}" class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5);cursor:pointer" title="View recurring charges">open_in_new</span></div>
      ${this.recChargesTableHTML({scope, edge:true})}
    </div>`;
  }
  // Shared Recurring Charges table.
  // opts.scope 'property' (default) shows property-level charges only; 'unit' also shows
  // unit-type and unit charges (they trickle down), including an override example.
  recChargesTableHTML(opts){
    opts=opts||{};
    const unit = opts.scope==='unit';
    const two = !!opts.twoComment;
    const rec = this.propertyCharges()
      .filter(f=>!f.excluded && !/-one$/.test(f.group))
      .filter(f=>unit || f.level==='Property');
    const lvlMap={ 'Property':{c:'#1570ef',l:'Property'}, 'Unit type':{c:'#d92d20',l:'Unit Type'}, 'Unit Type':{c:'#d92d20',l:'Unit Type'}, 'Unit':{c:'#099250',l:'Unit'}, 'ORI':{c:'#6a4aa8',l:'ORI'}, 'Tenant':{c:'#98a2b3',l:'Tenant'} };
    const recCols = two ? '32px 94px minmax(100px,1fr) minmax(120px,1fr) minmax(120px,1fr) 80px 92px 92px 110px' : '32px 94px minmax(110px,1fr) minmax(150px,1fr) 84px 96px 96px 124px';
    const rh=(t,align)=>`<span style="display:flex;align-items:center;height:32px;box-sizing:border-box;padding:0 8px;font-size:12px;font-weight:500;letter-spacing:0.5px;color:#13314c;background:#fff;border-bottom:1px solid #cedbe7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${align==='right'?'justify-content:flex-end;text-align:right':''}">${t}</span>`;
    const heads = two ? [['',''],['',''],['Charge Type',''],['Comment',''],['Comment',''],['Frequency','right'],['From Date',''],['To Date',''],['Amount','right']] : [['',''],['',''],['Charge Type',''],['Comment',''],['Frequency','right'],['From Date',''],['To Date',''],['Amount','right']];
    const recHead=`<div style="display:grid;grid-template-columns:${recCols}">${heads.map(h=>rh(h[0],h[1])).join('')}</div>`;
    const cell=(t,align,color)=>`<span style="display:flex;align-items:center;height:36px;box-sizing:border-box;padding:0 8px;font-size:14px;color:${color||'#13314c'};border-bottom:1px solid #ebf1f5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${align==='right'?'justify-content:flex-end;text-align:right':''}">${t}</span>`;
    const barFor=(c)=>`<span style="display:flex;justify-content:center;height:36px;box-sizing:border-box;border-bottom:1px solid #ebf1f5"><span style="width:10px;background:${c}"></span></span>`;
    const row=(idx,bar,level,code,comment,amount,commentColor,comment2)=>{
      const rowBg = (idx%2===1) ? '#f5f8fa' : '#fff';
      const mid = two ? `${cell(comment,'',commentColor||'#666')}${cell(comment2||'','',commentColor||'#666')}` : cell(comment,'',commentColor||'#666');
      return `<div style="display:grid;grid-template-columns:${recCols};background:${rowBg}">${barFor(bar)}${cell(level)}${cell(code)}${mid}${cell('Monthly','right')}${cell('01/01/2026')}${cell('—','','#b3b3b3')}${cell(amount,'right')}</div>`;
    };
    let idx=0;
    // Property-level charges (shown everywhere).
    let recRows=rec.map((f)=>{ const lv=lvlMap[f.level]||lvlMap['Property']; return row(idx++, lv.c, lv.l, f.mits, f.desc, f.amount); }).join('');
    if(unit){
      // Unit type charge trickles down.
      recRows += row(idx++, lvlMap['Unit type'].c, 'Unit Type', 'UTILITY', 'Additional trash valet', '$4.00');
      // Unit-level override example.
      const cmt=`Trash service<span style="margin-left:8px;background:#fdeedd;color:#b35a00;border-radius:4px;padding:1px 8px;font-size:12px">Override</span>`;
      const amt=`<s style="color:#8a9aa8;font-size:12px">$28.00</s> <span style="color:#8a9aa8">→</span> <span style="font-weight:600;color:#b35a00">$32.00</span>`;
      recRows += row(idx++, lvlMap['Unit'].c, 'Unit', 'UTILITY', cmt, amt);
    }
    if(opts.exclusion){
      const excLv = unit ? lvlMap['Unit'] : lvlMap['Property'];
      const excPill=`<span style="margin-left:8px;background:#eef1f4;color:#8a9aa8;border-radius:4px;padding:1px 8px;font-size:12px">Excluded</span>`;
      recRows += row(idx++, excLv.c, excLv.l, '<s style="color:#8a9aa8">PARKING</s>', `<s style="color:#8a9aa8">Covered parking</s>${excPill}`, '<s style="color:#8a9aa8">$75.00</s>', '#8a9aa8');
    }
    // edge: the tile already draws the boundary, so skip the table's own border.
    return opts.edge ? `<div style="overflow-x:auto">${recHead}${recRows}</div>`
      : `<div style="border:1px solid #cedbe7;border-radius:4px;overflow:hidden"><div style="overflow-x:auto">${recHead}${recRows}</div></div>`;
  }
  // "View Recurring Charges" modal opened from the property tile's pop-out icon (Figma 2385-32329).
  // Legacy "View Recurring Charges" overlay (pre-conversion): full charge register + convert callout.
  // Setup callout for the overlay (mock 2627-31642): text left, actions right, dismiss top-right.
  recViewCallout(){
    const p = this.state.property;
    if (this.profStatus(p) === 'active' || !this.state.recViewNote) return '';
    const n = this.setupCandidates().length;
    return `<div style="display:flex;align-items:flex-start;gap:16px;background:#e8f4fc;border-radius:4px;padding:14px 16px">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
        <span style="font-size:14px;font-weight:600;color:#13314c">This property has ${n} fees. Manage them in one place.</span>
        <span style="font-size:13px;color:#4a5b6b;line-height:1.5">A Rental Fee Profile centralizes your charges, deposits, and pricing on the property, simplifying setup, move-ins, and quotes. If you publish listings, fee transparency comes ready-made. Current tenant charges are unaffected.</span>
      </div>

        <button data-act="setupOpen" class="btn-pri" style="height:34px;min-height:34px;padding:0 16px;border-radius:4px;font-size:14px;white-space:nowrap">Setup Fee Profile</button>

      </div>
      <span data-act="recViewNoteDismiss" class="material-symbols-outlined" style="font-size:20px;color:var(--ac,#008dd5);cursor:pointer;flex:none">close</span>
    </div>`;
  }
  recViewHTML(){
    if(!this.state.recView) return '';
    const unitScope = this.state.recView === 'unit';

    const rows = this.propertyCharges().filter(f => !f.excluded && !/-one$/.test(f.group))
      .filter(f => unitScope || f.level === 'Property');
    const total = rows.length;
    const sum = rows.reduce((n, r) => n + this.parseAmt(r.amount), 0);
    const lvl = { 'Property':'#1570ef', 'Unit Type':'#d92d20', 'Unit type':'#d92d20', 'Unit':'#099250', 'ORI':'#6a4aa8' };
    const cb = (label) => `<label style="display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ac,#008dd5);cursor:pointer"><span style="width:18px;height:18px;border-radius:3px;box-sizing:border-box;border:1px solid var(--ac,#008dd5);background:#fff;flex:none"></span>${label}</label>`;
    const orange = `<span style="width:18px;height:18px;border-radius:3px;box-sizing:border-box;background:#f58220;border:1px solid #f58220;display:flex;align-items:center;justify-content:center;flex:none"><span class="material-symbols-outlined" style="font-size:14px;color:#fff;font-weight:600">check</span></span>`;

  // Filters dropdown anchored to the profile toolbar's tune button (Figma 2496-54203).
  pfFilterHTML(){
    const p = this.state.pfFilter; if (!p) return '';
    const f = this.state.pfFilters || {};
    const W = 330;
    const left = Math.max(8, Math.min(p.x - W, window.innerWidth - W - 8));
    // Anchor below the trigger, but cap the height to the room actually available — and when there
    // isn't enough, lift the panel so its footer never lands past the bottom of the window.
    const gap = 8, vh = window.innerHeight;
    const cap = Math.min(660, Math.round(vh * 0.8));
    const below = vh - p.y - gap;
    let top = p.y, maxH = Math.min(cap, below);
    if (below < 300) { maxH = Math.min(cap, vh - gap * 2); top = Math.max(gap, vh - gap - maxH); }
    const lab = (t, menu) => `<span style="display:flex;align-items:center;font-size:13px;color:#5a6773">${t}${menu?`<div style="flex:1"></div><span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5);cursor:pointer">menu</span>`:''}</span>`;
    const inp = (id, val, ph, icon) => `<div style="display:flex;align-items:center;gap:6px;height:34px;box-sizing:border-box;background:#fff;border:1px solid #cedbe7;border-radius:4px;padding:0 8px">${icon?`<span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5);flex:none">${icon}</span>`:''}<input id="${id}" value="${(val||'').replace(/"/g,'&quot;')}" placeholder="${ph||''}" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font:400 14px Roboto,sans-serif;color:#13314c"></div>`;
    const dateInp = (id, val) => `<div style="flex:1;min-width:0;display:flex;align-items:center;gap:4px;height:34px;box-sizing:border-box;background:#fff;border:1px solid #cedbe7;border-radius:4px;padding:0 6px"><input id="${id}" value="${val||''}" placeholder="mm/dd/yyyy" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font:400 13px Roboto,sans-serif;color:#13314c"><span class="material-symbols-outlined" style="font-size:17px;color:#5a6773;flex:none">calendar_month</span></div>`;
    const cb = (id, label, on) => `<label style="display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--ac,#008dd5);cursor:pointer"><input type="checkbox" id="${id}" ${on?'checked':''} style="width:16px;height:16px;margin:0;accent-color:var(--ac,#008dd5)">${label}</label>`;
    const field = (label, inner, menu) => `<div style="display:flex;flex-direction:column;gap:4px">${lab(label, menu)}${inner}</div>`;
    return `<div data-act="pfFilterClose" style="position:fixed;inset:0;z-index:150"></div>
      <div data-act="noop" style="position:fixed;left:${left}px;top:${top}px;width:${W}px;max-height:${maxH}px;background:#eaf4fb;border:1px solid #cedbe7;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:151;display:flex;flex-direction:column;overflow:hidden">

    const radio = (on, label, act, arg) => `<label data-act="${act}" data-arg="${arg}" style="display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#13314c;cursor:pointer"><span style="width:16px;height:16px;border-radius:50%;box-sizing:border-box;border:2px solid ${on?'var(--ac,#008dd5)':'#b3b3b3'};display:flex;align-items:center;justify-content:center;flex:none">${on?'<span style="width:8px;height:8px;border-radius:50%;background:var(--ac,#008dd5)"></span>':''}</span>${label}</label>`;

            ${chargeTable('Recurring Charges', srcRows.filter(r=>!/-one$/.test(r.group)), true)}
            ${chargeTable('One-Time Charges', srcRows.filter(r=>/-one$/.test(r.group)), false)}
          </div></div>`:''}
      </div>`;

    const propInfo = `
      ${sect('General Information', row(
        fld('Property Name *', inp({ id:'ap-name', err:a.err })),
        fld('Short Name *', inp({ id:'ap-short' }))
      ) + row(
        fld('Property Type', sel('&nbsp;')),
        fld('Display Color', sel('<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:11px;height:11px;background:#13314c;border-radius:2px"></span>Default</span>'))
      ))}
      ${sect('Other Information', row(
        fld('Property Tax ID', inp({})),
        fld('Posting Day', inp({ val:'25' }))
      ) + row(
        fld('Default Bank', sel('1000 Fifth Third - Operating Bank Account For All Prope…')),
        fld('Rent Charge Type *', sel('RC'))
      ) + row(
        fld('Statement Method', sel('&lt;Use System Default&gt; (Email)'), 2),
        fld('NSF Fee', chk(true, 'Override system default ($100.00)')),
        fld('Custom Amount', inp({ val:'15.00' }))
      ) + fld('Comment', `<textarea style="height:56px;resize:none;box-sizing:border-box;border:1px solid #cedbe7;border-radius:4px;background:#f5f8fa;padding:6px 8px;font:400 13px Roboto,sans-serif;color:#13314c;outline:none"></textarea>`))}
      ${sect('Add Unit, Unit Types, Amenities, and Users', row(
        fld('Valid Unit Types for Property', sel('All Selected')),
        fld('Property Amenities', sel('&nbsp;')),
        fld('Users with Access to Property', sel('64 Selected'))
      ) + row(
        fld('&nbsp;', chk(false, 'Automatically create a unit')),
        fld('Type of Unit to create', `<div style="height:32px;box-sizing:border-box;border:1px solid #cedbe7;border-radius:4px;background:#f5f8fa;display:flex;align-items:center;gap:6px;padding:0 8px"><span class="material-symbols-outlined" style="font-size:16px;color:#8a9aa8">search</span></div>`)
      ))}
      ${sect('Marketing Configuration', `<div style="display:flex;align-items:center;gap:24px">${radio(unitMkt===false,'Property-level Marketing','addPropMkt','property')}${radio(unitMkt,'Unit-level Marketing','addPropMkt','unit')}</div>`)}
      ${sect('Rental Fee Profile', unitMkt
        ? `<div style="display:flex;align-items:flex-start;gap:10px;opacity:0.55"><span class="material-symbols-outlined" style="font-size:18px;color:#8a9aa8;flex:none">block</span><span style="font-size:13px;color:#8a9aa8;line-height:1.5">Not available with unit-level marketing. A Rental Fee Profile centralizes charges for the whole property, so fees stay on each unit instead. Switch to property-level marketing to set one up.</span></div>`
        : `
        ${radio(!isCopy,'Blank','addPropFee','blank')}
        ${hint('Start with no fees, and add charges after the property is created.')}
        ${radio(isCopy,'Copy From','addPropFee','copy')}
        ${copyBlock}`)}`;

    const placeholder = (t) => sect(t, `<span style="font-size:13px;font-style:italic;color:#b3b3b3">No required ${t.toLowerCase()} found.</span>`);
    const body = a.nav === 'Property Information' ? propInfo : placeholder(a.nav);

    return `<div data-act="addPropClose" style="position:fixed;inset:0;background:rgba(19,49,76,0.5);display:flex;align-items:center;justify-content:center;z-index:120">
      <div data-act="noop" style="width:1180px;max-width:96vw;height:88vh;background:#f5f8fa;border-radius:4px;box-shadow:0 8px 28px rgba(0,0,0,0.3);display:flex;overflow:hidden">
        <div style="width:210px;flex:none;background:#13314c;display:flex;flex-direction:column">
          <div style="display:flex;align-items:center;gap:8px;padding:14px 16px"><span style="font-size:16px;color:#fff;flex:1">Add Property</span><span data-act="toast" data-arg="Help" class="material-symbols-outlined" style="font-size:18px;color:#7fb2dd;cursor:pointer">help</span></div>

        </div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column">
          <div style="flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px">${body}</div>

            <button data-act="addPropSave" class="btn-pri" style="height:32px;padding:0 14px;border-radius:4px;font-size:13px">Save and New</button>

          </div>

  modalHTML(){

    if (this.state.bulk) return '';
    const f = this.chargeForm(m);

      <div data-act="noop" style="width:700px;max-width:94vw;max-height:92vh;background:#fff;border:1px solid #cedbe7;border-radius:4px;box-shadow:0 3px 12px rgba(0,0,0,0.2);display:flex;flex-direction:column;overflow:hidden">

          <button data-act="addsave" class="btn-pri" style="height:36px;padding:8px 20px;font-size:14px;border-radius:4px">Save</button>

  // The charge form itself — General Details, the CRE sections and Marketing Details — shared by the
  // Charge Details overlay and by Bulk Update Fees, which frames it differently.
  chargeForm(m){
    const ed = m.edit || null;
    const isOne = /-one$/.test(m.group);
    // Property specific charges (NSF, late fees) pull every non-marketing field from the property,
    // so General Details renders locked and only the marketing details are editable.
    const spec = ed && ed.propSpecific ? ed.propSpecific : '';
    const cre = !!(m.cre || (ed && ed.cre));
    // The title names the kind of charge, and property specific charges name themselves too, so it's
    // clear which of the three overlays you're in without reading the fields.
    const kind = cre ? 'CRE Recurring' : (isOne ? 'One-Time' : 'Recurring');
    const specLabel = spec === 'NSF' ? 'NSF Fee' : spec === 'Late Charge' ? 'Late Fee' : spec;
    const title = ed ? `${kind} Charge Details${spec ? ' - ' + specLabel : ''}` : `Add ${kind} Charge`;
    const esc = s => (''+(s||'')).replace(/"/g,'&quot;');
    const lab = (t,info) => `<span style="display:inline-flex;align-items:center;gap:4px;font-size:14px;color:#666">${t}${info?`<span class="material-symbols-outlined" style="font-size:16px;color:var(--ac,#008dd5)">info</span>`:''}</span>`;
    const sect = (t,inner) => `<div style="display:flex;flex-direction:column;gap:10px"><span style="font-size:15px;font-weight:600;color:#13314c">${t}</span><div style="border:1px solid #cedbe7;border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:12px">${inner}</div></div>`;
    const dd = (id,opts,sel,o) => this.singleSelect(id,opts,sel,o);
    const cat = this.chargeCategoryMap();
    const catFor = c => cat[(c||'').toUpperCase()] || '';

    // ---- Charge Application + its target field ----
    const app = ed ? (ed.level || 'Property') : 'Property';
    const appToggle = "var v=_v;['ut','unit','ori'].forEach(function(k){var e=document.getElementById('m-appt-'+k+'-wrap');if(e)e.style.display='none'});var t={'Unit Type':'ut','Unit':'unit','ORI':'ori'}[v];if(t){var w=document.getElementById('m-appt-'+t+'-wrap');if(w)w.style.display='flex'}";
    const searchField = (id,val,ph) => `<div style="display:flex;align-items:center;gap:6px;background:#f5f8fa;border:1px solid #cedbe7;border-radius:4px;height:36px;box-sizing:border-box;padding:0 8px"><span class="material-symbols-outlined" style="font-size:18px;color:var(--ac,#008dd5)">search</span><input id="${id}" value="${esc(val)}" placeholder="${ph}" style="flex:1;min-width:0;border:none;background:transparent;outline:none;font:400 14px Roboto,sans-serif;color:#13314c"></div>`;
    const tgt = (key,label,id,val,ph,opts) => `<div id="m-appt-${key}-wrap" style="display:${app===label?'flex':'none'};flex-direction:column;gap:4px;flex:1;min-width:0">${lab(label+' *')}${opts ? dd(id, opts, val, { placeholder:'Select a '+label.toLowerCase() }) : searchField(id,val,ph)}</div>`;
    const chargeApp = `<div style="display:flex;gap:12px;align-items:flex-start">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">${lab('Charge Level *')}${dd('m-app',['Property','Unit Type','Unit','ORI'],app,{noSearch:true,js:appToggle})}</div>
      ${tgt('ut','Unit Type','m-appt-ut', app==='Unit Type'?(ed&&ed.target||''):'', '2BR/2BA')}
      ${tgt('unit','Unit','m-appt-unit', app==='Unit'?(ed&&ed.target||''):'', '2C', this.units().map(u=>u.u))}
      ${tgt('ori','ORI','m-appt-ori', app==='ORI'?(ed&&ed.target||''):'', 'Garage Spot 1')}
    </div>`;

    // ---- Charge Type typeahead; selecting one derives the Charge Category below ----
    const setCat = "var cc=this.getAttribute('data-cat');var d=document.getElementById('m-cat-disp');var e=document.getElementById('m-cat-err');var ph=document.getElementById('m-cat-ph');document.getElementById('m-cat').value=cc||'';ph.style.display='none';if(cc){d.textContent=cc;d.style.display='block';e.style.display='none';}else{d.style.display='none';e.style.display='flex';}if(window.__mitsRecheck)window.__mitsRecheck();";
    const ctItems = this.chargeTypeList().map(([c,d2]) => `<div data-cat="${catFor(c)}" data-ct="${(c+' '+d2).toLowerCase()}" onmousedown="document.getElementById('m-ctype').value='${c}';document.getElementById('m-ctype-desc').value='${d2.replace(/'/g,"")}';${setCat}document.getElementById('m-ctype-panel').style.display='none'" style="padding:8px 12px;cursor:pointer" onmouseover="this.style.background='#f0f6fb'" onmouseout="this.style.background=''"><div style="font-size:15px;color:#13314c">${c}</div><div style="font-size:13px;color:#8a9aa8">${d2}</div></div>`).join('');
    const ctypeField = `<div style="position:relative">
      <div style="display:flex;align-items:center;gap:4px;background:#f5f8fa;border:1px solid #cedbe7;border-radius:4px;height:36px;box-sizing:border-box;padding:0 8px"><span class="material-symbols-outlined" style="font-size:20px;color:var(--ac,#008dd5)">search</span><input id="m-ctype" autocomplete="off" placeholder="Search charge types" value="${esc(ed?ed.mits:'')}" onfocus="document.getElementById('m-ctype-panel').style.display='block'" onblur="var p=document.getElementById('m-ctype-panel');setTimeout(function(){p.style.display='none'},200)" oninput="var q=this.value.toLowerCase();document.getElementById('m-ctype-panel').style.display='block';document.getElementById('m-ctype-list').querySelectorAll('[data-ct]').forEach(function(el){el.style.display=(el.getAttribute('data-ct').indexOf(q)>=0?'block':'none')})" style="flex:1;min-width:0;border:none;background:transparent;outline:none;font:400 14px Roboto,sans-serif;color:#13314c"></div>
      <input type="hidden" id="m-ctype-desc" value="${esc(ed?ed.name:'')}">
      <div id="m-ctype-panel" style="display:none;position:absolute;left:0;right:0;top:40px;z-index:20;background:#fff;border:1px solid #cedbe7;border-radius:4px;box-shadow:0 3px 6px rgba(0,0,0,0.15);max-height:220px;overflow-y:auto"><div id="m-ctype-list">${ctItems}</div></div>
    </div>`;

    // ---- Amount method ----
    const src = ed ? (ed.amtMethod || 'Flat') : 'Flat';
    const amtFlat = ed && /^\$/.test(ed.amount||'') ? (ed.amount||'').replace(/^\$/,'') : '';
    const radio = (label,value,blk) => `<label style="display:inline-flex;align-items:center;gap:8px;font-size:14px;color:#666;cursor:pointer"><input type="radio" name="m-amt-r" value="${value}" data-blk="${blk}" ${src===value?'checked':''} onchange="var b=this.getAttribute('data-blk');document.getElementById('m-source').value=this.value;['flat','ref','calc'].forEach(function(k){document.getElementById('m-blk-'+k).style.display=(k===b?'flex':'none')});if(window.__calcNote)window.__calcNote()" style="accent-color:var(--ac,#008dd5);width:16px;height:16px;margin:0">${label}</label>`;

    const parseD = (v) => { const m = String(v || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (!m) return null;

  // Two charges are the same charge for copy purposes when they share charge type, frequency and
  // name at the same level — the definition the Copy Property Fees tooltip gives.
  sameCharge(a, b){
    const fq = v => { const s = String(v || ''); const m = s.match(/\d+/); return s ? (m ? m[0] : '1') : ''; };
    return String(a.mits || '').toUpperCase() === String(b.mits || '').toUpperCase()
      && fq(a.freq) === fq(b.freq)
      && String(a.name || '') === String(b.name || '')
      && String(a.level || '') === String(b.level || '')
      && String(a.target || '') === String(b.target || '');
  }
  // Copy Property Fees (mock 2575-81218). Pick a property with a profile, decide what happens to
  // charges this profile already has, then choose which of the source's charges to bring over.
  copyFeesHTML(){
    const c = this.state.copyFees; if (!c) return '';
    const prop = this.state.property;
    const sources = this.copyableProfiles().filter(p => p !== prop);

          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:12px 24px 16px;flex:none"><a data-act="kickoffClose" style="font-size:14px;color:var(--ac,#008dd5);cursor:pointer">I'll do this later</a><div style="flex:1"></div><button data-act="kickoffSave" class="btn-pri" style="height:36px;min-height:36px;padding:0 24px;border-radius:4px;font-size:14px">Save</button></div>
      </div></div>`;
  }
  // "Introducing Rental Fee Profiles" launch announcement (mock 2632-31755). Setup sends the user to
  // the register in selection mode, so the properties get picked before the bulk flow starts.
  announceHTML(){
    if (!this.state.announce) return '';
    const card = (icon, t, b) => `<div style="flex:1;min-width:0;background:#f2f6f9;border-radius:4px;padding:18px 20px 22px;display:flex;flex-direction:column;gap:12px">
      <span class="material-symbols-outlined" style="font-size:26px;color:var(--ac,#008dd5)">${icon}</span>
      <span style="font-size:15px;font-weight:600;color:#13314c;line-height:1.3">${t}</span>
      <span style="font-size:14px;color:#666;line-height:1.5">${b}</span>
    </div>`;
    return `<div data-act="announceClose" style="position:fixed;inset:0;background:rgba(19,49,76,0.5);display:flex;align-items:center;justify-content:center;z-index:145">
      <div data-act="noop" style="width:660px;max-width:96vw;max-height:92vh;background:#fff;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,0.3);display:flex;flex-direction:column;overflow:hidden">
        <div style="background:#13314c;padding:26px 32px 30px;display:flex;align-items:flex-start;gap:20px;flex:none">
          <span style="display:flex;flex-direction:column;gap:16px;min-width:0;flex:1">
            <span style="align-self:flex-start;background:#f58220;color:#fff;font-size:12px;font-weight:600;letter-spacing:0.06em;border-radius:12px;padding:4px 13px">NEW FEATURE</span>
            <span style="font-size:26px;font-weight:600;color:#fff;line-height:1.2">Introducing Rental Fee Profiles</span>
            <span style="font-size:15px;color:#e8eef4;line-height:1.55">Manage every fee your property charges in one place.<br>Show renters complete, transparent pricing on your online listings.</span>
          </span>
          <span style="flex:none;width:82px;height:82px;border-radius:50%;border:2px solid var(--ac,#008dd5);display:flex;align-items:center;justify-content:center">
            <img src="assets/logo-rentmanager-mark-white.svg" alt="" style="width:46px;height:46px">
          </span>
        </div>
        <div style="flex:1;min-height:0;overflow-y:auto;padding:24px 32px 8px">
          <div style="display:flex;gap:14px">
            ${card('layers', 'One place<br>for every fee', 'Charges, deposits, and pricing managed together on the property.')}
            ${card('person_add', 'Faster move-ins<br>and quotes', 'New residents and rent quotes pull the right charges automatically.')}
            ${card('verified', 'Fee transparency,<br>built in', 'If you advertise listings, your complete pricing displays accurately.')}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;padding:20px 32px 26px;flex:none">
          <a data-act="announceClose" style="font-size:14px;color:#666;cursor:pointer">Remind me later</a><div style="flex:1"></div>
          <button data-act="announceSetup" class="btn-pri" style="height:40px;min-height:40px;padding:0 22px;border-radius:4px;font-size:15px">Setup Rental Fee Profiles</button>
        </div>
      </div></div>`;
  }
  toastHTML(){ return this.state.toast ? `<div class="toast"><span class="material-symbols-outlined" style="font-size:18px">check_circle</span>${this.state.toast}</div>` : ''; }

  // ================= SCREENS =================
  screenHTML(){
    this._tid = 0;
    const s = this.state;
    let out = this.header();
    if (s.view === 'property') {
      out += this.ctx('Property', [{ label: s.property }], '125 of 255', 'navRegister');
      out += this.propScoreboard();
      out += this.tabRow(['General','Leasing','Documents','Rental Fee Profile'], s.propTab, 'proptab', { badge: { 'Rental Fee Profile':'New' } });
      if (s.propTab === 'Rental Fee Profile') {
        out += `<div style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden">${this.feeProfileTab()}</div>`;
      } else {
        out += `<div style="flex:1;min-height:0;display:flex;align-items:stretch;overflow:hidden"><div style="flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column"><div style="flex:1;min-width:0;padding:16px;display:flex;flex-direction:column;gap:16px;max-width:1500px;width:100%;box-sizing:border-box;margin:0 auto">${this.propGeneralBody()}</div></div>${this.rail()}</div>`;
        out += this.footer('Save property');
      }
    } else if (s.view === 'register') {
      out += `<div style="height:40px;background:var(--ac,#008dd5);display:flex;align-items:center;padding:0 16px;gap:12px;color:#fff;flex:none">
        <span style="font-size:18px;line-height:24px">Properties</span>
        <div style="flex:1"></div>
        <span data-act="toast" data-arg="Print" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">print</span>
        <span data-act="toast" data-arg="Refresh" class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">autorenew</span>
        <span class="material-symbols-outlined" style="font-size:18px;opacity:0.85;cursor:pointer">help</span>
      </div>`;
      out += `<div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column">${this.registerBody()}</div>`;
    } else {
      out += this.ctx('Unit', [{ label: s.property, act:'navProperty', arg: s.property }, { label:'Unit ' + s.unit }], '125 of 255');
      out += this.unitBody();
      out += this.footer('Save unit');
    }
    out += this.modalHTML();
    out += this.rowMenuHTML();
    out += this.recViewHTML();
    out += this.setupHTML();
    out += this.addPropHTML();
    out += this.pfFilterHTML();
    out += this.pricePreviewHTML();
    out += this.profMenuHTML();
    out += this.profHistHTML();
    out += this.kickoffHTML();
    out += this.announceHTML();
    out += this.bulkHTML();
    out += this.copyFeesHTML();
    out += this.toastHTML();
    return out;
  }
  renderVals(){
    return {
      rootRef: this.setRoot,
      onClick: this.onClick,
      screen: React.createElement('div', { style: { display:'flex', flexDirection:'column', flex:1, minHeight:0 }, dangerouslySetInnerHTML: { __html: this.screenHTML() } })
    };
  }
}
</script>
</body>
</html>
